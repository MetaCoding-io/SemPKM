name: sempkm

services:
  triplestore:
    image: eclipse/rdf4j-workbench:5.0.1
    volumes:
      - rdf4j_data:/var/rdf4j
    environment:
      JAVA_OPTS: "-Xmx1g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rdf4j-server/protocol"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sempkm

  api:
    build: ./backend
    ports:
      - "8001:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./backend/ontologies:/app/ontologies:ro
      - sempkm_data:/app/data
      - ./docs:/app/docs:ro
      - ./apps:/app/apps:ro
      - frontend_assets:/app/frontend_assets:ro
    env_file: .env
    environment:
      TRIPLESTORE_URL: ${TRIPLESTORE_URL:-http://triplestore:8080/rdf4j-server}
      REPOSITORY_ID: ${REPOSITORY_ID:-sempkm}
      BASE_NAMESPACE: ${BASE_NAMESPACE:-https://example.org/data/}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/sempkm.db}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_DURATION_DAYS: ${SESSION_DURATION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # SMTP (optional - enables magic link emails and invitations)
      # When not configured, magic link tokens are returned directly in the browser.
      # SMTP_HOST: ${SMTP_HOST:-}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_USER: ${SMTP_USER:-}
      # SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # OpenTelemetry tracing
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      triplestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sempkm

  frontend:
    build: ./frontend
    ports:
      - "4000:80"
    volumes:
      - ./frontend/static:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_assets:/srv/built-assets
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sempkm

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "10000"
    mem_limit: 512m
    networks:
      - sempkm

networks:
  sempkm:

volumes:
  rdf4j_data:
  sempkm_data:
  frontend_assets:
