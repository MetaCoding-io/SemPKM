server {
    listen 80;
    server_name localhost;

    # Hide nginx version from response headers and error pages
    server_tokens off;

    # ── HTTP Security Headers (applied to all responses) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://esm.sh https://cdn.jsdelivr.net; frame-ancestors 'none'" always;

    # Preserve percent-encoded slashes (%2F) in proxied URIs.
    # Without this, nginx decodes %2F to / and then merge_slashes collapses
    # // to /, which breaks IRIs like https%3A%2F%2F... in URL path segments.
    merge_slashes off;

    # Compression for dynamic (proxied) responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/xml;

    # Built assets (production) — content-hashed filenames
    # Served from /srv/built-assets/ (shared volume, populated by entrypoint)
    # In non-volume-mount usage, also available at /usr/share/nginx/html/assets/
    # Cache headers added in S02
    location /assets/ {
        alias /srv/built-assets/;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static CSS assets served directly by nginx (no-cache for dev)
    location /css/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Static JS assets served directly by nginx (no-cache for dev)
    location /js/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Auth pages served as static HTML by nginx
    location = /setup.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /login.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /invite.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Proxy API requests to FastAPI backend (with cookie + Authorization forwarding)
    # CORS is handled entirely by FastAPI CORSMiddleware — no nginx CORS headers.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Forward Bearer token for API key authentication
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Well-Known discovery endpoint — proxied to FastAPI with full auth forwarding
    # CORS is handled entirely by FastAPI CORSMiddleware — no nginx CORS headers.
    location = /.well-known/sempkm {
        proxy_pass http://api:8000/.well-known/sempkm;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Forward Bearer token for API key authentication
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # LLM Streaming Proxy — SSE endpoint, must be before catch-all location /
    # proxy_buffering off prevents nginx from accumulating the full response
    # before forwarding; required for streaming/SSE to work correctly.
    location /browser/llm/chat/stream {
        proxy_pass http://api:8000/browser/llm/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # SSE-specific configuration
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "keep-alive";
        add_header X-Accel-Buffering "no";
    }

    # WebDAV VFS endpoint — proxied to FastAPI/wsgidav
    # Must pass Authorization header (Basic auth for native OS WebDAV clients)
    # and WebDAV protocol headers (Depth, Destination, Overwrite).
    location /dav/ {
        proxy_pass http://api:8000/dav/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Basic auth credentials to wsgidav (do NOT strip Authorization)
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # WebDAV protocol headers
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;

        # Extended timeouts for PROPFIND on large directories
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Allow large PROPFIND responses
        proxy_buffering on;
        client_max_body_size 10m;
    }

    # Lint SSE Streaming — real-time validation event push
    # Must be before catch-all location / to match specifically.
    # proxy_buffering off prevents nginx from accumulating the full response.
    location /api/lint/stream {
        proxy_pass http://api:8000/api/lint/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "keep-alive";
        add_header X-Accel-Buffering "no";
    }

    # Copilot chat SSE Streaming — AI copilot streaming chat completions
    # proxy_buffering off required for SSE to work correctly.
    location /api/copilot/chat {
        proxy_pass http://api:8000/api/copilot/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection '';
        add_header X-Accel-Buffering "no";
    }

    # Obsidian vault upload — large vaults allowed, no response buffering
    location /browser/import/upload {
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Obsidian scan SSE stream — no buffering for real-time events
    location ~ /browser/import/scan/.*/stream$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # All other routes proxied to FastAPI for template rendering
    location / {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}
