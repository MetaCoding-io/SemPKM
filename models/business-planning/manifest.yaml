modelId: business-planning
version: "1.0.0"
name: "Business Planning"
description: "Business planning frameworks including the Eisenhower Matrix for urgency×importance prioritization, the Business Model Canvas for mapping the nine building blocks of a business model, OKR for measurable goal tracking, Decision Matrix for weighted multi-criteria evaluation, SWOT Analysis, BCG Matrix, Ansoff Matrix, Stakeholder Map, and Risk Matrix. Provides quadrant-based views, poster-style canvas layout, OKR progress bars, decision matrix scoring, and drag-to-reclassify interaction for visual strategy work."
namespace: "urn:sempkm:model:business-planning:"
prefixes:
  bp: "urn:sempkm:model:business-planning:"
