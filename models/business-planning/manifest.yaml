name: "Business Planning"
description: "Business planning frameworks including the Eisenhower Matrix for urgency×importance prioritization and the Business Model Canvas for mapping the nine building blocks of a business model. Provides quadrant-based views, poster-style canvas layout, and drag-to-reclassify interaction for visual strategy work."
