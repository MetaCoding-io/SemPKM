modelId: personal-crm
version: "1.0.0"
name: "Personal CRM"
description: "Contact and relationship management for professionals. Track contacts, companies, interactions, and deals with typed relationships, provenance, and automatic stale-contact detection. Integrates with basic-pkm Person type via shared gist:Person superclass."
namespace: "urn:sempkm:model:personal-crm:"
prefixes:
  crm: "urn:sempkm:model:personal-crm:"
entrypoints:
  ontology: "ontology/personal-crm.jsonld"
  shapes: "shapes/personal-crm.jsonld"
  views: "views/personal-crm.jsonld"
  seed: "seed/personal-crm.jsonld"
  rules: "rules/personal-crm.ttl"
entailment_defaults:
  owl_inverseOf: true
  rdfs_subClassOf: false
  rdfs_subPropertyOf: false
  owl_TransitiveProperty: false
  rdfs_domain_range: false
  shacl_rules: true
