modelId: rss-feeds
version: "1.0.0"
name: "RSS Feeds"
description: "RSS/Atom feed articles and subscriptions. Provides Article and FeedSubscription types for feed reader applications."
namespace: "urn:sempkm:model:rss-feeds:"
prefixes:
  rss: "urn:sempkm:model:rss-feeds:"
entrypoints:
  ontology: "ontology/rss-feeds.jsonld"
  shapes: "shapes/rss-feeds.jsonld"
  views: "views/rss-feeds.jsonld"
  seed: null
icons:
  - type: "rss:Article"
    icon: "newspaper"
    color: "#f59e0b"
    tree:
      icon: "newspaper"
      color: "#f59e0b"
      size: 16
    tab:
      icon: "newspaper"
      color: "#f59e0b"
      size: 14
    graph:
      icon: "newspaper"
      color: "#f59e0b"
  - type: "rss:FeedSubscription"
    icon: "rss"
    color: "#3b82f6"
    tree:
      icon: "rss"
      color: "#3b82f6"
      size: 16
    tab:
      icon: "rss"
      color: "#3b82f6"
      size: 14
    graph:
      icon: "rss"
      color: "#3b82f6"
    browserVisible: false
