    icon: "user"
    color: "#6366f1"
    tree:
      icon: "user"
      color: "#6366f1"
      size: 16
    tab:
      icon: "user"
      color: "#6366f1"
      size: 14
    graph:
      icon: "user"
      color: "#6366f1"
  - type: "crm:Company"
