modelId: crm
version: "1.0.0"
name: "Personal CRM"
description: "Personal relationship management with Contacts, Companies, Interactions, and Deals. Tracks professional relationships, meeting history, follow-ups, and deal pipelines with SHACL-AF rules for stale contact and overdue follow-up warnings."
namespace: "urn:sempkm:model:crm:"
prefixes:
  crm: "urn:sempkm:model:crm:"
entrypoints:
  ontology: "ontology/crm.jsonld"
  shapes: "shapes/crm.jsonld"
  views: "views/crm.jsonld"
  seed: "seed/crm.jsonld"
  rules: "rules/crm.ttl"
entailment_defaults:
  owl_inverseOf: true
  rdfs_subClassOf: false
  rdfs_subPropertyOf: false
  owl_TransitiveProperty: false
  rdfs_domain_range: false
  shacl_rules: true
