modelId: research
version: "1.0.0"
name: "Research Workflow"
description: "Academic research tracking with Paper, Claim, Evidence, ResearchQuestion, and Argument types. Models the full research lifecycle from paper ingestion through claim extraction, evidence linking, argumentation, and research question tracking with SHACL-AF rules for unsupported claims, contested claims, orphan evidence, and unanswered questions."
namespace: "urn:sempkm:model:research:"
prefixes:
  res: "urn:sempkm:model:research:"
entrypoints:
  ontology: "ontology/research.jsonld"
  shapes: "shapes/research.jsonld"
  views: "views/research.jsonld"
  seed: "seed/research.jsonld"
  rules: "rules/research.ttl"
entailment_defaults:
  owl_inverseOf: true
  rdfs_subClassOf: false
  rdfs_subPropertyOf: false
  owl_TransitiveProperty: false
  rdfs_domain_range: false
  shacl_rules: true
icons:
  - type: "res:Paper"
    icon: "file-text"
    color: "#6366f1"
    tree:
      icon: "file-text"
      color: "#6366f1"
      size: 16
    tab:
      icon: "file-text"
      color: "#6366f1"
      size: 14
    graph:
      icon: "file-text"
      color: "#6366f1"
  - type: "res:Claim"
    icon: "message-square-quote"
    color: "#f59e0b"
    tree:
      icon: "message-square-quote"
      color: "#f59e0b"
      size: 16
    tab:
      icon: "message-square-quote"
      color: "#f59e0b"
      size: 14
    graph:
      icon: "message-square-quote"
      color: "#f59e0b"
  - type: "res:Evidence"
    icon: "flask-conical"
    color: "#10b981"
    tree:
      icon: "flask-conical"
      color: "#10b981"
      size: 16
    tab:
      icon: "flask-conical"
      color: "#10b981"
      size: 14
    graph:
      icon: "flask-conical"
      color: "#10b981"
  - type: "res:ResearchQuestion"
    icon: "help-circle"
    color: "#ef4444"
    tree:
      icon: "help-circle"
      color: "#ef4444"
      size: 16
    tab:
      icon: "help-circle"
      color: "#ef4444"
      size: 14
    graph:
      icon: "help-circle"
