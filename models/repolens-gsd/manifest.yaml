modelId: repolens-gsd
version: "0.1.0"
name: "RepoLens · gsd"
description: "Decisions and rules from a gsd-managed repository, and the link from a decision to the part of the code it governs. Extends the RepoLens model; install it only for repositories that keep a .gsd directory."
namespace: "urn:sempkm:model:repolens-gsd:"
prefixes:
  rl: "urn:sempkm:model:repolens:"
  rlg: "urn:sempkm:model:repolens-gsd:"
entrypoints:
  ontology: "ontology/repolens-gsd.jsonld"
  shapes: "shapes/repolens-gsd.jsonld"
  views: "views/repolens-gsd.jsonld"
  seed: null
entailment_defaults:
  owl_inverseOf: true
  rdfs_subClassOf: false
  rdfs_subPropertyOf: false
  owl_TransitiveProperty: false
  rdfs_domain_range: false
  shacl_rules: false
icons:
  - type: "rlg:Decision"
    icon: "gavel"
    color: "#8a6410"
    tree: { icon: "gavel", color: "#8a6410", size: 16 }
    tab: { icon: "gavel", color: "#8a6410", size: 14 }
    graph: { icon: "gavel", color: "#8a6410" }
  - type: "rlg:Rule"
    icon: "scale"
    color: "#5b6f92"
    tree: { icon: "scale", color: "#5b6f92", size: 16 }
    tab: { icon: "scale", color: "#5b6f92", size: 14 }
    graph: { icon: "scale", color: "#5b6f92" }
  - type: "rlg:Milestone"
    icon: "flag"
    color: "#3f7d7a"
    tree: { icon: "flag", color: "#3f7d7a", size: 16 }
    tab: { icon: "flag", color: "#3f7d7a", size: 14 }
    graph: { icon: "flag", color: "#3f7d7a" }
  # A decision link is read through the decision or the part, not browsed.
  - type: "rlg:DecisionLink"
    icon: "link"
    color: "#6d6851"
    browserVisible: false
