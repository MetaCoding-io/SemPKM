<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemPKM Context</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="sidebar-header">
    <div class="header-brand">
      <svg class="brand-logo" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="9" stroke="#fff" stroke-width="1.5"/>
        <circle cx="10" cy="6" r="2" fill="#fff"/>
        <circle cx="6" cy="14" r="2" fill="#fff"/>
        <circle cx="14" cy="14" r="2" fill="#fff"/>
        <line x1="10" y1="8" x2="6" y2="12" stroke="#fff" stroke-width="1"/>
        <line x1="10" y1="8" x2="14" y2="12" stroke="#fff" stroke-width="1"/>
        <line x1="6" y1="14" x2="14" y2="14" stroke="#fff" stroke-width="1"/>
      </svg>
      <span class="header-title">SemPKM Context</span>
    </div>
    <button id="refresh-btn" class="header-action" title="Refresh results">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </header>

  <main class="sidebar-content">
    <div id="loading" class="state-panel">
      <div class="spinner"></div>
      <p class="state-text">Checking for related objects…</p>
    </div>

    <div id="error" class="state-panel" hidden>
      <div class="state-icon">⚠</div>
      <p id="error-message" class="state-text">Something went wrong.</p>
      <button id="retry-btn" class="btn-retry">Retry</button>
    </div>

    <div id="empty" class="state-panel" hidden>
      <div class="state-icon">∅</div>
      <p id="empty-message" class="state-text">No related objects found for this page.</p>
    </div>

    <div id="results" hidden></div>
  </main>

  <footer class="sidebar-footer">
    <span>Powered by <a id="footer-link" href="#" target="_blank" rel="noopener">SemPKM</a></span>
  </footer>

  <div id="toast-container" class="toast-container"></div>

  <script src="../shared/context-utils.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
