<title>__TITLE__</title>
<style>
/* ============================================================
   repolens — an axonometric survey of a repository
   Drafting print on olive paper; negative print in dark.
   ============================================================ */

:root {
  --paper:      #cfc8a2;
  --paper-2:    #c6bf96;
  --paper-3:    #d7d1b0;
  --paper-sunk: #bfb88e;
  --ink:        #17160e;
  --ink-2:      #423f2a;
  --ink-3:      #6d6851;
  --rule:       rgba(23, 22, 14, 0.30);
  --rule-soft:  rgba(23, 22, 14, 0.13);
  --rule-faint: rgba(23, 22, 14, 0.07);
  --accent:     #8d2c0e;
  --on-accent:  #f2ecd2;
  --invert-bg:  #17160e;
  --invert-fg:  #d8d2ae;
  --sev-high:   #8d2c0e;
  --sev-med:    #8a6410;
  --sev-low:    #4a5f33;
  --sev-note:   #6d6851;
  --face-top:   #d9d3b2;
  --face-right: #b9b287;
  --face-left:  #a8a178;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #1a190f;
    --paper-2:    #14130c;
    --paper-3:    #232113;
    --paper-sunk: #100f09;
    --ink:        #ded7ad;
    --ink-2:      #aca684;
    --ink-3:      #7b7660;
    --rule:       rgba(222, 215, 173, 0.30);
    --rule-soft:  rgba(222, 215, 173, 0.13);
    --rule-faint: rgba(222, 215, 173, 0.07);
    --accent:     #d46a33;
    --on-accent:  #17160e;
    --invert-bg:  #ded7ad;
    --invert-fg:  #17160e;
    --sev-high:   #d46a33;
    --sev-med:    #d0a13a;
    --sev-low:    #8fae60;
    --sev-note:   #7b7660;
    --face-top:   #2b2818;
    --face-right: #201e12;
    --face-left:  #191710;
  }
}

:root[data-theme="dark"] {
  --paper:      #1a190f;
  --paper-2:    #14130c;
  --paper-3:    #232113;
  --paper-sunk: #100f09;
  --ink:        #ded7ad;
  --ink-2:      #aca684;
  --ink-3:      #7b7660;
  --rule:       rgba(222, 215, 173, 0.30);
  --rule-soft:  rgba(222, 215, 173, 0.13);
  --rule-faint: rgba(222, 215, 173, 0.07);
  --accent:     #d46a33;
  --on-accent:  #17160e;
  --invert-bg:  #ded7ad;
  --invert-fg:  #17160e;
  --sev-high:   #d46a33;
  --sev-med:    #d0a13a;
  --sev-low:    #8fae60;
  --sev-note:   #7b7660;
  --face-top:   #2b2818;
  --face-right: #201e12;
  --face-left:  #191710;
}

/* pane widths live in variables so collapsing is one class on #shell */
:root { --rail-w: 236px; --insp-w: 396px; --pane-strip: 26px; }

/* Group hues — coloured drafting inks, kept low in saturation so the drawing
   still reads as a print. A node takes its group's hue whatever layout it is
   standing in, so grouping survives a change of level. */
:root {
  --g-loop:   #a8703f;
  --g-feed:   #5f7f4e;
  --g-schema: #5b6f92;
  --g-after:  #9c4b3c;
  --g-id:     #8a7a3c;
  --g-surf:   #3f7d7a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --g-loop:   #b8814f;
    --g-feed:   #7d9c68;
    --g-schema: #7e91b4;
    --g-after:  #bb6553;
    --g-id:     #a89651;
    --g-surf:   #549b97;
  }
}
:root[data-theme="dark"] {
  --g-loop:   #b8814f;
  --g-feed:   #7d9c68;
  --g-schema: #7e91b4;
  --g-after:  #bb6553;
  --g-id:     #a89651;
  --g-surf:   #549b97;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono",
               Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

#shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--insp-w);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh;
  height: 100dvh;
}

/* ---------- top bar ---------- */

#topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  min-height: 46px;
  overflow: hidden;               /* the stat strip scrolls, the bar does not */
}
/* Stats are the part that grows with the config, so they are the part that
   scrolls. Without this the action buttons were pushed off the right edge on
   any window under ~1730px, which is most of them. */
#statstrip {
  display: flex; align-items: stretch;
  flex: 1 1 auto; min-width: 0;
  overflow-x: auto; scrollbar-width: none;
}
#statstrip::-webkit-scrollbar { height: 0; }
#topbar::-webkit-scrollbar { display: none; }

.repo-cell {
  display: flex; align-items: center;
  padding: 0 14px; font-size: 15px; letter-spacing: 0.02em;
  border-right: 1px solid var(--rule); white-space: nowrap; flex-shrink: 0;
}
.repo-cell b { font-weight: 600; }
.repo-cell span { color: var(--ink-3); }

.stat {
  padding: 5px 12px; border-right: 1px solid var(--rule-soft);
  white-space: nowrap; flex-shrink: 0;
  display: flex; flex-direction: column; justify-content: center;
}
.stat-k { font-size: 9.5px; letter-spacing: 0.13em; color: var(--ink-3); text-transform: uppercase; }
.stat-v { font-size: 13px; font-variant-numeric: tabular-nums; }
.stat-v em { font-style: normal; color: var(--ink-3); }
.stat-v.bad { color: var(--sev-high); }

#topbar-actions {
  margin-left: auto; display: flex; align-items: center;
  gap: 7px; padding: 0 12px; flex-shrink: 0;
}

/* ---------- buttons ---------- */

.btn {
  font: inherit; font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: 1px solid var(--rule);
  padding: 6px 11px; cursor: pointer; white-space: nowrap;
  transition: background 90ms linear, color 90ms linear;
}
.btn:hover { background: var(--paper-3); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.btn.accent[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- left rail ---------- */

/* The rail is a stack of independently collapsible panels. It owns the scroll
   at the panel level rather than the rail level, so collapsing one gives its
   height to the others instead of just shortening the page. */
#rail {
  border-right: 1px solid var(--rule); background: var(--paper);
  overflow: hidden; display: flex; flex-direction: column; min-height: 0;
}
#railpanes { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.rpane { display: flex; flex-direction: column; min-height: 0; }
.rpane[data-open="true"] { flex: 1 1 0; }
.rpane[data-open="false"] { flex: 0 0 auto; }
.rpane h2 { margin: 0; font-size: inherit; font-weight: inherit; }
.rpane-head {
  display: flex; align-items: center; gap: 6px; width: 100%; font: inherit;
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-2); background: var(--paper-2); cursor: pointer;
  border: 0; border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft); padding: 6px 10px; text-align: left;
}
.rpane-head:hover { color: var(--ink); }
.rpane-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rpane-head .tw { font-size: 8px; width: 8px; transition: transform 110ms linear; }
.rpane[data-open="false"] .rpane-head .tw { transform: rotate(-90deg); }
.rpane-head .nm { flex: 1 1 auto; }
.rpane-head .rpane-n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rpane-body { overflow-y: auto; overflow-x: hidden; min-height: 0; padding-bottom: 10px; }
.rpane[data-open="false"] .rpane-body { display: none; }

/* ---- connections panel ---- */
.eitem {
  display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 7px;
  align-items: baseline; width: 100%; text-align: left; font: inherit;
  background: transparent; border: 0; border-bottom: 1px solid var(--rule-faint);
  color: var(--ink); padding: 5px 10px; cursor: pointer;
}
.eitem:hover { background: var(--paper-3); }
.eitem[aria-selected="true"] { background: var(--invert-bg); color: var(--invert-fg); }
.eitem[aria-selected="true"] .er, .eitem[aria-selected="true"] .ec { color: var(--invert-fg); opacity: 0.75; }
.eitem.dim { opacity: 0.3; }
.eitem .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.eitem .er { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eitem .er b { font-weight: 600; }
.eitem .ec { font-size: 9px; letter-spacing: 0.08em; color: var(--ink-3); white-space: nowrap; }
.rpane-empty { padding: 12px 10px; font-size: 10.5px; color: var(--ink-3); }
#rail::-webkit-scrollbar { width: 8px; }
#rail::-webkit-scrollbar-thumb { background: var(--rule-soft); }

#railsearch {
  position: sticky; top: 0; z-index: 3; background: var(--paper);
  border-bottom: 1px solid var(--rule-soft); padding: 7px 30px 7px 8px;
}
#tabs { padding-left: 25px; }
#q {
  width: 100%; font: inherit; font-size: 11px; padding: 5px 7px;
  color: var(--ink); background: var(--paper-3); border: 1px solid var(--rule-soft);
}
#q::placeholder { color: var(--ink-3); letter-spacing: 0.08em; }
#q:focus { outline: none; border-color: var(--accent); }

.grp {
  font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ink-3); padding: 15px 10px 5px;
}

.item {
  display: grid; grid-template-columns: 15px minmax(0, 1fr) auto;
  gap: 7px; align-items: start; width: 100%; text-align: left;
  font: inherit; font-size: 11px; letter-spacing: 0.035em;
  color: var(--ink); background: transparent;
  border: 1px solid var(--rule-soft); border-left: 2px solid transparent;
  margin: 0 0 -1px 0; padding: 6px 8px 6px 6px; cursor: pointer; text-transform: uppercase;
}
.item:hover { background: var(--paper-3); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item .k { color: var(--ink-3); font-size: 10px; }
.item .n { line-height: 1.35; overflow-wrap: anywhere; }
.item .c { color: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.item[aria-selected="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.item[aria-selected="true"] .k, .item[aria-selected="true"] .c { color: var(--invert-fg); opacity: 0.65; }
.item.dim { opacity: 0.24; }
.item.hasfind { border-left-color: var(--sev-med); }
.item.hasfind-high { border-left-color: var(--sev-high); }

/* ---------- canvas ---------- */

#stage { position: relative; overflow: hidden; background: var(--paper); cursor: grab; }
#stage.dragging { cursor: grabbing; }
#svg { display: block; width: 100%; height: 100%; touch-action: none; }

#zoomers {
  position: absolute; top: 10px; right: 10px;
  display: flex; flex-direction: column; z-index: 2;
}
#zoomers .btn { padding: 3px 8px; font-size: 13px; letter-spacing: 0; margin-bottom: -1px; background: var(--paper); }

#topleft {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  display: flex; flex-direction: column; gap: 7px; max-width: calc(100% - 90px);
}
.ctlrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.ctlrow .btn { background: var(--paper); font-size: 9.5px; padding: 4px 8px; }
.ctlrow .btn[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.ctl-label {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); padding-right: 3px;
}
.swatch {
  display: inline-block; width: 7px; height: 7px; margin-right: 5px;
  vertical-align: baseline; border: 1px solid currentColor;
}
.btn[aria-pressed="true"] .swatch { background: currentColor; }

#legend .btn { background: var(--paper); font-size: 9.5px; padding: 3px 7px; }
#legend .btn[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
#legend .key {
  display: inline-block; width: 9px; height: 9px; margin-right: 5px;
  vertical-align: -1px; border: 1px solid var(--ink);
}

#crumbs { display: none; }
#crumbs .btn { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.crumb-here {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); align-self: center; padding-left: 2px;
}

#dials {
  position: absolute; left: 10px; bottom: 10px; z-index: 2;
  background: var(--paper); border: 1px solid var(--rule);
  padding: 7px 11px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
}
#dials label, #dials .dlab {
  font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-3);
}
#dials .sep { width: 1px; align-self: stretch; background: var(--rule); }
.readout { font-size: 10px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 34px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 88px; height: 15px; background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 9px; height: 13px;
  background: var(--ink); margin-top: -6px; border-radius: 0;
}
input[type="range"]::-moz-range-thumb { width: 9px; height: 13px; background: var(--ink); border: 0; border-radius: 0; }
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* scene primitives */
.face-top   { fill: var(--face-top); }
.face-right { fill: var(--face-right); }
.face-left  { fill: var(--face-left); }
.hatch-line { stroke: var(--rule-soft); stroke-width: 0.9; }
.grid-line  { stroke: var(--rule-faint); stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; }
.plot-line  { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 5 4; fill: none; vector-effect: non-scaling-stroke; }

/* stroke-width is set in JS: it carries how many edges a bundle holds */
.wire { stroke: var(--ink-2); fill: none; vector-effect: non-scaling-stroke; opacity: 0.8; }
.wire.spine { stroke: var(--ink); opacity: 1; }
.wire.viol  { stroke: var(--sev-high); stroke-dasharray: 6 4; opacity: 1; }
.wire.muted { opacity: 0.09; }
.wire.lit   { stroke: var(--accent); opacity: 1; }
.wire-node  { fill: var(--ink-2); opacity: 0.7; }
.wire-node.muted { opacity: 0.09; }

.node { cursor: pointer; }
.node .shell-poly { stroke: var(--ink); stroke-width: 1.1; vector-effect: non-scaling-stroke; }
.node.hovered .shell-poly { stroke-width: 2; }
.node.selected .face-top { fill: var(--invert-bg); }
.node.selected .shell-poly { stroke: var(--accent); stroke-width: 2; }
.node.selected .short-label { fill: var(--invert-fg); }
.node.dim { opacity: 0.26; }
.node.searchdim { opacity: 0.16; }
.node.flagged .shell-poly { stroke: var(--sev-high); }

.short-label {
  fill: var(--ink); font-family: inherit; font-size: 7.5px;
  letter-spacing: 0.04em; text-anchor: middle; dominant-baseline: middle;
  pointer-events: none; user-select: none;
}
/* Level names were the same weight and colour as the grid and disappeared
   into it. They name the whole band, so they get to be loud. */
.band-label {
  fill: var(--accent); font-family: inherit; font-size: 13px; font-weight: 700;
  letter-spacing: 0.15em; text-anchor: end; dominant-baseline: middle;
  pointer-events: none; user-select: none; text-transform: uppercase;
  paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round;
}
.band-rule { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 2 5; opacity: 0.5; vector-effect: non-scaling-stroke; }
.name-label {
  fill: var(--ink); font-family: inherit; font-size: 9.5px; letter-spacing: 0.09em;
  text-anchor: middle; pointer-events: none; user-select: none;
  paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round;
}

.pkt { cursor: pointer; }
.pkt-body { fill: var(--accent); stroke: var(--paper); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pkt.viol .pkt-body { fill: var(--sev-high); }
.pkt.sel .pkt-body { fill: var(--invert-bg); stroke: var(--accent); stroke-width: 2; }
.pkt-halo { fill: none; stroke: var(--accent); stroke-width: 1; opacity: 0.35; vector-effect: non-scaling-stroke; }

/* ---------- inspector ---------- */

#inspector {
  border-left: 1px solid var(--rule); background: var(--paper);
  display: flex; flex-direction: column; min-height: 0;
}
#tabs { display: flex; border-bottom: 1px solid var(--rule); flex-shrink: 0; }
.tab {
  flex: 1; font: inherit; font-size: 8.5px; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 11px 2px; background: transparent; color: var(--ink-3);
  border: 0; border-right: 1px solid var(--rule-soft); cursor: pointer;
  white-space: nowrap;
}
.tab:last-child { border-right: 0; }
.tab:hover { color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab[aria-selected="true"] { background: var(--invert-bg); color: var(--invert-fg); }
.tab .badge {
  display: inline-block; margin-left: 4px; padding: 0 4px;
  background: var(--sev-high); color: var(--on-accent); font-size: 8.5px;
}
.tab[aria-selected="true"] .badge { background: var(--invert-fg); color: var(--invert-bg); }

#panel { overflow-y: auto; padding: 16px 20px 40px; flex: 1; min-height: 0; }
#panel::-webkit-scrollbar { width: 8px; }
#panel::-webkit-scrollbar-thumb { background: var(--rule-soft); }

.eyebrow { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
#panel h2 { font-size: 21px; font-weight: 500; letter-spacing: 0.01em; margin: 3px 0 2px; text-wrap: balance; }
.dek { color: var(--ink-3); font-size: 11.5px; margin-bottom: 16px; }

.sec {
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin: 20px 0 10px;
}
#panel p { margin: 0 0 11px; max-width: 62ch; }
mark { background: var(--invert-bg); color: var(--invert-fg); padding: 0 3px; }
code { font-family: inherit; background: var(--paper-sunk); padding: 0 3px; font-size: 11.5px; }

.kv { display: grid; grid-template-columns: 122px minmax(0, 1fr); gap: 3px 10px; margin: 0 0 12px; }
.kv dt { color: var(--ink-3); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }

pre {
  background: var(--paper-sunk); border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--accent); padding: 10px 12px; margin: 0 0 12px;
  overflow-x: auto; font-size: 11px; line-height: 1.55; white-space: pre; tab-size: 2;
}
pre::-webkit-scrollbar { height: 7px; }
pre::-webkit-scrollbar-thumb { background: var(--rule); }

ul.bul { margin: 0 0 12px; padding-left: 16px; }
ul.bul li { margin-bottom: 6px; max-width: 60ch; }

.flag {
  display: flex; gap: 8px; border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--ink-3); padding: 9px 11px; margin-bottom: 9px;
}
.flag.ok { border-left-color: var(--sev-low); }
.flag.warn { border-left-color: var(--sev-med); }
.flag .lab {
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); flex-shrink: 0; width: 52px; padding-top: 2px;
}
.flag .txt { font-size: 11.5px; }

/* decisions attached to a part */
.dec {
  border: 1px solid var(--rule-soft); border-left: 3px solid var(--ink-3);
  padding: 8px 11px; margin-bottom: 7px;
}
/* three columns, so a wrapping title can never run under the unlink button */
.dec summary {
  cursor: pointer; list-style: none; font-size: 11.5px; line-height: 1.45;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 7px; align-items: baseline;
}
.dec summary::-webkit-details-marker { display: none; }
.dec summary:hover { color: var(--accent); }
.dec .dec-id {
  font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-3);
  margin-right: 7px; white-space: nowrap;
}
.dec .dec-x {
  font: inherit; font-size: 12px; line-height: 1; border: 0;
  background: transparent; color: var(--ink-3); cursor: pointer; padding: 0 0 0 2px;
}
.dec .dec-x:hover { color: var(--sev-high); }
/* provenance without a word for it: a guess is dashed, a person's link is not */
.dec.guessed { border-left-style: dashed; }
.dec.authored { border-left-color: var(--sev-med); }
.dec .dec-on { font-size: 10px; color: var(--ink-3); margin-top: 5px; }
.dec .dec-on b { color: var(--ink-2); }
.dec .dec-why {

<script>
"use strict";

/* ============================================================
   1. THE MODEL — measured from the working tree, 14 August 2026

   layer  = my mapping onto Löwy's volatility-based decomposition
   tier   = depth in the request lifecycle, for the stacked view
   ============================================================ */

var MODEL = /*__MODEL__*/null;

/* Every array below is data now. The renderer past this point is unchanged
   from the hand-authored page — it just reads a model instead of literals. */
var NODES = MODEL.nodes;

var FLOWS = {};
MODEL.flows.forEach(function (f) { FLOWS[f.id] = { label: f.label, on: !!f.enabled }; });

var EDGES = MODEL.edges;

/* ============================================================
   2. FINDINGS — every claim below was grepped, not inferred
   ============================================================ */

var SEV_ORDER = { high: 0, medium: 1, low: 2, note: 3, good: 4 };

var FINDINGS = MODEL.findings;

/* ============================================================
   3. PROJECTION — axonometric with adjustable pitch
      pitch 90° = plan view (height collapses)
   ============================================================ */

var UNIT = 27, ZH = 20;
var RAD = Math.PI / 180;
var ISO_PITCH = 35.264;                 /* true isometric */
var pitchDeg = 35;                      /* how far above the ground you stand */
var yawDeg = 0;                         /* which way round the model is turned */
var ISO_COS = Math.cos(ISO_PITCH * RAD);

/* Two rotations, and they are different things. Pitch raises the eye: at 90°
   you are directly overhead and height collapses to a plan. Yaw spins the
   model on the spot, so you can bring a face that was hidden round to the
   front. Yaw happens first, in ground coordinates; the rest of the drawing
   reads through proj(), so it follows for free. */
/* Spin about the middle of the drawing, not about the ground origin — a
   layout whose centroid sits well away from (0,0) would otherwise swing off
   the canvas as soon as you touched the control. */
var spinOrigin = [0, 0];

function updateSpinOrigin() {
  if (!NODES.length) { spinOrigin = [0, 0]; return; }
  var sx = 0, sy = 0;
  NODES.forEach(function (n) { sx += n._x + n._w / 2; sy += n._y + n._d / 2; });
  spinOrigin = [sx / NODES.length, sy / NODES.length];
}

function spin(x, y) {
  if (!yawDeg) return [x, y];
  var t = yawDeg * RAD, c = Math.cos(t), s = Math.sin(t);
  var dx = x - spinOrigin[0], dy = y - spinOrigin[1];
  return [spinOrigin[0] + dx * c - dy * s, spinOrigin[1] + dx * s + dy * c];
}

function proj(x, y, z) {
  var p = pitchDeg * RAD, g = spin(x, y);
  return [ (g[0] - g[1]) * 0.866 * UNIT,
           (g[0] + g[1]) * 0.866 * Math.sin(p) * UNIT - z * ZH * (Math.cos(p) / ISO_COS) ];
}

/* Distance from the eye, after the spin — the painter's-algorithm sort key
   and the test for which side of a box is facing you. */
function depthOf(x, y, z) {
  var g = spin(x, y);
  return g[0] + g[1] + z;
}
function pt(p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }

var byId = {};
NODES.forEach(function (n) { byId[n.id] = n; });

var heightMode = "loc";
var layout = "survey";

function nodeHeight(n) {
  var spec = LAYOUTS[layout] || LAYOUT_DEFAULTS;
  return (spec.height || LAYOUT_DEFAULTS.height)(n, CURRENT_API);
}

function boxFaces(n) {
  var h = nodeHeight(n);
  var x0 = n._x, y0 = n._y, x1 = n._x + n._w, y1 = n._y + n._d;
  var zb = n._z, zt = n._z + h;
  /* Which two sides face you depends on the yaw. Turn the model far enough
     and the x1 wall swings to the back; keep drawing it and you are looking
     at the inside of the box. Pick the near plane on each axis instead. */
  var t = yawDeg * RAD, c = Math.cos(t), s = Math.sin(t);
  var xf = (c + s) >= 0 ? x1 : x0;      /* the x wall nearer the eye */
  var yf = (c - s) >= 0 ? y1 : y0;      /* the y wall nearer the eye */
  var xb = xf === x1 ? x0 : x1;
  var yb = yf === y1 ? y0 : y1;
  return {
    top:   [proj(x0,y0,zt), proj(x1,y0,zt), proj(x1,y1,zt), proj(x0,y1,zt)],
    right: [proj(xf,yb,zb), proj(xf,yf,zb), proj(xf,yf,zt), proj(xf,yb,zt)],
    left:  [proj(xb,yf,zb), proj(xf,yf,zb), proj(xf,yf,zt), proj(xb,yf,zt)],
    apex:  proj(x0 + n._w/2, y0 + n._d/2, zt),
    ctr:   [x0 + n._w/2, y0 + n._d/2, zb]
  };
}

/* ============================================================
   4. LAYOUTS
   ============================================================ */

var BANDS = [];               /* band labels the current layout asked for */
var TIER_GAP = 6.0, ROW_SP = 2.6;
var LAYOUTS = {};
var CURRENT_API = null;

/* Every layout inherits these and overrides only what differs. */
var LAYOUT_DEFAULTS = {
  label: "Untitled",
  blurb: "",
  maxPitch: 90,            /* a plan view flattens stacked tiers onto each other */
  scope: "system",         /* "system" | "part" | "file" */
  box: { w: 2.1, d: 2.1 },
  heightCap: 5.0, heightDiv: 22, heightPer: 0.52,

  height: function (n, api) {
    var s = api.spec;
    if (heightMode === "loc") return Math.min(s.heightCap, 0.35 + Math.sqrt(n.loc) / s.heightDiv);
    return Math.min(s.heightCap, 0.35 + Math.sqrt(n.files) * s.heightPer);
  },

  /* default routing: travel on the ground, turning at most once */
  route: function (e, api) {
    var a = api.centre(api.byId[e.from]), b = api.centre(api.byId[e.to]);
    var pts = [a];
    if (e.wp) e.wp.forEach(function (w) { pts.push([w[0], w[1], 0]); });
    else if (Math.abs(a[0] - b[0]) > 0.4 && Math.abs(a[1] - b[1]) > 0.4) pts.push([b[0], a[1], 0]);
    pts.push(b);
    return pts;
  }
};

/* Rows laid along the (1,-1) diagonal project to a horizontal line at every
   pitch, so stacked layouts separate their tiers by z alone. `offset` slides a
   row down-screen, to park a band beside the stack rather than inside it. */
function layRow(members, z, offset, label) {
  if (!members.length) return;
  var half = (members.length - 1) / 2;
  members.forEach(function (n, i) {
    var t = (i - half) * ROW_SP;
    n._w = 2.1; n._d = 2.1; n._z = z;
    n._x = t + offset;
    n._y = -t + offset;
  });
  var tl = -half * ROW_SP - 2.4;
  BANDS.push({ label: label, z: z, x: tl + offset, y: -tl + offset,
               rx: -tl + offset, ry: tl + offset });
}

/* What a layout is handed. Rebuilt whenever the active layout changes. */
function buildLayoutApi() {
  var spec = LAYOUTS[layout] || LAYOUT_DEFAULTS;
  return {
    spec: spec,
    nodes: NODES,
    edges: EDGES,
    byId: byId,
    model: MODEL,
    consts: { TIER_GAP: TIER_GAP, ROW_SP: ROW_SP },
    centre: function (n) { return [n._x + n._w / 2, n._y + n._d / 2, n._z]; },
    setPos: function (n, p) {
      n._x = p.x; n._y = p.y; n._z = p.z || 0;
      n._w = p.w || spec.box.w; n._d = p.d || spec.box.d;
    },
    band: function (b) { BANDS.push(b); },
    row: layRow
  };
}

var layoutBarReady = false;

function registerLayout(spec) {
  if (!spec || !spec.id) throw new Error("registerLayout: an id is required");
  if (typeof spec.run !== "function") throw new Error("registerLayout: run(api) is required");
  var merged = {};
  Object.keys(LAYOUT_DEFAULTS).forEach(function (k) { merged[k] = LAYOUT_DEFAULTS[k]; });
  Object.keys(spec).forEach(function (k) { merged[k] = spec[k]; });
  LAYOUTS[spec.id] = merged;
  if (layoutBarReady) paintLayoutBar();
  return spec.id;
}

/* Position every node for the active layout. */
function runLayout() {
  BANDS = [];
  CURRENT_API = buildLayoutApi();
  LAYOUTS[layout].run(CURRENT_API);
}

/* ---- the three built-in layouts, registered like any other ---- */

function stackedRoute(e, api) {
  var a = api.centre(api.byId[e.from]), b = api.centre(api.byId[e.to]);
  var mz = (a[2] + b[2]) / 2;
  return [a, [a[0], a[1], mz], [b[0], b[1], mz], b];
}

registerLayout({
  id: "survey",
  label: "Survey",
  blurb: "The system as a plot of ground: one ring, read one way and written the other.",
  run: function (api) {
    /* Hand-placed coordinates are optional. A repo with no overlay has none,
       so fall back to a grid ordered by size rather than stacking every box
       on the origin. */
    var placed = api.nodes.some(function (n) { return n.x || n.y; });
    if (placed) {
      api.nodes.forEach(function (n) {
        api.setPos(n, { x: n.x, y: n.y, z: 0, w: n.w, d: n.d });
      });
      return;
    }
    var ordered = api.nodes.slice().sort(function (a, b) { return b.loc - a.loc; });
    var cols = Math.max(1, Math.ceil(Math.sqrt(ordered.length)));
    var SP = 4.2;
    ordered.forEach(function (n, i) {
      api.setPos(n, {
        x: (i % cols) * SP,
        y: Math.floor(i / cols) * SP,
        z: 0, w: 2.1, d: 2.1
      });
    });
  }
});

registerLayout({
  id: "stack",
  label: "Layers",
  blurb: "The same parts stacked by how deep a request has travelled — surfaces on top, resources at the bottom.",
  maxPitch: 72,
  heightCap: 2.2, heightDiv: 44, heightPer: 0.24,
  route: stackedRoute,
  run: function (api) {
    var TIERS = api.model.tiers;
    TIERS.forEach(function (label, t) {
      var members = api.nodes.filter(function (n) { return n.tier === t; });
      api.row(members, (TIERS.length - 1 - t) * api.consts.TIER_GAP, 0, label);
    });
  }
});

registerLayout({
  id: "lowy",
  label: "Volatility",
  blurb: "Read through Juval L\u00f6wy's volatility-based decomposition: clients on top, resources at the bottom, and nothing allowed to reach past its neighbour.",
  maxPitch: 72,
  heightCap: 2.2, heightDiv: 44, heightPer: 0.24,
  route: stackedRoute,
  run: function (api) {
    var stacked = api.model.layers.filter(function (l) { return !l.side; });
    stacked.forEach(function (l, li) {
      var members = api.nodes.filter(function (n) { return n.layer === l.id; });
      api.row(members, (stacked.length - 1 - li) * api.consts.TIER_GAP, 0, l.label);
    });
    /* L\u00f6wy draws utilities as a bar crossing every layer; stacked by
       elevation there is no sideways, so it gets its own band below. */
    var side = api.model.layers.filter(function (l) { return l.side; })[0];
    if (side) {
      var utils = api.nodes.filter(function (n) { return n.layer === side.id; });
      api.row(utils, -api.consts.TIER_GAP, 0, side.label);
    }
  }
});

/* ============================================================
   5. SCENE
   ============================================================ */

var SVG_NS = "http://www.w3.org/2000/svg";
var svg = document.getElementById("svg");
var stage = document.getElementById("stage");

var scene, gGrid, gWires, gNodes, gPackets, gBands, hoverLabel;
var view = { k: 1, tx: 0, ty: 0 };
/* system | drill — declared here because buildRail reads it during boot */
/* system → part → file. Each level swaps the dataset; the stack remembers the
   way back. */
var VIEW = { mode: "system", node: null, path: null, prev: null };
function inDrill() { return VIEW.mode !== "system"; }
var selectedNode = null, hoveredNode = null, selectedPacket = null;
var activeTab = "what";

function el(name, attrs) {
  var e = document.createElementNS(SVG_NS, name);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ---- grid ---- */
var gridRefs = [], plotRef = null;
var GRID_MIN = -14, GRID_MAX = 26, GRID_STEP = 2;

function buildGround() {
  var g = el("g");
  gridRefs = [];
  for (var i = GRID_MIN; i <= GRID_MAX; i += GRID_STEP) {
    var l1 = el("line"); l1.setAttribute("class", "grid-line");
    gridRefs.push({ el: l1, a: [i, GRID_MIN], b: [i, GRID_MAX] }); g.appendChild(l1);
    var l2 = el("line"); l2.setAttribute("class", "grid-line");
    gridRefs.push({ el: l2, a: [GRID_MIN, i], b: [GRID_MAX, i] }); g.appendChild(l2);
  }
  plotRef = el("polygon"); plotRef.setAttribute("class", "plot-line");
  g.appendChild(plotRef);
  return g;
}

function applyGround() {
  gridRefs.forEach(function (r) {
    var a = proj(r.a[0], r.a[1], 0), b = proj(r.b[0], r.b[1], 0);
    r.el.setAttribute("x1", a[0].toFixed(1)); r.el.setAttribute("y1", a[1].toFixed(1));
    r.el.setAttribute("x2", b[0].toFixed(1)); r.el.setAttribute("y2", b[1].toFixed(1));
  });
  var c = [proj(GRID_MIN,GRID_MIN,0), proj(GRID_MAX,GRID_MIN,0),
           proj(GRID_MAX,GRID_MAX,0), proj(GRID_MIN,GRID_MAX,0)];
  plotRef.setAttribute("points", c.map(pt).join(" "));
}

/* ---- band labels (stack / volatility views) ---- */
function buildBands() { return el("g"); }

function applyBands() {
  gBands.textContent = "";
  BANDS.forEach(function (b) {
    var p = proj(b.x, b.y, b.z);
    var t = el("text", { x: p[0].toFixed(1), y: p[1].toFixed(1) });
    t.setAttribute("class", "band-label");
    t.textContent = b.label;
    gBands.appendChild(t);
    var a = proj(b.x + 0.5, b.y - 0.5, b.z), c2 = proj(b.rx, b.ry, b.z);
    var l = el("line", { x1: a[0].toFixed(1), y1: a[1].toFixed(1),
                         x2: c2[0].toFixed(1), y2: c2[1].toFixed(1) });
    l.setAttribute("class", "band-rule");
    gBands.appendChild(l);
  });
}

/* ---- wires ---- */
var wireRefs = {};

function edgeGridPath(e) {
  var spec = LAYOUTS[layout] || LAYOUT_DEFAULTS;
  return (spec.route || LAYOUT_DEFAULTS.route)(e, CURRENT_API);
}

/* Edges that join the same two parts share one line. Without this, several
   edges between a pair draw exactly on top of each other and read as one. */
var BUNDLES = [];

function buildBundles() {
  var byKey = {};
  BUNDLES = [];
  EDGES.forEach(function (e, i) {
    var key = [e.from, e.to].slice().sort().join("␀");
    var b = byKey[key];
    if (!b) {
      b = byKey[key] = { key: key, from: e.from, to: e.to, edges: [], idx: BUNDLES.length };
      BUNDLES.push(b);
    }
    b.edges.push(i);
  });
  BUNDLES.forEach(function (b) {
    b._viol  = b.edges.every(function (i) { return EDGES[i].flow === "viol"; });
    b._spine = byId[b.from].grp === "loop" && byId[b.to].grp === "loop" && !b._viol;
    b.edges.forEach(function (ei, k) {
      EDGES[ei]._bundle = b;
      EDGES[ei]._lane = k;        /* which lane this edge's packet rides in */
    });
  });
}

function wireWidth(b, visibleCount, lit) {
  var base = lit ? 2.4 : (b._viol ? 1.8 : (b._spine ? 2 : 1.25));
  return (base + Math.max(0, visibleCount - 1) * 1.3).toFixed(2);
}

function buildWires() {
  var g = el("g");
  wireRefs = {};
  BUNDLES.forEach(function (b) {
    var pl = el("polyline");
    pl.setAttribute("class", b._viol ? "wire viol" : (b._spine ? "wire spine" : "wire"));
    g.appendChild(pl);

    var marks = [];
    for (var j = 0; j < 4; j++) {
      var m = el("polygon"); m.setAttribute("class", "wire-node");
      g.appendChild(m); marks.push(m);
    }

    var count = null;
    if (b.edges.length > 1) {
      count = el("text");
      count.setAttribute("class", "bundle-count");
      count.textContent = b.edges.length;
      g.appendChild(count);
    }

    /* a fat transparent line, so a 1px wire is actually hoverable */
    var hit = el("polyline");
    hit.setAttribute("class", "wire-hit");
    hit.addEventListener("mouseenter", function (ev) { showEdgePop(b, ev); });
    hit.addEventListener("mousemove", moveEdgePop);
    hit.addEventListener("mouseleave", scheduleHideEdgePop);
    hit.addEventListener("click", function (ev) {
      if (didDrag) return;
      ev.stopPropagation();
      var vis = visibleEdgesOf(b);
      if (vis.length === 1) openPacket(packets[vis[0]]);
      else if (vis.length) showEdgePop(b, ev);
    });
    g.appendChild(hit);

    wireRefs[b.idx] = { line: pl, hit: hit, marks: marks, count: count, bundle: b };
  });
  return g;
}

function visibleEdgesOf(b) {
  return b.edges.filter(function (i) { return FLOWS[EDGES[i].flow].on; });
}

function polylineMeta(pts) {
  var segs = [], total = 0;
  for (var i = 0; i < pts.length - 1; i++) {
    var dx = pts[i+1][0] - pts[i][0], dy = pts[i+1][1] - pts[i][1];
    var L = Math.sqrt(dx*dx + dy*dy);
    segs.push(L); total += L;
  }
  return { segs: segs, total: total || 1 };
}

function pointAt(pts, meta, dist) {
  var d = dist;
  for (var i = 0; i < meta.segs.length; i++) {
    if (d <= meta.segs[i] || i === meta.segs.length - 1) {
      var t = meta.segs[i] === 0 ? 0 : Math.max(0, Math.min(1, d / meta.segs[i]));
      return [ pts[i][0] + (pts[i+1][0] - pts[i][0]) * t,
               pts[i][1] + (pts[i+1][1] - pts[i][1]) * t ];
    }
    d -= meta.segs[i];
  }
  return pts[pts.length - 1];
}

/* Offset a point sideways from the path, so packets sharing a bundle ride in
   their own lane instead of overlapping. */
function pointAtOffset(pts, meta, dist, off) {
  var p = pointAt(pts, meta, dist);
  if (!off) return p;
  var q = pointAt(pts, meta, Math.min(meta.total, dist + 2));
  var dx = q[0] - p[0], dy = q[1] - p[1];
  var L = Math.sqrt(dx * dx + dy * dy) || 1;
  return [p[0] - dy / L * off, p[1] + dx / L * off];
}

function laneOffset(e) {
  var n = e._bundle ? e._bundle.edges.length : 1;
  if (n < 2) return 0;
  return (e._lane - (n - 1) / 2) * 5.5;
}

function applyWires() {
  BUNDLES.forEach(function (b) {
    var first = EDGES[b.edges[0]];
    var grid = edgeGridPath(first);
    var pts = grid.map(function (g3) { return proj(g3[0], g3[1], g3[2]); });
    b._pts = pts;
    b._meta = polylineMeta(pts);

    /* every edge rides the bundle; ones pointing the other way ride it backwards */
    b.edges.forEach(function (ei) {
      var e = EDGES[ei];
      if (e.from === first.from) { e._pts = pts; e._meta = b._meta; }
      else { e._pts = pts.slice().reverse(); e._meta = polylineMeta(e._pts); }
    });

    var w = wireRefs[b.idx];
    var d = pts.map(pt).join(" ");
    w.line.setAttribute("points", d);
    w.hit.setAttribute("points", d);

    var spots = [];
    for (var j = 1; j < pts.length - 1; j++) spots.push(pts[j]);
    var mid = pointAt(pts, b._meta, b._meta.total / 2);
    spots.push(mid);
    w.marks.forEach(function (m, mi) {
      if (mi >= spots.length) { m.setAttribute("points", ""); return; }
      var s = spots[mi], r = 3.2;
      m.setAttribute("points", [[s[0],s[1]-r],[s[0]+r,s[1]],[s[0],s[1]+r],[s[0]-r,s[1]]].map(pt).join(" "));
    });
    if (w.count) {
      w.count.setAttribute("x", (mid[0] + 10).toFixed(1));
      w.count.setAttribute("y", (mid[1] - 10).toFixed(1));
    }
  });
}

/* ---- the popover listing what runs along a bundle ---- */
var edgePop, popTimer = null;

function showEdgePop(b, ev) {
  clearTimeout(popTimer);
  var vis = visibleEdgesOf(b);
  if (!vis.length) return;
  var html = '<div class="pop-head">' + esc(byId[b.from].short) + ' &harr; ' +
             esc(byId[b.to].short) + ' · ' + vis.length +
             (vis.length === 1 ? ' edge' : ' edges') + '</div>';
  vis.forEach(function (i) {
    var e = EDGES[i];
    html += '<button data-edge="' + i + '">' + esc(e.pk) +
            '<span class="pop-dir">' + esc(byId[e.from].short) + ' &rarr; ' +
            esc(byId[e.to].short) + ' · ' + esc(FLOWS[e.flow].label.toLowerCase()) +
            '</span></button>';
  });
  edgePop.innerHTML = html;
  edgePop.style.display = "block";
  edgePop.querySelectorAll("[data-edge]").forEach(function (btn) {
    btn.addEventListener("click", function (ev2) {
      ev2.stopPropagation();
      hideEdgePop();
      openPacket(packets[parseInt(btn.getAttribute("data-edge"), 10)]);
    });
  });
  moveEdgePop(ev);
}

function moveEdgePop(ev) {
  if (edgePop.style.display !== "block") return;
  var r = stage.getBoundingClientRect();
  var x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
  var w = edgePop.offsetWidth, h = edgePop.offsetHeight;
  if (x + w > r.width - 8) x = r.width - w - 8;
  if (y + h > r.height - 8) y = ev.clientY - r.top - h - 14;
  edgePop.style.left = Math.max(4, x) + "px";
  edgePop.style.top = Math.max(4, y) + "px";
}

function scheduleHideEdgePop() { popTimer = setTimeout(hideEdgePop, 280); }
function hideEdgePop() { if (edgePop) edgePop.style.display = "none"; }

/* moving the pointer into the popover must not dismiss it */
var edgePopWired = false;
function wireEdgePopHover() {
  if (edgePopWired) return;
  edgePopWired = true;
  edgePop.addEventListener("mouseenter", function () { clearTimeout(popTimer); });
  edgePop.addEventListener("mouseleave", hideEdgePop);
}

/* ---- group colour ------------------------------------------------------
   A node is coloured by its group, not by the level it happens to be drawn
   at, so the same neighbourhood is recognisable in every layout. Applied in
   paintState rather than applyNodes, so selection still overrides it. */

var colourMode = "group";        /* group | none */
var colourCache = {};

function groupColour(gid) {
  if (!gid) return null;
  if (colourCache[gid]) return colourCache[gid];
  var v = getComputedStyle(document.documentElement)
            .getPropertyValue("--g-" + gid).trim();
  if (!v) {
    /* an unknown group — drill-down subdirectories — gets a stable hue */
    var h = 0;
    for (var i = 0; i < gid.length; i++) h = (h * 31 + gid.charCodeAt(i)) % 360;
    v = "hsl(" + h + ", 24%, 48%)";
  }
  colourCache[gid] = v;
  return v;
}

function shade(css, amount) {
  var r, g, b;
  var m = css.match(/^#([0-9a-f]{6})$/i);
  if (m) {
    var n = parseInt(m[1], 16);
    r = n >> 16; g = (n >> 8) & 255; b = n & 255;
  } else {
    var probe = document.createElement("span");
    probe.style.color = css;
    document.body.appendChild(probe);
    var rgb = getComputedStyle(probe).color.match(/\d+/g);
    document.body.removeChild(probe);
    if (!rgb) return css;
    r = +rgb[0]; g = +rgb[1]; b = +rgb[2];
  }
  function c(x) { return Math.max(0, Math.min(255, Math.round(x * amount))); }
  return "rgb(" + c(r) + "," + c(g) + "," + c(b) + ")";
}

/* A label sits on the face, not on the page. The group hues are the same in
   both themes, so in dark mode a light --ink label landed on a light face and
   vanished. Pick the ink from the face's own luminance instead. */
function inkOn(css) {
  var rgb = css.match(/\d+/g);
  if (!rgb) return "";
  var lin = function (v) {
    v /= 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  var L = 0.2126 * lin(+rgb[0]) + 0.7152 * lin(+rgb[1]) + 0.0722 * lin(+rgb[2]);
  return L > 0.34 ? "#17160e" : "#ede7c6";
}

function paintNodeColour(n, selected) {
  var refs = nodeRefs[n.id];
  if (!refs) return;
  var col = (!selected && colourMode === "group") ? groupColour(n.grp) : null;
  /* top face lightest, then right, then left — the same reading as the
     monochrome faces, so the drawing keeps its light source */
  var top = col ? shade(col, 1.42) : "";
  refs.polys[4].style.fill = top;
  refs.polys[2].style.fill = col ? shade(col, 1.10) : "";
  refs.polys[0].style.fill = col ? shade(col, 0.88) : "";
  /* uncoloured faces use --face-top, which does flip with the theme, so there
     the stylesheet already has it right — leave it alone */
  refs.label.style.fill = col ? inkOn(top) : "";
}

/* ---- boxes ---- */
var nodeRefs = {};

function buildNodes() {
  var g = el("g");
  nodeRefs = {};
  NODES.forEach(function (n) {
    var grp = el("g", { tabindex: "0", role: "button" });
    grp.setAttribute("class", "node");
    grp.setAttribute("aria-label", n.name);

    var left  = el("polygon"); left.setAttribute("class", "face-left shell-poly");
    var leftH = el("polygon", { fill: "url(#hatch)", stroke: "none" });
    var right = el("polygon"); right.setAttribute("class", "face-right shell-poly");
    var rightH= el("polygon", { fill: "url(#hatch2)", stroke: "none" });
    var top   = el("polygon"); top.setAttribute("class", "face-top shell-poly");
    var lbl   = el("text"); lbl.setAttribute("class", "short-label"); lbl.textContent = n.short;

    [left, leftH, right, rightH, top, lbl].forEach(function (c) { grp.appendChild(c); });

    grp.addEventListener("mouseenter", function () { hoveredNode = n.id; paintState(); });
    grp.addEventListener("mouseleave", function () { hoveredNode = null; paintState(); });
    grp.addEventListener("click", function (ev) {
      if (didDrag) return;
      ev.stopPropagation(); selectNode(n.id);
    });
    grp.addEventListener("dblclick", function (ev) {
      if (didDrag) return;
      ev.stopPropagation();
      if (VIEW.mode === "system") enterPart(n.id);
      else if (VIEW.mode === "part") enterFile(n);
    });
    grp.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(n.id); }
    });

    g.appendChild(grp);
    nodeRefs[n.id] = { g: grp, polys: [left, leftH, right, rightH, top], label: lbl };
  });
  return g;
}

function applyNodes() {
  NODES.forEach(function (n) {
    var f = boxFaces(n);
    var r = nodeRefs[n.id];
    var L = f.left.map(pt).join(" "), R = f.right.map(pt).join(" "), T = f.top.map(pt).join(" ");
    r.polys[0].setAttribute("points", L);
    r.polys[1].setAttribute("points", L);
    r.polys[2].setAttribute("points", R);
    r.polys[3].setAttribute("points", R);
    r.polys[4].setAttribute("points", T);
    r.label.setAttribute("x", f.apex[0].toFixed(2));
    r.label.setAttribute("y", f.apex[1].toFixed(2));
    /* keep the name inside the top face as the plan flattens */
    var wpx = Math.abs(f.top[1][0] - f.top[3][0]);
    var size = Math.max(5.4, Math.min(8.4, wpx / (n.short.length * 0.78)));
    r.label.setAttribute("font-size", size.toFixed(1));
    n._faces = f;
  });
  sortNodesByDepth();
}

function sortNodesByDepth() {
  var order = NODES.slice().sort(function (a, b) {
    return depthOf(a._x + a._w/2, a._y + a._d/2, a._z) -
           depthOf(b._x + b._w/2, b._y + b._d/2, b._z);
  });
  order.forEach(function (n) { gNodes.appendChild(nodeRefs[n.id].g); });
}

/* ---- packets ---- */
var packets = [];

function buildPackets() {
  var g = el("g");
  packets = [];
  EDGES.forEach(function (e, i) {
    var grp = el("g");
    grp.setAttribute("class", e.flow === "viol" ? "pkt viol" : "pkt");
    var halo = el("circle", { r: 7, cx: 0, cy: 0 }); halo.setAttribute("class", "pkt-halo");
    var body = el("circle", { r: 3.6, cx: 0, cy: 0 }); body.setAttribute("class", "pkt-body");
    grp.appendChild(halo); grp.appendChild(body);
    var p = { edge: e, idx: i, g: grp, ratio: (i * 0.37) % 1, jitter: 0.85 + ((i * 13) % 7) / 20 };
    grp.addEventListener("click", function (ev) {
      if (didDrag) return;
      ev.stopPropagation();
      openPacket(p);
    });
    packets.push(p);
    g.appendChild(grp);
  });
  return g;
}

function buildScene() {
  svg.textContent = "";
  var defs = el("defs");
  [["hatch", 5], ["hatch2", 3.2]].forEach(function (h) {
    var pat = el("pattern", { id: h[0], width: h[1], height: h[1],

    ln.setAttribute("class", "hatch-line");

  });

  scene = el("g", { id: "scene" });

  gBands = buildBands();
  gWires = buildWires();

  gPackets = buildPackets();
  /* bands sit above the boxes so their labels stay readable */
  [gGrid, gWires, gNodes, gPackets, gBands].forEach(function (g) { scene.appendChild(g); });

  hoverLabel = el("text"); hoverLabel.setAttribute("class", "name-label");
  hoverLabel.style.display = "none";
  scene.appendChild(hoverLabel);

}

/* One call re-projects everything; nothing is recreated, so the angle
   slider and the layout switch are both cheap. */
function applyGeometry() {
  updateSpinOrigin();
  applyGround();
  applyBands();
  applyWires();
  applyNodes();
}

/* Tiers separate by elevation alone, so a true plan view would stack them on
   top of one another. Cap the angle while a stacked layout is showing. */
function syncAngleRange() {
  var input = document.getElementById("angle");
  var max = (LAYOUTS[layout] || LAYOUT_DEFAULTS).maxPitch || 90;
  input.max = max;
  if (pitchDeg > max) {
    pitchDeg = max;
    input.value = max;
    var out = document.getElementById("angle-out");
    if (out) out.textContent = max + "°";
  }
}

function relayout(id, keepView) {
  if (!LAYOUTS[id]) { console.warn("no such layout: " + id); return; }
  layout = id;
  runLayout();
  syncAngleRange();
  applyGeometry();
  paintLayoutBar();
  if (!keepView) resetView();
  paintState();
}

/* ============================================================
   6. VIEW
   ============================================================ */

function applyView() {
  scene.setAttribute("transform",
    "translate(" + view.tx.toFixed(2) + "," + view.ty.toFixed(2) + ") scale(" + view.k.toFixed(4) + ")");
}

function resetView() {
  var r = stage.getBoundingClientRect();
  var xs = [], ys = [];
  NODES.forEach(function (n) {
    var f = n._faces || boxFaces(n);
    [f.top, f.left, f.right].forEach(function (face) {
      face.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); });
    });
  });
  /* band labels hang off the left end of each row — keep them in frame */
  BANDS.forEach(function (b) {
    var p = proj(b.x, b.y, b.z);
    xs.push(p[0] - b.label.length * 6.2); ys.push(p[1]);
  });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var pad = 70;
  var k = Math.min((r.width - pad*2) / Math.max(1, maxX - minX),
                   (r.height - pad*2) / Math.max(1, maxY - minY));
  view.k = Math.max(0.22, Math.min(1.6, k));
  view.tx = r.width/2 - ((minX + maxX)/2) * view.k;
  view.ty = r.height/2 - ((minY + maxY)/2) * view.k;
  applyView();
}

function zoomAt(factor, cx, cy) {
  var r = stage.getBoundingClientRect();
  if (cx === undefined) { cx = r.width/2; cy = r.height/2; }
  var nk = Math.max(0.15, Math.min(4, view.k * factor));
  var ratio = nk / view.k;
  view.tx = cx - (cx - view.tx) * ratio;
  view.ty = cy - (cy - view.ty) * ratio;
  view.k = nk;
  applyView();
}

function isControl(t) {
  return !!(t.closest && t.closest("#topleft, #zoomers, #dials, button, input, label"));
}

var DRAG_THRESHOLD = 4;
var dragging = false, pressed = false, didDrag = false, dragStart = null;

stage.addEventListener("pointerdown", function (ev) {
  if (isControl(ev.target)) return;
  pressed = true; didDrag = false;
  dragStart = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
});
stage.addEventListener("pointermove", function (ev) {
  if (!pressed) return;
  var dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;
  if (!dragging && Math.sqrt(dx*dx + dy*dy) < DRAG_THRESHOLD) return;
  if (!dragging) {
    dragging = true; didDrag = true;
    stage.classList.add("dragging");
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  }
  view.tx = dragStart.tx + dx; view.ty = dragStart.ty + dy;
  applyView();
});
stage.addEventListener("pointerup", function (ev) {
  pressed = false; dragging = false; stage.classList.remove("dragging");
  try { stage.releasePointerCapture(ev.pointerId); } catch (e) {}
});
stage.addEventListener("pointercancel", function () {
  pressed = false; dragging = false; stage.classList.remove("dragging");
});
stage.addEventListener("wheel", function (ev) {
  ev.preventDefault();
  var r = stage.getBoundingClientRect();
  zoomAt(ev.deltaY < 0 ? 1.12 : 1/1.12, ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });
stage.addEventListener("click", function (ev) {
  if (isControl(ev.target) || didDrag) return;
  if (ev.target.closest(".pkt") || ev.target.closest(".node")) return;
  selectedNode = null; selectedPacket = null;
  renderPanel(); paintState(); paintRail();
});

/* ============================================================
   7. ANIMATION
   ============================================================ */

var running = true, speed = 80, lastT = 0, stepBudget = 0;

function tick(ts) {
  if (!lastT) lastT = ts;
  var dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;

  var advance = 0;
  if (running) advance = dt * speed;
  else if (stepBudget > 0) {
    advance = Math.min(stepBudget, dt * speed * 2.2);
    stepBudget -= advance;
  }

  packets.forEach(function (p) {
    if (!FLOWS[p.edge.flow].on) { p.g.style.display = "none"; return; }
    p.g.style.display = "";
    if (advance > 0) {
      p.ratio += advance * p.jitter / p.edge._meta.total;
      if (p.ratio > 1) p.ratio -= 1;
    }
    var xy = pointAtOffset(p.edge._pts, p.edge._meta,
                           p.ratio * p.edge._meta.total, laneOffset(p.edge));
    p.g.setAttribute("transform", "translate(" + xy[0].toFixed(2) + "," + xy[1].toFixed(2) + ")");
  });

  requestAnimationFrame(tick);
}

/* ============================================================
   8. STATE PAINTING
   ============================================================ */

function computeFlagged() {
  var out = {};
  FINDINGS.forEach(function (f) {
    if (!f.node) return;
    if (f.sev === "high" || f.sev === "medium") {
      if (!out[f.node] || f.sev === "high") out[f.node] = f.sev;
    }
  });
  return out;
}
var FLAGGED = computeFlagged();

function relatedEdgeIdx(nodeId) {
  var out = [];
  EDGES.forEach(function (e, i) { if (e.from === nodeId || e.to === nodeId) out.push(i); });
  return out;
}

function paintState() {
  var focus = selectedNode || hoveredNode;
  var lit = focus ? relatedEdgeIdx(focus) : [];
  var litSet = {};
  lit.forEach(function (i) { litSet[i] = true; });

  if (selectedPacket && !focus) {
    litSet[selectedPacket.idx] = true;
    lit.push(selectedPacket.idx);
    focus = selectedPacket.edge.from;
  }

  /* a focused group dims everything else, unless a part is already open */
  if (groupFocus && !focus) {
    NODES.forEach(function (n) {
      var g = nodeRefs[n.id].g;
      g.classList.toggle("dim", n.grp !== groupFocus);
    });
  }

  var neighbours = {};
  if (focus) {
    neighbours[focus] = true;
    lit.forEach(function (i) {
      neighbours[EDGES[i].from] = true; neighbours[EDGES[i].to] = true;
    });
  }

  NODES.forEach(function (n) {
    var g = nodeRefs[n.id].g;
    var sel = selectedNode === n.id;
    g.classList.toggle("selected", sel);
    g.classList.toggle("hovered", hoveredNode === n.id);
    g.classList.toggle("dim",
      (!!focus && !neighbours[n.id]) || (!focus && !!groupFocus && n.grp !== groupFocus));
    g.classList.toggle("flagged", FLAGGED[n.id] === "high");
    paintNodeColour(n, sel);
  });

  BUNDLES.forEach(function (b) {
    var w = wireRefs[b.idx];
    var vis = visibleEdgesOf(b);
    var isLit = vis.some(function (i) { return litSet[i] || i === railHoverEdge; });
    var muted = !vis.length || (!!focus && !isLit);
    w.line.classList.toggle("muted", muted);
    w.line.classList.toggle("lit", isLit);
    w.line.style.strokeWidth = wireWidth(b, vis.length, isLit);
    w.marks.forEach(function (m) { m.classList.toggle("muted", muted); });
    if (w.count) {
      w.count.textContent = vis.length;
      w.count.style.display = vis.length > 1 && !muted ? "" : "none";
    }
  });

  packets.forEach(function (p) {
    p.g.classList.toggle("sel", selectedPacket === p);
    p.g.style.opacity = (!!focus && !litSet[p.idx]) ? "0.12" : "1";
  });

  paintHoverLabel();
}

function paintHoverLabel() {
  var id = hoveredNode || selectedNode;
  if (!id || !nodeRefs[id]) { hoverLabel.style.display = "none"; return; }
  var n = byId[id];
  var f = n._faces || boxFaces(n);
  hoverLabel.setAttribute("x", f.apex[0].toFixed(2));
  hoverLabel.setAttribute("y", (f.apex[1] - 22).toFixed(2));
  hoverLabel.textContent = n.name.toUpperCase();
  hoverLabel.style.display = "";
}

function paintTopbar() {
  var cell = document.getElementById("repo-cell");
  cell.innerHTML = "";
  var b = document.createElement("b"); b.textContent = MODEL.repo.name;
  var s = document.createElement("span"); s.textContent = " " + (MODEL.repo.tagline || "");
  cell.appendChild(b); cell.appendChild(s);

  var bar = document.getElementById("statstrip");
  bar.textContent = "";
  statButtons = {};
  (MODEL.repo.stats || []).forEach(function (st) {
    /* a stat that has a page behind it is a button into that page */
    var live = st.page && (MODEL.pages || {})[st.page];
    var d = document.createElement(live ? "button" : "div");
    d.className = "stat" + (live ? " linked" : "");
    var k = document.createElement("span"); k.className = "stat-k"; k.textContent = st.k;
    var v = document.createElement("span");
    v.className = "stat-v" + (st.flag === "bad" ? " bad" : "");
    v.textContent = st.v;
    d.appendChild(k); d.appendChild(v);
    if (live) {
      d.type = "button";
      d.setAttribute("aria-expanded", "false");
      d.title = "Open the " + MODEL.pages[st.page].label.toLowerCase();
      d.addEventListener("click", function () { openStatPage(st.page); });
      statButtons[st.page] = d;
    }
    bar.appendChild(d);
  });
}

var statButtons = {};
function paintStatBar() {
  Object.keys(statButtons).forEach(function (p) {
    statButtons[p].setAttribute("aria-expanded", openPage === p ? "true" : "false");
  });
}

var GROUPS = MODEL.groups;

var railBody = document.getElementById("railbody");
var railItems = {};

function buildRail() {
  railBody.textContent = "";
  GROUPS.forEach(function (grp) {

/* ---- connections panel: the same list the drawing draws, as text ---- */

var edgeBody = document.getElementById("edgebody");
var edgeItems = [];
var railHoverEdge = null;   /* hovering a row lights its wire in the drawing */

function buildEdgeRail() {
  edgeBody.textContent = "";
  edgeItems = [];
  if (!EDGES.length) {
    var e = document.createElement("p");
    e.className = "rpane-empty";
    e.textContent = inDrill()
      ? "No connections were resolved between these."
      : "This drawing has no edges.";
    edgeBody.appendChild(e);
    return;
  }
  EDGES.forEach(function (ed, i) {
    var from = byId[ed.from], to = byId[ed.to];
    if (!from || !to) return;
    var b = document.createElement("button");
    b.className = "eitem";
    b.setAttribute("aria-selected", "false");
    var dot = document.createElement("span");
    dot.className = "dot";
    var flow = FLOWS[ed.flow];
    if (flow) dot.style.background = flowColour(ed.flow);
    var r = document.createElement("span");
    r.className = "er";
    r.innerHTML = "<b></b> &rarr; <b></b>";
    r.querySelectorAll("b")[0].textContent = from.short || from.name;
    r.querySelectorAll("b")[1].textContent = to.short || to.name;
    var c = document.createElement("span");
    c.className = "ec";
    c.textContent = ed.pk || (flow ? flow.label : "");
    b.appendChild(dot); b.appendChild(r); b.appendChild(c);
    b.title = from.name + " → " + to.name + (ed.pk ? " · " + ed.pk : "");
    b.addEventListener("click", function () {
      if (packets[i]) openPacket(packets[i]);
      else { selectNode(ed.from); }
    });
    b.addEventListener("mouseenter", function () { railHoverEdge = i; paintState(); });
    b.addEventListener("mouseleave", function () { railHoverEdge = null; paintState(); });
    edgeBody.appendChild(b);
    edgeItems.push({ el: b, edge: ed, i: i,
                     hay: (from.name + " " + to.name + " " + (ed.pk || "") + " " +
                           (ed.label || "") + " " + ed.flow).toLowerCase() });
  });
}

function flowColour(id) {
  var order = MODEL.flows.map(function (f) { return f.id; }).indexOf(id);
  var hues = ["--g-loop", "--g-feed", "--g-schema", "--g-after", "--g-id", "--g-surf"];
  return getComputedStyle(document.documentElement)
           .getPropertyValue(hues[(order < 0 ? 0 : order) % hues.length]).trim() ||
         "var(--ink-3)";
}

function paintRail() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  var shown = 0;
  NODES.forEach(function (n) {
    var b = railItems[n.id];
    if (!b) return;
    b.setAttribute("aria-selected", selectedNode === n.id ? "true" : "false");
    var hit = !q || (n.name + " " + n.sub + " " + n.key + " " + n.short).toLowerCase().indexOf(q) >= 0;
    if (hit) shown++;
    b.classList.toggle("dim", !hit);
    if (nodeRefs[n.id]) nodeRefs[n.id].g.classList.toggle("searchdim", !hit && !!q);
  });
  countPane("parts", shown, NODES.length);

  var eshown = 0;
  edgeItems.forEach(function (it) {
    var hit = !q || it.hay.indexOf(q) >= 0;
    if (hit) eshown++;
    it.el.classList.toggle("dim", !hit);
    it.el.setAttribute("aria-selected",
      selectedPacket && selectedPacket.edge === it.edge ? "true" : "false");
  });
  countPane("edges", eshown, edgeItems.length);
}

function countPane(id, shown, total) {
  var el = document.getElementById("rpane-" + id + "-n");
  if (el) el.textContent = shown === total ? String(total) : shown + "/" + total;
}

/* ---- panel collapse, remembered ---- */
["parts", "edges"].forEach(function (id) {
  var sec = document.getElementById("rpane-" + id);
  var head = sec.querySelector(".rpane-head");
  var saved = null;
  try { saved = localStorage.getItem("repolens.rpane." + id); } catch (e) {}

  };
  set(open);
  head.addEventListener("click", function () { set(!open); });
});

   10. INSPECTOR

var panel = document.getElementById("panel");
function byIdSystem(id) {
  return SYSTEM_DATA.nodes.filter(function (n) { return n.id === id; })[0];
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var SYSTEM = MODEL.system;

function nodeMetrics(n) {
  return '<dl class="kv">' +
    '<dt>Key</dt><dd>' + esc(n.key) + '</dd>' +
    '<dt>Lines</dt><dd>' + n.loc.toLocaleString() + '</dd>' +
    '<dt>Files</dt><dd>' + n.files + '</dd>' +
    '<dt>Avg / file</dt><dd>' + Math.round(n.loc / n.files).toLocaleString() + '</dd>' +
    '<dt>Löwy layer</dt><dd>' + esc(n.layer) + '</dd>' +
    '<dt>Height shows</dt><dd>' + (heightMode === "loc" ? "lines of code" : "file count") + '</dd>' +
    '</dl>';
}

function connectionsBlock(n) {
  var ins = EDGES.filter(function (e) { return e.to === n.id; });
  var outs = EDGES.filter(function (e) { return e.from === n.id; });
  var html = '<div class="sec">Connections</div><div class="chiprow">';
  outs.forEach(function (e) { html += '<button class="chip" data-goto="' + e.to + '">&rarr; ' + esc(byId[e.to].name) + '</button>'; });
  ins.forEach(function (e) { html += '<button class="chip" data-goto="' + e.from + '">&larr; ' + esc(byId[e.from].name) + '</button>'; });
  html += '</div>';
  if (outs.length || ins.length) {
    html += '<p style="color:var(--ink-3);font-size:11px;">Open a connection to read the data that travels along it.</p><div class="chiprow">';
    outs.concat(ins).forEach(function (e) {
      html += '<button class="chip" data-pkt="' + EDGES.indexOf(e) + '">&#9679; ' + esc(e.pk) + '</button>';
    });
    html += '</div>';
  }
  return html;
}

/* What this thing is, as a link target: a part, one of its files, or one of
   that file's symbols, depending on how far in you have gone. */
function targetKeyOf(n) {
  if (VIEW.mode === "file") return "sym:" + VIEW.path + "#" + n.name;
  if (VIEW.mode === "part") return n.path ? "file:" + n.path : null;
  return "part:" + n.id;
}

/* The decisions page read backwards: not "what is this decision about" but
   "what was decided about this". Shown whether or not there are any, because
   an empty section with a way to fill it is the point. */
function decisionsFor(targetKey) {
  var page = PAGES.decisions;
  if (!page || !targetKey) return [];
  var out = [];
  page.items.forEach(function (it) {
    var hit = itemLinks("decisions", it).filter(function (l) {
      return tkey(l) === targetKey;
    })[0];
    if (hit) out.push({ it: it, link: hit });
  });
  return out;
}

var DEC_SHOWN = 24;

function decisionsBlock(targetKey) {
  var page = PAGES.decisions;
  if (!page) return "";
  var mine = decisionsFor(targetKey);
  var html = '<div class="sec">Decisions · ' + mine.length + '</div>';
  if (!mine.length) {
    html += '<p style="color:var(--ink-3);font-size:11px;">' +
            'Nothing logged is linked here yet.</p>';
  }
  mine.slice(0, DEC_SHOWN).forEach(function (m) {
    var d = m.it, why = (m.link.why || []).join(", ");
    var guessed = m.link.src === "matched";
    html += '<details class="dec ' + (guessed ? "guessed" : "authored") + '"><summary>' +
      '<span class="dec-id">' + esc(d.id) + '</span>' +
      '<span>' + esc(d.title) + '</span>' +
      '<button class="x dec-x" title="Unlink this decision" data-undec="' + esc(d.id) +
        '" data-target="' + esc(targetKey) + '">&times;</button>' +
      '</summary>' +
      (d.body ? '<div class="dec-body">' + esc(d.body) + '</div>' : '') +
      '<div class="dec-body" style="color:var(--ink-3)">' +
        (d.meta || []).filter(function (kv) { return kv[1]; })
          .map(function (kv) { return esc(kv[1]); }).join(" · ") + '</div>' +
      '<div class="dec-on">' + (guessed
        ? 'Guessed from the word <b>' + esc(why) + '</b> in the text.'
        : 'Linked by hand.') + '</div>' +
      '</details>';
  });
  if (mine.length > DEC_SHOWN) {
    html += '<p style="color:var(--ink-3);font-size:11px;">' +
            (mine.length - DEC_SHOWN) + ' more — open the Decisions list to see them all.</p>';
  }
  html += '<div class="lk"><button class="lk-add" data-adddec="1" data-target="' +
          esc(targetKey) + '">+ Link a decision…</button></div>';
  if (mine.some(function (m) { return m.link.src === "matched"; })) {
    html += '<p style="color:var(--ink-3);font-size:11px;margin-top:8px;">' +
            'A dashed edge means the link was guessed from a word in the text, not ' +
            'declared — open one to see which word. Unlink the wrong ones; the ' +
            'correction survives the next build.</p>';
  }
  return html;
}

function scaleBars(n) {
  var top = NODES.slice().sort(function (a,b) { return b.loc - a.loc; }).slice(0, 8);
  if (top.indexOf(n) < 0) top[7] = n;
  var max = top[0].loc;
  var html = '<div class="sec">Size in context</div>';
  top.forEach(function (t) {
    html += '<div class="bar-row"><span class="bn">' + esc(t.name) + '</span>' +
            '<span class="bar-track"><span class="bar-fill' + (t.id === n.id ? ' hot' : '') +
            '" style="width:' + (t.loc / max * 100).toFixed(1) + '%"></span></span>' +
            '<span class="bv">' + Math.round(t.loc/1000) + 'k</span></div>';
  });
  return html;
}

/* Only ever the findings of one part now — the whole list lives on its own
   page, reached from the topbar count. */
function findingsHTML(forNode) {
  var list = FINDINGS.filter(function (f) { return f.node === forNode; });
  list = list.slice().sort(function (a, b) { return SEV_ORDER[a.sev] - SEV_ORDER[b.sev]; });

  var html = "";
  list.forEach(function (f) {
    var i = FINDINGS.indexOf(f);
    html += '<button class="find ' + f.sev + '" data-find="' + i + '">' +
      '<span class="find-head">' +
        '<span class="find-sev">' + (f.sev === "good" ? "good" : f.sev) + '</span>' +
        '<span class="find-title">' + esc(f.title) + '</span>' +
        (f.node ? '<span class="find-where">' + esc(byId[f.node].short) + '</span>' : '') +
      '</span>' +
      '<span class="find-body">' + esc(f.body) + '</span>' +
      '<span class="find-ev">' + esc(f.ev) + '</span>' +
    '</button>';
  });

  if (!list.length) html += '<p style="color:var(--ink-3);">Nothing recorded at this severity.</p>';
  return html;
}

function endpointCard(n, dir) {
  return '<div class="sec">' + dir + ' &middot; ' + esc(n.name) + '</div>' +
    '<p>' + esc(n.does) + '</p>' +
    '<dl class="kv">' +
      '<dt>Lines</dt><dd>' + n.loc.toLocaleString() + '</dd>' +
      '<dt>Files</dt><dd>' + n.files + '</dd>' +
      '<dt>Löwy layer</dt><dd>' + esc(n.layer) + '</dd>' +
    '</dl>' +
    '<div class="chiprow"><button class="chip" data-goto="' + n.id + '">Open ' +

function renderPanel() {
  buildTabs();                       /* the tab set follows the selection */
  var html = "";

  if (selectedItem) {
    panel.innerHTML = itemPanelHTML();
    wirePanelChips(); panel.scrollTop = 0; return;
  }

  /* a list is open but nothing picked from it — say what happens if you do,
     rather than leaving the system essay up as if the list were not there */

  if (!selectedNode && VIEW.mode === "file") {

    var bySize = NODES.slice().sort(function (a, b) { return b.loc - a.loc; });

    NODES.forEach(function (n) { kinds[n.kind] = (kinds[n.kind] || 0) + 1; });

          return k + " " + kinds[k]; }).join(" · ") + '</dd>' +
      (byDeg[0] ? '<dt>Most connected</dt><dd>' + esc(byDeg[0].name) + ' · ' + byDeg[0].degree + '</dd>' : '') +
      (bySize[0] ? '<dt>Largest</dt><dd>' + esc(bySize[0].name) + ' · ' + bySize[0].loc + ' lines</dd>' : '') +

    if (rec.approx) {

            '<button class="chip" data-up="1">&#9666; Back to the part</button>' +
            '<button class="chip" data-exit="1">Back to the system</button></div>';
    panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0; return;
  }

  if (!selectedNode && inDrill()) {
    var parent = SYSTEM_DATA.nodes.filter(function (n) { return n.id === VIEW.node; })[0] || {};
    var rec = (MODEL.drill || {})[VIEW.node] || {};
    var byDeg = NODES.slice().sort(function (a, b) { return b.degree - a.degree; });
    var bySize = NODES.slice().sort(function (a, b) { return b.loc - a.loc; });

    html += '<p>' + esc(LAYOUTS[layout].blurb) + '</p>';
    html += '<dl class="kv">' +
