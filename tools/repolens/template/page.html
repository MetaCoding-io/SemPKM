<title>SemPKM Commit Loop</title>
<style>
/* ============================================================
   SemPKM Commit Loop — an axonometric survey of the repository
   Drafting print on olive paper; negative print in dark.
   ============================================================ */

:root {
  --paper:      #cfc8a2;
  --paper-2:    #c6bf96;
  --paper-3:    #d7d1b0;
  --paper-sunk: #bfb88e;
  --ink:        #17160e;
  --ink-2:      #423f2a;
  --ink-3:      #6d6851;
  --rule:       rgba(23, 22, 14, 0.30);
  --rule-soft:  rgba(23, 22, 14, 0.13);
  --rule-faint: rgba(23, 22, 14, 0.07);
  --accent:     #8d2c0e;
  --on-accent:  #f2ecd2;
  --invert-bg:  #17160e;
  --invert-fg:  #d8d2ae;
  --sev-high:   #8d2c0e;
  --sev-med:    #8a6410;
  --sev-low:    #4a5f33;
  --sev-note:   #6d6851;
  --face-top:   #d9d3b2;
  --face-right: #b9b287;
  --face-left:  #a8a178;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #1a190f;
    --paper-2:    #14130c;
    --paper-3:    #232113;
    --paper-sunk: #100f09;
    --ink:        #ded7ad;
    --ink-2:      #aca684;
    --ink-3:      #7b7660;
    --rule:       rgba(222, 215, 173, 0.30);
    --rule-soft:  rgba(222, 215, 173, 0.13);
    --rule-faint: rgba(222, 215, 173, 0.07);
    --accent:     #d46a33;
    --on-accent:  #17160e;
    --invert-bg:  #ded7ad;
    --invert-fg:  #17160e;
    --sev-high:   #d46a33;
    --sev-med:    #d0a13a;
    --sev-low:    #8fae60;
    --sev-note:   #7b7660;
    --face-top:   #2b2818;
    --face-right: #201e12;
    --face-left:  #191710;
  }
}

:root[data-theme="dark"] {
  --paper:      #1a190f;
  --paper-2:    #14130c;
  --paper-3:    #232113;
  --paper-sunk: #100f09;
  --ink:        #ded7ad;
  --ink-2:      #aca684;
  --ink-3:      #7b7660;
  --rule:       rgba(222, 215, 173, 0.30);
  --rule-soft:  rgba(222, 215, 173, 0.13);
  --rule-faint: rgba(222, 215, 173, 0.07);
  --accent:     #d46a33;
  --on-accent:  #17160e;
  --invert-bg:  #ded7ad;
  --invert-fg:  #17160e;
  --sev-high:   #d46a33;
  --sev-med:    #d0a13a;
  --sev-low:    #8fae60;
  --sev-note:   #7b7660;
  --face-top:   #2b2818;
  --face-right: #201e12;
  --face-left:  #191710;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono",
               Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

#shell {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 396px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh;
  height: 100dvh;
}

/* ---------- top bar ---------- */

#topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  min-height: 46px;
  overflow-x: auto;
  scrollbar-width: none;
}
#topbar::-webkit-scrollbar { display: none; }

.repo-cell {
  display: flex; align-items: center;
  padding: 0 18px; font-size: 15px; letter-spacing: 0.02em;
  border-right: 1px solid var(--rule); white-space: nowrap; flex-shrink: 0;
}
.repo-cell b { font-weight: 600; }
.repo-cell span { color: var(--ink-3); }

.stat {
  padding: 5px 15px; border-right: 1px solid var(--rule-soft);
  white-space: nowrap; flex-shrink: 0;
  display: flex; flex-direction: column; justify-content: center;
}
.stat-k { font-size: 9.5px; letter-spacing: 0.13em; color: var(--ink-3); text-transform: uppercase; }
.stat-v { font-size: 13px; font-variant-numeric: tabular-nums; }
.stat-v em { font-style: normal; color: var(--ink-3); }
.stat-v.bad { color: var(--sev-high); }

#topbar-actions {
  margin-left: auto; display: flex; align-items: center;
  gap: 7px; padding: 0 12px; flex-shrink: 0;
}

/* ---------- buttons ---------- */

.btn {
  font: inherit; font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: 1px solid var(--rule);
  padding: 6px 11px; cursor: pointer; white-space: nowrap;
  transition: background 90ms linear, color 90ms linear;
}
.btn:hover { background: var(--paper-3); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.btn.accent[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- left rail ---------- */

#rail {
  border-right: 1px solid var(--rule); background: var(--paper);
  overflow-y: auto; overflow-x: hidden; padding-bottom: 24px;
}
#rail::-webkit-scrollbar { width: 8px; }
#rail::-webkit-scrollbar-thumb { background: var(--rule-soft); }

#railsearch {
  position: sticky; top: 0; z-index: 3; background: var(--paper);
  border-bottom: 1px solid var(--rule-soft); padding: 7px 8px;
}
#q {
  width: 100%; font: inherit; font-size: 11px; padding: 5px 7px;
  color: var(--ink); background: var(--paper-3); border: 1px solid var(--rule-soft);
}
#q::placeholder { color: var(--ink-3); letter-spacing: 0.08em; }
#q:focus { outline: none; border-color: var(--accent); }

.grp {
  font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ink-3); padding: 15px 10px 5px;
}

.item {
  display: grid; grid-template-columns: 15px minmax(0, 1fr) auto;
  gap: 7px; align-items: start; width: 100%; text-align: left;
  font: inherit; font-size: 11px; letter-spacing: 0.035em;
  color: var(--ink); background: transparent;
  border: 1px solid var(--rule-soft); border-left: 2px solid transparent;
  margin: 0 0 -1px 0; padding: 6px 8px 6px 6px; cursor: pointer; text-transform: uppercase;
}
.item:hover { background: var(--paper-3); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item .k { color: var(--ink-3); font-size: 10px; }
.item .n { line-height: 1.35; }
.item .c { color: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.item[aria-selected="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.item[aria-selected="true"] .k, .item[aria-selected="true"] .c { color: var(--invert-fg); opacity: 0.65; }
.item.dim { opacity: 0.24; }
.item.hasfind { border-left-color: var(--sev-med); }
.item.hasfind-high { border-left-color: var(--sev-high); }

/* ---------- canvas ---------- */

#stage { position: relative; overflow: hidden; background: var(--paper); cursor: grab; }
#stage.dragging { cursor: grabbing; }
#svg { display: block; width: 100%; height: 100%; touch-action: none; }

#zoomers {
  position: absolute; top: 10px; right: 10px;
  display: flex; flex-direction: column; z-index: 2;
}
#zoomers .btn { padding: 3px 8px; font-size: 13px; letter-spacing: 0; margin-bottom: -1px; background: var(--paper); }

#topleft {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  display: flex; flex-direction: column; gap: 7px; max-width: calc(100% - 90px);
}
.ctlrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.ctlrow .btn { background: var(--paper); font-size: 9.5px; padding: 4px 8px; }
.ctlrow .btn[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
.ctl-label {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); padding-right: 3px;
}
.swatch {
  display: inline-block; width: 7px; height: 7px; margin-right: 5px;
  vertical-align: baseline; border: 1px solid currentColor;
}
.btn[aria-pressed="true"] .swatch { background: currentColor; }

#dials {
  position: absolute; left: 10px; bottom: 10px; z-index: 2;
  background: var(--paper); border: 1px solid var(--rule);
  padding: 7px 11px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
}
#dials label, #dials .dlab {
  font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-3);
}
#dials .sep { width: 1px; align-self: stretch; background: var(--rule); }
.readout { font-size: 10px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 34px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 88px; height: 15px; background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 9px; height: 13px;
  background: var(--ink); margin-top: -6px; border-radius: 0;
}
input[type="range"]::-moz-range-thumb { width: 9px; height: 13px; background: var(--ink); border: 0; border-radius: 0; }
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* scene primitives */
.face-top   { fill: var(--face-top); }
.face-right { fill: var(--face-right); }
.face-left  { fill: var(--face-left); }
.hatch-line { stroke: var(--rule-soft); stroke-width: 0.9; }
.grid-line  { stroke: var(--rule-faint); stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; }
.plot-line  { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 5 4; fill: none; vector-effect: non-scaling-stroke; }

.wire { stroke: var(--ink-2); stroke-width: 1.25; fill: none; vector-effect: non-scaling-stroke; opacity: 0.8; }
.wire.spine { stroke: var(--ink); stroke-width: 2; opacity: 1; }
.wire.viol  { stroke: var(--sev-high); stroke-width: 1.8; stroke-dasharray: 6 4; opacity: 1; }
.wire.muted { opacity: 0.09; stroke-width: 1.25; }
.wire.lit   { stroke: var(--accent); opacity: 1; stroke-width: 2.4; }
.wire-node  { fill: var(--ink-2); opacity: 0.7; }
.wire-node.muted { opacity: 0.09; }

.node { cursor: pointer; }
.node .shell-poly { stroke: var(--ink); stroke-width: 1.1; vector-effect: non-scaling-stroke; }
.node.hovered .shell-poly { stroke-width: 2; }
.node.selected .face-top { fill: var(--invert-bg); }
.node.selected .shell-poly { stroke: var(--accent); stroke-width: 2; }
.node.selected .short-label { fill: var(--invert-fg); }
.node.dim { opacity: 0.26; }
.node.searchdim { opacity: 0.16; }
.node.flagged .shell-poly { stroke: var(--sev-high); }

.short-label {
  fill: var(--ink); font-family: inherit; font-size: 7.5px;
  letter-spacing: 0.04em; text-anchor: middle; dominant-baseline: middle;
  pointer-events: none; user-select: none;
}
.band-label {
  fill: var(--ink-3); font-family: inherit; font-size: 9px;
  letter-spacing: 0.18em; text-anchor: end; dominant-baseline: middle;
  pointer-events: none; user-select: none; text-transform: uppercase;
}
.band-rule { stroke: var(--rule-soft); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.name-label {
  fill: var(--ink); font-family: inherit; font-size: 9.5px; letter-spacing: 0.09em;
  text-anchor: middle; pointer-events: none; user-select: none;
  paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round;
}

.pkt { cursor: pointer; }
.pkt-body { fill: var(--accent); stroke: var(--paper); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pkt.viol .pkt-body { fill: var(--sev-high); }
.pkt.sel .pkt-body { fill: var(--invert-bg); stroke: var(--accent); stroke-width: 2; }
.pkt-halo { fill: none; stroke: var(--accent); stroke-width: 1; opacity: 0.35; vector-effect: non-scaling-stroke; }

/* ---------- inspector ---------- */

#inspector {
  border-left: 1px solid var(--rule); background: var(--paper);
  display: flex; flex-direction: column; min-height: 0;
}
#tabs { display: flex; border-bottom: 1px solid var(--rule); flex-shrink: 0; }
.tab {
  flex: 1; font: inherit; font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase;
  padding: 11px 3px; background: transparent; color: var(--ink-3);
  border: 0; border-right: 1px solid var(--rule-soft); cursor: pointer;
}
.tab:last-child { border-right: 0; }
.tab:hover { color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab[aria-selected="true"] { background: var(--invert-bg); color: var(--invert-fg); }
.tab .badge {
  display: inline-block; margin-left: 4px; padding: 0 4px;
  background: var(--sev-high); color: var(--on-accent); font-size: 8.5px;
}
.tab[aria-selected="true"] .badge { background: var(--invert-fg); color: var(--invert-bg); }

#panel { overflow-y: auto; padding: 16px 20px 40px; flex: 1; min-height: 0; }
#panel::-webkit-scrollbar { width: 8px; }
#panel::-webkit-scrollbar-thumb { background: var(--rule-soft); }

.eyebrow { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
#panel h2 { font-size: 21px; font-weight: 500; letter-spacing: 0.01em; margin: 3px 0 2px; text-wrap: balance; }
.dek { color: var(--ink-3); font-size: 11.5px; margin-bottom: 16px; }

.sec {
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin: 20px 0 10px;
}
#panel p { margin: 0 0 11px; max-width: 62ch; }
mark { background: var(--invert-bg); color: var(--invert-fg); padding: 0 3px; }
code { font-family: inherit; background: var(--paper-sunk); padding: 0 3px; font-size: 11.5px; }

.kv { display: grid; grid-template-columns: 122px minmax(0, 1fr); gap: 3px 10px; margin: 0 0 12px; }
.kv dt { color: var(--ink-3); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }

pre {
  background: var(--paper-sunk); border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--accent); padding: 10px 12px; margin: 0 0 12px;
  overflow-x: auto; font-size: 11px; line-height: 1.55; white-space: pre; tab-size: 2;
}
pre::-webkit-scrollbar { height: 7px; }
pre::-webkit-scrollbar-thumb { background: var(--rule); }

ul.bul { margin: 0 0 12px; padding-left: 16px; }
ul.bul li { margin-bottom: 6px; max-width: 60ch; }

.flag {
  display: flex; gap: 8px; border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--ink-3); padding: 9px 11px; margin-bottom: 9px;
}
.flag.ok { border-left-color: var(--sev-low); }
.flag.warn { border-left-color: var(--sev-med); }
.flag .lab {
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); flex-shrink: 0; width: 52px; padding-top: 2px;
}
.flag .txt { font-size: 11.5px; }

/* findings list */
.find {
  width: 100%; text-align: left; font: inherit;
  border: 1px solid var(--rule-soft); border-left: 3px solid var(--sev-note);
  background: transparent; color: var(--ink);
  padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: block;
}
.find:hover { background: var(--paper-3); }
.find:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.find.high { border-left-color: var(--sev-high); }
.find.medium { border-left-color: var(--sev-med); }
.find.low { border-left-color: var(--sev-low); }
.find.note { border-left-color: var(--sev-note); }
.find.good { border-left-color: var(--sev-low); border-left-style: double; border-left-width: 4px; }
.find-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.find-sev {
  font-size: 8.5px; letter-spacing: 0.13em; text-transform: uppercase;
  padding: 1px 5px; flex-shrink: 0; color: var(--on-accent); background: var(--sev-note);
}
.find.high .find-sev { background: var(--sev-high); }
.find.medium .find-sev { background: var(--sev-med); }
.find.low .find-sev, .find.good .find-sev { background: var(--sev-low); }
.find-title { font-size: 12px; line-height: 1.35; }
.find-body { font-size: 11px; color: var(--ink-2); margin-top: 5px; max-width: 60ch; }
.find-ev {
  font-size: 10.5px; color: var(--ink-3); margin-top: 6px;
  border-top: 1px solid var(--rule-faint); padding-top: 5px; word-break: break-word;
}
.find-where { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-left: auto; flex-shrink: 0; }

.chiprow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 13px; }
.chip {
  font: inherit; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
  border: 1px solid var(--rule); background: transparent; color: var(--ink);
  padding: 3px 8px; cursor: pointer;
}
.chip:hover { background: var(--paper-3); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip[aria-pressed="true"] { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }

.bar-row { display: grid; grid-template-columns: 108px 1fr 46px; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 10.5px; }
.bar-row .bn { color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; background: var(--paper-sunk); position: relative; }
.bar-fill { height: 100%; background: var(--ink-2); }
.bar-fill.hot { background: var(--accent); }
.bar-row .bv { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); }

#hints {
  grid-column: 1 / -1; border-top: 1px solid var(--rule);
  padding: 6px 14px; font-size: 9.5px; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 16px; background: var(--paper);
}

@media (max-width: 1240px) { #shell { grid-template-columns: 196px minmax(0, 1fr) 340px; } }
@media (max-width: 980px) {
  body { overflow: auto; }
  #shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto auto; height: auto; }
  #rail { max-height: 210px; border-right: 0; border-bottom: 1px solid var(--rule); order: 3; }
  #stage { order: 2; min-height: 64vh; }
  #inspector { order: 4; border-left: 0; border-top: 1px solid var(--rule); }
  #panel { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { .pkt-halo { display: none; } }
</style>

<div id="shell">

  <header id="topbar">
    <div class="repo-cell" id="repo-cell"></div>
    <div id="topbar-actions">
      <button class="btn" id="btn-theme">Theme: auto</button>
      <button class="btn accent" id="btn-play" aria-pressed="true">&#9654;&nbsp; Pause</button>
      <button class="btn" id="btn-step">Trace one step</button>
      <button class="btn" id="btn-reset">Reset view</button>
    </div>
  </header>

  <nav id="rail" aria-label="Repository index">
    <div id="railsearch">
      <input id="q" type="search" placeholder="Filter parts…" autocomplete="off" spellcheck="false" aria-label="Filter parts" />
    </div>
    <div id="railbody"></div>
  </nav>

  <main id="stage">
    <div id="topleft">
      <div class="ctlrow" id="layoutbar" role="group" aria-label="Layout"></div>
      <div class="ctlrow" id="flowbar" role="group" aria-label="Flow layers"></div>
    </div>
    <div id="zoomers">
      <button class="btn" id="btn-in" aria-label="Zoom in">+</button>
      <button class="btn" id="btn-out" aria-label="Zoom out">&minus;</button>
    </div>
    <div id="dials">
      <label for="angle">Angle</label>
      <input id="angle" type="range" min="14" max="90" value="35" />
      <span class="readout" id="angle-out">35°</span>
      <span class="sep"></span>
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="10" max="220" value="80" />
      <span class="sep"></span>
      <span class="dlab">Height</span>
      <button class="btn" id="hmode" style="font-size:9.5px;padding:3px 8px;">Lines of code</button>
    </div>
    <svg id="svg" role="img" aria-label="Axonometric drawing of the SemPKM repository"></svg>
  </main>

  <aside id="inspector">
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-what" aria-selected="true">What it does</button>
      <button class="tab" role="tab" id="tab-built" aria-selected="false">How it's built</button>
      <button class="tab" role="tab" id="tab-cond" aria-selected="false">Condition</button>
      <button class="tab" role="tab" id="tab-find" aria-selected="false">Findings<span class="badge" id="find-badge">2</span></button>
    </div>
    <div id="panel" role="tabpanel"></div>
  </aside>

  <footer id="hints">
    <span>Click a part to open it</span>
    <span>Click a moving dot to read the data</span>
    <span>Drag to pan</span>
    <span>Scroll to zoom</span>
    <span>Angle 90° = plan view</span>
    <span>&uarr;&darr; step parts</span>
    <span>Esc clears</span>
  </footer>

</div>

<script>
"use strict";

/* ============================================================
   1. THE MODEL — measured from the working tree, 14 August 2026

   layer  = my mapping onto Löwy's volatility-based decomposition
   tier   = depth in the request lifecycle, for the stacked view
   ============================================================ */

var MODEL = /*__MODEL__*/null;

/* Every array below is data now. The renderer past this point is unchanged
   from the hand-authored page — it just reads a model instead of literals. */
var NODES = MODEL.nodes;

var FLOWS = {};
MODEL.flows.forEach(function (f) { FLOWS[f.id] = { label: f.label, on: !!f.enabled }; });

var EDGES = MODEL.edges;

/* ============================================================
   2. FINDINGS — every claim below was grepped, not inferred
   ============================================================ */

var SEV_ORDER = { high: 0, medium: 1, low: 2, note: 3, good: 4 };

var FINDINGS = MODEL.findings;

/* ============================================================
   3. PROJECTION — axonometric with adjustable pitch
      pitch 90° = plan view (height collapses)
   ============================================================ */

var UNIT = 27, ZH = 20;
var RAD = Math.PI / 180;
var ISO_PITCH = 35.264;                 /* true isometric */
var pitchDeg = 35;
var ISO_COS = Math.cos(ISO_PITCH * RAD);

function proj(x, y, z) {
  var p = pitchDeg * RAD;
  return [ (x - y) * 0.866 * UNIT,
           (x + y) * 0.866 * Math.sin(p) * UNIT - z * ZH * (Math.cos(p) / ISO_COS) ];
}
function pt(p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }

var byId = {};
NODES.forEach(function (n) { byId[n.id] = n; });

var heightMode = "loc";
var layout = "survey";

function nodeHeight(n) {
  var cap = layout === "survey" ? 5.0 : 2.2;
  var base = layout === "survey" ? 22 : 44;
  if (heightMode === "loc") return Math.min(cap, 0.35 + Math.sqrt(n.loc) / base);
  return Math.min(cap, 0.35 + Math.sqrt(n.files) * (layout === "survey" ? 0.52 : 0.24));
}

function boxFaces(n) {
  var h = nodeHeight(n);
  var x0 = n._x, y0 = n._y, x1 = n._x + n._w, y1 = n._y + n._d;
  var zb = n._z, zt = n._z + h;
  return {
    top:   [proj(x0,y0,zt), proj(x1,y0,zt), proj(x1,y1,zt), proj(x0,y1,zt)],
    right: [proj(x1,y0,zb), proj(x1,y1,zb), proj(x1,y1,zt), proj(x1,y0,zt)],
    left:  [proj(x0,y1,zb), proj(x1,y1,zb), proj(x1,y1,zt), proj(x0,y1,zt)],
    apex:  proj(x0 + n._w/2, y0 + n._d/2, zt),
    ctr:   [x0 + n._w/2, y0 + n._d/2, zb]
  };
}

/* ============================================================
   4. LAYOUTS
   ============================================================ */

var BANDS = [];   /* band/tier labels for the current layout */

var TIER_GAP = 6.0, ROW_SP = 2.6;

/* A row laid along the grid's x axis slides downhill on screen and the tiers
   collide. The (1,-1) diagonal projects to a perfectly horizontal line at
   every pitch, so stacked layouts lay their rows along that instead, and z
   alone separates one tier from the next.
   `offset` slides a row along (1,1) — straight down-screen — to park the
   utilities band beside the stack rather than inside it. */
function layRow(members, z, offset, label) {
  if (!members.length) return;
  var half = (members.length - 1) / 2;
  members.forEach(function (n, i) {
    var t = (i - half) * ROW_SP;
    n._w = 2.1; n._d = 2.1; n._z = z;
    n._x = t + offset;
    n._y = -t + offset;
  });
  var tl = -half * ROW_SP - 2.4;
  BANDS.push({
    label: label, z: z,
    x: tl + offset, y: -tl + offset,
    rx: -tl + offset, ry: tl + offset      /* far end, for the rule */
  });
}

var LAYOUTS = {
  survey: {
    label: "Survey",
    blurb: "The system as a plot of ground: one ring, read one way and written the other.",
    build: function () {
      BANDS = [];
      NODES.forEach(function (n) {
        n._x = n.x; n._y = n.y; n._z = 0; n._w = n.w; n._d = n.d;
      });
    }
  },

  stack: {
    label: "Layers",
    blurb: "The same parts stacked by how deep a request has travelled — surfaces on top, resources at the bottom.",
    build: function () {
      var TIERS = MODEL.tiers;
      BANDS = [];
      TIERS.forEach(function (label, t) {
        var members = NODES.filter(function (n) { return n.tier === t; });
        if (!members.length) return;
        layRow(members, (TIERS.length - 1 - t) * TIER_GAP, 0, label);
      });
    }
  },

  lowy: {
    label: "Volatility",
    blurb: "Read through Juval Löwy's volatility-based decomposition: clients on top, resources at the bottom, and nothing allowed to reach past its neighbour.",
    build: function () {
      var STACKED = MODEL.layers.filter(function (l) { return !l.side; });
      var ORDER = STACKED.map(function (l) { return l.id; });
      var LABELS = {};
      MODEL.layers.forEach(function (l) { LABELS[l.id] = l.label; });
      var SIDE = MODEL.layers.filter(function (l) { return l.side; })[0];
      BANDS = [];
      ORDER.forEach(function (layer, li) {
        var members = NODES.filter(function (n) { return n.layer === layer; });
        layRow(members, (ORDER.length - 1 - li) * TIER_GAP, 0, LABELS[layer]);
      });
      /* Löwy draws utilities as a bar crossing every layer. Stacked by
         elevation there is no sideways to put it, so it gets its own band
         below the stack, reachable from all of them. */
      if (SIDE) {
        var utils = NODES.filter(function (n) { return n.layer === SIDE.id; });
        layRow(utils, -TIER_GAP, 0, SIDE.label);
      }
    }
  }
};

/* ============================================================
   5. SCENE
   ============================================================ */

var SVG_NS = "http://www.w3.org/2000/svg";
var svg = document.getElementById("svg");
var stage = document.getElementById("stage");

var scene, gGrid, gWires, gNodes, gPackets, gBands, hoverLabel;
var view = { k: 1, tx: 0, ty: 0 };
var selectedNode = null, hoveredNode = null, selectedPacket = null;
var activeTab = "what";
var sevFilter = null;

function el(name, attrs) {
  var e = document.createElementNS(SVG_NS, name);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ---- grid ---- */
var gridRefs = [], plotRef = null;
var GRID_MIN = -14, GRID_MAX = 26, GRID_STEP = 2;

function buildGround() {
  var g = el("g");
  gridRefs = [];
  for (var i = GRID_MIN; i <= GRID_MAX; i += GRID_STEP) {
    var l1 = el("line"); l1.setAttribute("class", "grid-line");
    gridRefs.push({ el: l1, a: [i, GRID_MIN], b: [i, GRID_MAX] }); g.appendChild(l1);
    var l2 = el("line"); l2.setAttribute("class", "grid-line");
    gridRefs.push({ el: l2, a: [GRID_MIN, i], b: [GRID_MAX, i] }); g.appendChild(l2);
  }
  plotRef = el("polygon"); plotRef.setAttribute("class", "plot-line");
  g.appendChild(plotRef);
  return g;
}

function applyGround() {
  gridRefs.forEach(function (r) {
    var a = proj(r.a[0], r.a[1], 0), b = proj(r.b[0], r.b[1], 0);
    r.el.setAttribute("x1", a[0].toFixed(1)); r.el.setAttribute("y1", a[1].toFixed(1));
    r.el.setAttribute("x2", b[0].toFixed(1)); r.el.setAttribute("y2", b[1].toFixed(1));
  });
  var c = [proj(GRID_MIN,GRID_MIN,0), proj(GRID_MAX,GRID_MIN,0),
           proj(GRID_MAX,GRID_MAX,0), proj(GRID_MIN,GRID_MAX,0)];
  plotRef.setAttribute("points", c.map(pt).join(" "));
}

/* ---- band labels (stack / volatility views) ---- */
function buildBands() { return el("g"); }

function applyBands() {
  gBands.textContent = "";
  BANDS.forEach(function (b) {
    var p = proj(b.x, b.y, b.z);
    var t = el("text", { x: p[0].toFixed(1), y: p[1].toFixed(1) });
    t.setAttribute("class", "band-label");
    t.textContent = b.label;
    gBands.appendChild(t);
    var a = proj(b.x + 0.5, b.y - 0.5, b.z), c2 = proj(b.rx, b.ry, b.z);
    var l = el("line", { x1: a[0].toFixed(1), y1: a[1].toFixed(1),
                         x2: c2[0].toFixed(1), y2: c2[1].toFixed(1) });
    l.setAttribute("class", "band-rule");
    gBands.appendChild(l);
  });
}

/* ---- wires ---- */
var wireRefs = {};

function edgeGridPath(e) {
  var A = byId[e.from], B = byId[e.to];
  var a = [A._x + A._w/2, A._y + A._d/2, A._z];
  var b = [B._x + B._w/2, B._y + B._d/2, B._z];
  var pts = [a];
  if (layout === "survey" && e.wp) {
    e.wp.forEach(function (w) { pts.push([w[0], w[1], 0]); });
  } else if (layout === "survey") {
    if (Math.abs(a[0] - b[0]) > 0.4 && Math.abs(a[1] - b[1]) > 0.4) pts.push([b[0], a[1], 0]);
  } else {
    /* stacked views: leave the box, cross the gap, arrive — reads as a net */
    var mz = (a[2] + b[2]) / 2;
    pts.push([a[0], a[1], mz]);
    pts.push([b[0], b[1], mz]);
  }
  pts.push(b);
  return pts;
}

function buildWires() {
  var g = el("g");
  wireRefs = {};
  EDGES.forEach(function (e, i) {
    var pl = el("polyline");
    e._spine = byId[e.from].grp === "loop" && byId[e.to].grp === "loop" && e.flow !== "viol";
    pl.setAttribute("class", e.flow === "viol" ? "wire viol" : (e._spine ? "wire spine" : "wire"));
    g.appendChild(pl);
    var marks = [];
    for (var j = 0; j < 4; j++) {
      var m = el("polygon"); m.setAttribute("class", "wire-node");
      g.appendChild(m); marks.push(m);
    }
    wireRefs[i] = { line: pl, marks: marks };
  });
  return g;
}

function polylineMeta(pts) {
  var segs = [], total = 0;
  for (var i = 0; i < pts.length - 1; i++) {
    var dx = pts[i+1][0] - pts[i][0], dy = pts[i+1][1] - pts[i][1];
    var L = Math.sqrt(dx*dx + dy*dy);
    segs.push(L); total += L;
  }
  return { segs: segs, total: total || 1 };
}

function pointAt(pts, meta, dist) {
  var d = dist;
  for (var i = 0; i < meta.segs.length; i++) {
    if (d <= meta.segs[i] || i === meta.segs.length - 1) {
      var t = meta.segs[i] === 0 ? 0 : Math.max(0, Math.min(1, d / meta.segs[i]));
      return [ pts[i][0] + (pts[i+1][0] - pts[i][0]) * t,
               pts[i][1] + (pts[i+1][1] - pts[i][1]) * t ];
    }
    d -= meta.segs[i];
  }
  return pts[pts.length - 1];
}

function applyWires() {
  EDGES.forEach(function (e, i) {
    var grid = edgeGridPath(e);
    var pts = grid.map(function (g3) { return proj(g3[0], g3[1], g3[2]); });
    e._pts = pts;
    e._meta = polylineMeta(pts);
    var w = wireRefs[i];
    w.line.setAttribute("points", pts.map(pt).join(" "));
    /* markers: bends first, then the midpoint, unused ones parked */
    var spots = [];
    for (var j = 1; j < pts.length - 1; j++) spots.push(pts[j]);
    spots.push(pointAt(pts, e._meta, e._meta.total / 2));
    w.marks.forEach(function (m, mi) {
      if (mi >= spots.length) { m.setAttribute("points", ""); return; }
      var s = spots[mi], r = 3.2;
      m.setAttribute("points", [[s[0],s[1]-r],[s[0]+r,s[1]],[s[0],s[1]+r],[s[0]-r,s[1]]].map(pt).join(" "));
    });
  });
}

/* ---- boxes ---- */
var nodeRefs = {};

function buildNodes() {
  var g = el("g");
  nodeRefs = {};
  NODES.forEach(function (n) {
    var grp = el("g", { tabindex: "0", role: "button" });
    grp.setAttribute("class", "node");
    grp.setAttribute("aria-label", n.name);

    var left  = el("polygon"); left.setAttribute("class", "face-left shell-poly");
    var leftH = el("polygon", { fill: "url(#hatch)", stroke: "none" });
    var right = el("polygon"); right.setAttribute("class", "face-right shell-poly");
    var rightH= el("polygon", { fill: "url(#hatch2)", stroke: "none" });
    var top   = el("polygon"); top.setAttribute("class", "face-top shell-poly");
    var lbl   = el("text"); lbl.setAttribute("class", "short-label"); lbl.textContent = n.short;

    [left, leftH, right, rightH, top, lbl].forEach(function (c) { grp.appendChild(c); });

    grp.addEventListener("mouseenter", function () { hoveredNode = n.id; paintState(); });
    grp.addEventListener("mouseleave", function () { hoveredNode = null; paintState(); });
    grp.addEventListener("click", function (ev) {
      if (didDrag) return;
      ev.stopPropagation(); selectNode(n.id);
    });
    grp.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(n.id); }
    });

    g.appendChild(grp);
    nodeRefs[n.id] = { g: grp, polys: [left, leftH, right, rightH, top], label: lbl };
  });
  return g;
}

function applyNodes() {
  NODES.forEach(function (n) {
    var f = boxFaces(n);
    var r = nodeRefs[n.id];
    var L = f.left.map(pt).join(" "), R = f.right.map(pt).join(" "), T = f.top.map(pt).join(" ");
    r.polys[0].setAttribute("points", L);
    r.polys[1].setAttribute("points", L);
    r.polys[2].setAttribute("points", R);
    r.polys[3].setAttribute("points", R);
    r.polys[4].setAttribute("points", T);
    r.label.setAttribute("x", f.apex[0].toFixed(2));
    r.label.setAttribute("y", f.apex[1].toFixed(2));
    /* keep the name inside the top face as the plan flattens */
    var wpx = Math.abs(f.top[1][0] - f.top[3][0]);
    var size = Math.max(5.4, Math.min(8.4, wpx / (n.short.length * 0.78)));
    r.label.setAttribute("font-size", size.toFixed(1));
    n._faces = f;
  });
  sortNodesByDepth();
}

function sortNodesByDepth() {
  var order = NODES.slice().sort(function (a, b) {
    return (a._x + a._w/2 + a._y + a._d/2 + a._z) - (b._x + b._w/2 + b._y + b._d/2 + b._z);
  });
  order.forEach(function (n) { gNodes.appendChild(nodeRefs[n.id].g); });
}

/* ---- packets ---- */
var packets = [];

function buildPackets() {
  var g = el("g");
  packets = [];
  EDGES.forEach(function (e, i) {
    var grp = el("g");
    grp.setAttribute("class", e.flow === "viol" ? "pkt viol" : "pkt");
    var halo = el("circle", { r: 7, cx: 0, cy: 0 }); halo.setAttribute("class", "pkt-halo");
    var body = el("circle", { r: 3.6, cx: 0, cy: 0 }); body.setAttribute("class", "pkt-body");
    grp.appendChild(halo); grp.appendChild(body);
    var p = { edge: e, idx: i, g: grp, ratio: (i * 0.37) % 1, jitter: 0.85 + ((i * 13) % 7) / 20 };
    grp.addEventListener("click", function (ev) {
      if (didDrag) return;
      ev.stopPropagation();
      openPacket(p);
    });
    packets.push(p);
    g.appendChild(grp);
  });
  return g;
}

function buildScene() {
  svg.textContent = "";
  var defs = el("defs");
  [["hatch", 5], ["hatch2", 3.2]].forEach(function (h) {
    var pat = el("pattern", { id: h[0], width: h[1], height: h[1],
      patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
    var ln = el("line", { x1: 0, y1: 0, x2: 0, y2: h[1] });
    ln.setAttribute("class", "hatch-line");
    pat.appendChild(ln); defs.appendChild(pat);
  });
  svg.appendChild(defs);

  scene = el("g", { id: "scene" });
  gGrid = buildGround();
  gBands = buildBands();
  gWires = buildWires();
  gNodes = buildNodes();
  gPackets = buildPackets();
  /* bands sit above the boxes so their labels stay readable */
  [gGrid, gWires, gNodes, gPackets, gBands].forEach(function (g) { scene.appendChild(g); });

  hoverLabel = el("text"); hoverLabel.setAttribute("class", "name-label");
  hoverLabel.style.display = "none";
  scene.appendChild(hoverLabel);
  svg.appendChild(scene);
}

/* One call re-projects everything; nothing is recreated, so the angle
   slider and the layout switch are both cheap. */
function applyGeometry() {
  applyGround();
  applyBands();
  applyWires();
  applyNodes();
}

/* Tiers separate by elevation alone, so a true plan view would stack them on
   top of one another. Cap the angle while a stacked layout is showing. */
function syncAngleRange() {
  var input = document.getElementById("angle");
  var max = layout === "survey" ? 90 : 72;
  input.max = max;
  if (pitchDeg > max) {
    pitchDeg = max;
    input.value = max;
    var out = document.getElementById("angle-out");
    if (out) out.textContent = max + "°";
  }
}

function relayout(id, keepView) {
  layout = id;
  LAYOUTS[layout].build();
  syncAngleRange();
  applyGeometry();
  paintLayoutBar();
  if (!keepView) resetView();
  paintState();
}

/* ============================================================
   6. VIEW
   ============================================================ */

function applyView() {
  scene.setAttribute("transform",
    "translate(" + view.tx.toFixed(2) + "," + view.ty.toFixed(2) + ") scale(" + view.k.toFixed(4) + ")");
}

function resetView() {
  var r = stage.getBoundingClientRect();
  var xs = [], ys = [];
  NODES.forEach(function (n) {
    var f = n._faces || boxFaces(n);
    [f.top, f.left, f.right].forEach(function (face) {
      face.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); });
    });
  });
  /* band labels hang off the left end of each row — keep them in frame */
  BANDS.forEach(function (b) {
    var p = proj(b.x, b.y, b.z);
    xs.push(p[0] - b.label.length * 6.2); ys.push(p[1]);
  });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var pad = 70;
  var k = Math.min((r.width - pad*2) / Math.max(1, maxX - minX),
                   (r.height - pad*2) / Math.max(1, maxY - minY));
  view.k = Math.max(0.22, Math.min(1.6, k));
  view.tx = r.width/2 - ((minX + maxX)/2) * view.k;
  view.ty = r.height/2 - ((minY + maxY)/2) * view.k;
  applyView();
}

function zoomAt(factor, cx, cy) {
  var r = stage.getBoundingClientRect();
  if (cx === undefined) { cx = r.width/2; cy = r.height/2; }
  var nk = Math.max(0.15, Math.min(4, view.k * factor));
  var ratio = nk / view.k;
  view.tx = cx - (cx - view.tx) * ratio;
  view.ty = cy - (cy - view.ty) * ratio;
  view.k = nk;
  applyView();
}

function isControl(t) {
  return !!(t.closest && t.closest("#topleft, #zoomers, #dials, button, input, label"));
}

var DRAG_THRESHOLD = 4;
var dragging = false, pressed = false, didDrag = false, dragStart = null;

stage.addEventListener("pointerdown", function (ev) {
  if (isControl(ev.target)) return;
  pressed = true; didDrag = false;
  dragStart = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
});
stage.addEventListener("pointermove", function (ev) {
  if (!pressed) return;
  var dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;
  if (!dragging && Math.sqrt(dx*dx + dy*dy) < DRAG_THRESHOLD) return;
  if (!dragging) {
    dragging = true; didDrag = true;
    stage.classList.add("dragging");
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  }
  view.tx = dragStart.tx + dx; view.ty = dragStart.ty + dy;
  applyView();
});
stage.addEventListener("pointerup", function (ev) {
  pressed = false; dragging = false; stage.classList.remove("dragging");
  try { stage.releasePointerCapture(ev.pointerId); } catch (e) {}
});
stage.addEventListener("pointercancel", function () {
  pressed = false; dragging = false; stage.classList.remove("dragging");
});
stage.addEventListener("wheel", function (ev) {
  ev.preventDefault();
  var r = stage.getBoundingClientRect();
  zoomAt(ev.deltaY < 0 ? 1.12 : 1/1.12, ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });
stage.addEventListener("click", function (ev) {
  if (isControl(ev.target) || didDrag) return;
  if (ev.target.closest(".pkt") || ev.target.closest(".node")) return;
  selectedNode = null; selectedPacket = null;
  renderPanel(); paintState(); paintRail();
});

/* ============================================================
   7. ANIMATION
   ============================================================ */

var running = true, speed = 80, lastT = 0, stepBudget = 0;

function tick(ts) {
  if (!lastT) lastT = ts;
  var dt = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;

  var advance = 0;
  if (running) advance = dt * speed;
  else if (stepBudget > 0) {
    advance = Math.min(stepBudget, dt * speed * 2.2);
    stepBudget -= advance;
  }

  packets.forEach(function (p) {
    if (!FLOWS[p.edge.flow].on) { p.g.style.display = "none"; return; }
    p.g.style.display = "";
    if (advance > 0) {
      p.ratio += advance * p.jitter / p.edge._meta.total;
      if (p.ratio > 1) p.ratio -= 1;
    }
    var xy = pointAt(p.edge._pts, p.edge._meta, p.ratio * p.edge._meta.total);
    p.g.setAttribute("transform", "translate(" + xy[0].toFixed(2) + "," + xy[1].toFixed(2) + ")");
  });

  requestAnimationFrame(tick);
}

/* ============================================================
   8. STATE PAINTING
   ============================================================ */

var FLAGGED = {};
FINDINGS.forEach(function (f) {
  if (!f.node) return;
  if (f.sev === "high" || f.sev === "medium") {
    if (!FLAGGED[f.node] || f.sev === "high") FLAGGED[f.node] = f.sev;
  }
});

function relatedEdgeIdx(nodeId) {
  var out = [];
  EDGES.forEach(function (e, i) { if (e.from === nodeId || e.to === nodeId) out.push(i); });
  return out;
}

function paintState() {
  var focus = selectedNode || hoveredNode;
  var lit = focus ? relatedEdgeIdx(focus) : [];
  var litSet = {};
  lit.forEach(function (i) { litSet[i] = true; });

  if (selectedPacket && !focus) {
    litSet[selectedPacket.idx] = true;
    lit.push(selectedPacket.idx);
    focus = selectedPacket.edge.from;
  }

  var neighbours = {};
  if (focus) {
    neighbours[focus] = true;
    lit.forEach(function (i) {
      neighbours[EDGES[i].from] = true; neighbours[EDGES[i].to] = true;
    });
  }

  NODES.forEach(function (n) {
    var g = nodeRefs[n.id].g;
    g.classList.toggle("selected", selectedNode === n.id);
    g.classList.toggle("hovered", hoveredNode === n.id);
    g.classList.toggle("dim", !!focus && !neighbours[n.id]);
    g.classList.toggle("flagged", FLAGGED[n.id] === "high");
  });

  EDGES.forEach(function (e, i) {
    var w = wireRefs[i];
    var visible = FLOWS[e.flow].on;
    var isLit = litSet[i];
    var muted = !visible || (!!focus && !isLit);
    w.line.classList.toggle("muted", muted);
    w.line.classList.toggle("lit", !!isLit && visible);
    w.marks.forEach(function (m) { m.classList.toggle("muted", muted); });
  });

  packets.forEach(function (p) {
    p.g.classList.toggle("sel", selectedPacket === p);
    p.g.style.opacity = (!!focus && !litSet[p.idx]) ? "0.12" : "1";
  });

  paintHoverLabel();
}

function paintHoverLabel() {
  var id = hoveredNode || selectedNode;
  if (!id || !nodeRefs[id]) { hoverLabel.style.display = "none"; return; }
  var n = byId[id];
  var f = n._faces || boxFaces(n);
  hoverLabel.setAttribute("x", f.apex[0].toFixed(2));
  hoverLabel.setAttribute("y", (f.apex[1] - 22).toFixed(2));
  hoverLabel.textContent = n.name.toUpperCase();
  hoverLabel.style.display = "";
}

function paintTopbar() {
  var cell = document.getElementById("repo-cell");
  cell.innerHTML = "";
  var b = document.createElement("b"); b.textContent = MODEL.repo.name;
  var s = document.createElement("span"); s.textContent = " " + (MODEL.repo.tagline || "");
  cell.appendChild(b); cell.appendChild(s);

  var bar = document.getElementById("topbar");
  var anchor = document.getElementById("topbar-actions");
  (MODEL.repo.stats || []).forEach(function (st) {
    var d = document.createElement("div");
    d.className = "stat";
    var k = document.createElement("span"); k.className = "stat-k"; k.textContent = st.k;
    var v = document.createElement("span");
    v.className = "stat-v" + (st.flag === "bad" ? " bad" : "");
    v.textContent = st.v;
    d.appendChild(k); d.appendChild(v);
    bar.insertBefore(d, anchor);
  });
}

/* ============================================================
   9. LEFT RAIL
   ============================================================ */

var GROUPS = MODEL.groups;

var railBody = document.getElementById("railbody");
var railItems = {};

function buildRail() {
  railBody.textContent = "";
  GROUPS.forEach(function (grp) {
    var h = document.createElement("div");
    h.className = "grp"; h.textContent = grp.label;
    railBody.appendChild(h);
    NODES.filter(function (n) { return n.grp === grp.id; }).forEach(function (n) {
      var b = document.createElement("button");
      b.className = "item" + (FLAGGED[n.id] ? (FLAGGED[n.id] === "high" ? " hasfind-high" : " hasfind") : "");
      b.setAttribute("aria-selected", "false");
      b.innerHTML = '<span class="k"></span><span class="n"></span><span class="c"></span>';
      b.querySelector(".k").textContent = n.key;
      b.querySelector(".n").textContent = n.name;
      b.querySelector(".c").textContent = n.files;
      b.addEventListener("click", function () { selectNode(n.id); });
      b.addEventListener("mouseenter", function () { hoveredNode = n.id; paintState(); });
      b.addEventListener("mouseleave", function () { hoveredNode = null; paintState(); });
      railBody.appendChild(b);
      railItems[n.id] = b;
    });
  });
}

function paintRail() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  NODES.forEach(function (n) {
    var b = railItems[n.id];
    b.setAttribute("aria-selected", selectedNode === n.id ? "true" : "false");
    var hit = !q || (n.name + " " + n.sub + " " + n.key + " " + n.short).toLowerCase().indexOf(q) >= 0;
    b.classList.toggle("dim", !hit);
    if (nodeRefs[n.id]) nodeRefs[n.id].g.classList.toggle("searchdim", !hit && !!q);
  });
}

document.getElementById("q").addEventListener("input", paintRail);

/* ============================================================
   10. INSPECTOR
   ============================================================ */

var panel = document.getElementById("panel");
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var SYSTEM = MODEL.system;

function nodeMetrics(n) {
  return '<dl class="kv">' +
    '<dt>Key</dt><dd>' + esc(n.key) + '</dd>' +
    '<dt>Lines</dt><dd>' + n.loc.toLocaleString() + '</dd>' +
    '<dt>Files</dt><dd>' + n.files + '</dd>' +
    '<dt>Avg / file</dt><dd>' + Math.round(n.loc / n.files).toLocaleString() + '</dd>' +
    '<dt>Löwy layer</dt><dd>' + esc(n.layer) + '</dd>' +
    '<dt>Height shows</dt><dd>' + (heightMode === "loc" ? "lines of code" : "file count") + '</dd>' +
    '</dl>';
}

function connectionsBlock(n) {
  var ins = EDGES.filter(function (e) { return e.to === n.id; });
  var outs = EDGES.filter(function (e) { return e.from === n.id; });
  var html = '<div class="sec">Connections</div><div class="chiprow">';
  outs.forEach(function (e) { html += '<button class="chip" data-goto="' + e.to + '">&rarr; ' + esc(byId[e.to].name) + '</button>'; });
  ins.forEach(function (e) { html += '<button class="chip" data-goto="' + e.from + '">&larr; ' + esc(byId[e.from].name) + '</button>'; });
  html += '</div>';
  if (outs.length || ins.length) {
    html += '<p style="color:var(--ink-3);font-size:11px;">Open a connection to read the data that travels along it.</p><div class="chiprow">';
    outs.concat(ins).forEach(function (e) {
      html += '<button class="chip" data-pkt="' + EDGES.indexOf(e) + '">&#9679; ' + esc(e.pk) + '</button>';
    });
    html += '</div>';
  }
  return html;
}

function scaleBars(n) {
  var top = NODES.slice().sort(function (a,b) { return b.loc - a.loc; }).slice(0, 8);
  if (top.indexOf(n) < 0) top[7] = n;
  var max = top[0].loc;
  var html = '<div class="sec">Size in context</div>';
  top.forEach(function (t) {
    html += '<div class="bar-row"><span class="bn">' + esc(t.name) + '</span>' +
            '<span class="bar-track"><span class="bar-fill' + (t.id === n.id ? ' hot' : '') +
            '" style="width:' + (t.loc / max * 100).toFixed(1) + '%"></span></span>' +
            '<span class="bv">' + Math.round(t.loc/1000) + 'k</span></div>';
  });
  return html;
}

function findingsHTML(forNode) {
  var list = FINDINGS.filter(function (f) { return !forNode || f.node === forNode; });
  list = list.slice().sort(function (a, b) { return SEV_ORDER[a.sev] - SEV_ORDER[b.sev]; });
  var counts = {};
  FINDINGS.forEach(function (f) { counts[f.sev] = (counts[f.sev] || 0) + 1; });

  var html = "";
  if (!forNode) {
    html += '<div class="eyebrow">Ranked by severity</div><h2>Findings</h2>';
    html += '<div class="dek">' + FINDINGS.length + ' items, every one grepped from the working tree</div>';
    html += '<div class="chiprow">';
    ["high","medium","low","note","good"].forEach(function (s) {
      if (!counts[s]) return;
      html += '<button class="chip" data-sev="' + s + '" aria-pressed="' + (sevFilter === s) + '">' +
              s + ' · ' + counts[s] + '</button>';
    });
    html += '<button class="chip" data-sev="" aria-pressed="' + (sevFilter === null) + '">all</button>';
    html += '</div>';
    if (sevFilter) list = list.filter(function (f) { return f.sev === sevFilter; });
  }

  list.forEach(function (f) {
    var i = FINDINGS.indexOf(f);
    html += '<button class="find ' + f.sev + '" data-find="' + i + '">' +
      '<span class="find-head">' +
        '<span class="find-sev">' + (f.sev === "good" ? "good" : f.sev) + '</span>' +
        '<span class="find-title">' + esc(f.title) + '</span>' +
        (f.node ? '<span class="find-where">' + esc(byId[f.node].short) + '</span>' : '') +
      '</span>' +
      '<span class="find-body">' + esc(f.body) + '</span>' +
      '<span class="find-ev">' + esc(f.ev) + '</span>' +
    '</button>';
  });

  if (!list.length) html += '<p style="color:var(--ink-3);">Nothing recorded at this severity.</p>';
  return html;
}

function renderPanel() {
  var html = "";

  if (activeTab === "find") {
    panel.innerHTML = findingsHTML(null);
    wirePanelChips(); panel.scrollTop = 0; return;
  }

  if (selectedPacket) {
    var e = selectedPacket.edge;
    html += '<div class="eyebrow">' + esc(byId[e.from].name) + ' &rarr; ' + esc(byId[e.to].name) + '</div>';
    html += '<h2>' + esc(e.pk) + '</h2>';
    html += '<div class="dek">' + esc(e.label) + ' &middot; ' + esc(FLOWS[e.flow].label.toLowerCase()) + ' path</div>';
    html += '<pre>' + esc(e.body) + '</pre>';
    html += '<div class="sec">Why it looks like this</div><p>' + esc(e.note) + '</p>';
    html += '<div class="chiprow">' +
            '<button class="chip" data-goto="' + e.from + '">Open ' + esc(byId[e.from].name) + '</button>' +
            '<button class="chip" data-goto="' + e.to + '">Open ' + esc(byId[e.to].name) + '</button>' +
            '<button class="chip" data-clear="1">Back to the system</button></div>';
    panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0; return;
  }

  if (!selectedNode) {
    html += '<div class="eyebrow">SemPKM · ' + esc(LAYOUTS[layout].label) + ' view</div>';
    html += '<h2>The Commit Loop</h2>';
    html += '<div class="dek">' + esc(LAYOUTS[layout].blurb) + '</div>';
    html += activeTab === "what" ? SYSTEM.what : activeTab === "built" ? SYSTEM.built : SYSTEM.cond;
    if (activeTab === "what") {
      html += '<div class="sec">How to read it</div>';
      html += '<p>Height is <b>' + (heightMode === "loc" ? "lines of code" : "files") +
              '</b>. Hover anything for its full name; click to open it. The dots are data in transit — click one to read the actual payload at that point in the path.</p>';
      html += '<div class="chiprow">' +
              '<button class="chip" data-goto="C">Start at the write door</button>' +
              '<button class="chip" data-pkt="4">Read a commit transaction</button>' +
              '<button class="chip" data-viol="1">Show the bypasses</button>' +
              '</div>';
    }
    panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0; return;
  }

  var n = byId[selectedNode];
  html += '<div class="eyebrow">' + esc(GROUPS.filter(function (g) { return g.id === n.grp; })[0].label) + '</div>';
  html += '<h2>' + esc(n.name) + '</h2>';
  html += '<div class="dek">' + esc(n.sub) + '</div>';

  if (activeTab === "what") {
    html += '<p>' + esc(n.does) + '</p>';
    var mine = FINDINGS.filter(function (f) { return f.node === n.id; });
    if (mine.length) {
      html += '<div class="sec">Open findings here</div>' + findingsHTML(n.id);
    }
    html += connectionsBlock(n);
  } else if (activeTab === "built") {
    html += '<p>' + esc(n.built) + '</p>' + nodeMetrics(n) + scaleBars(n);
  } else {
    n.cond.forEach(function (c) {
      var cls = c[0] === "ok" ? "ok" : c[0] === "note" ? "warn" : "";
      html += '<div class="flag ' + cls + '"><span class="lab">' + esc(c[0]) + '</span><span class="txt">' + c[1] + '</span></div>';
    });
  }

  panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0;
}

function openPacket(p) {
  selectedPacket = p; selectedNode = null;
  if (activeTab === "find") setTab("what");
  running = false; syncPlayButton();
  FLOWS[p.edge.flow].on = true; paintFlowBar();
  renderPanel(); paintState(); paintRail();
}

function wirePanelChips() {
  panel.querySelectorAll("[data-goto]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (activeTab === "find") setTab("what");
      selectNode(b.getAttribute("data-goto"));
    });
  });
  panel.querySelectorAll("[data-pkt]").forEach(function (b) {
    b.addEventListener("click", function () { openPacket(packets[parseInt(b.getAttribute("data-pkt"), 10)]); });
  });
  panel.querySelectorAll("[data-clear]").forEach(function (b) {
    b.addEventListener("click", function () {
      selectedPacket = null; selectedNode = null;
      renderPanel(); paintState(); paintRail();
    });
  });
  panel.querySelectorAll("[data-viol]").forEach(function (b) {
    b.addEventListener("click", function () {
      FLOWS.viol.on = true; paintFlowBar();
      relayout("lowy");
      renderPanel();
    });
  });
  panel.querySelectorAll("[data-sev]").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-sev");
      sevFilter = v === "" ? null : v;
      renderPanel();
    });
  });
  panel.querySelectorAll("[data-find]").forEach(function (b) {
    b.addEventListener("click", function () {
      var f = FINDINGS[parseInt(b.getAttribute("data-find"), 10)];
      if (!f.node) return;
      setTab("what"); selectNode(f.node);
    });
  });
}

function selectNode(id) {
  selectedNode = id; selectedPacket = null;
  renderPanel(); paintState(); paintRail();
  var b = railItems[id];
  if (b) b.scrollIntoView({ block: "nearest" });
}

function setTab(t) {
  activeTab = t;
  ["what","built","cond","find"].forEach(function (o) {
    document.getElementById("tab-" + o).setAttribute("aria-selected", o === t ? "true" : "false");
  });
  renderPanel();
}
["what","built","cond","find"].forEach(function (t) {
  document.getElementById("tab-" + t).addEventListener("click", function () { setTab(t); });
});

/* ============================================================
   11. CONTROLS
   ============================================================ */

var btnPlay = document.getElementById("btn-play");
function syncPlayButton() {
  btnPlay.setAttribute("aria-pressed", running ? "true" : "false");
  btnPlay.innerHTML = running ? "&#9646;&#9646;&nbsp; Pause" : "&#9654;&nbsp; Resume";
}
btnPlay.addEventListener("click", function () { running = !running; syncPlayButton(); });
document.getElementById("btn-step").addEventListener("click", function () {
  running = false; syncPlayButton(); stepBudget = 46;
});
document.getElementById("btn-reset").addEventListener("click", function () {
  resetView(); selectedNode = null; selectedPacket = null; sevFilter = null;
  document.getElementById("q").value = "";
  renderPanel(); paintState(); paintRail();
});
document.getElementById("btn-in").addEventListener("click", function () { zoomAt(1.2); });
document.getElementById("btn-out").addEventListener("click", function () { zoomAt(1/1.2); });
document.getElementById("speed").addEventListener("input", function (ev) {
  speed = parseInt(ev.target.value, 10);
});

/* angle: 14° raking through to 90° plan */
var angleOut = document.getElementById("angle-out");
document.getElementById("angle").addEventListener("input", function (ev) {
  pitchDeg = parseInt(ev.target.value, 10);
  angleOut.textContent = pitchDeg >= 89 ? "plan" : pitchDeg + "°";
  applyGeometry();
  paintState();
});

var hmodeBtn = document.getElementById("hmode");
hmodeBtn.addEventListener("click", function () {
  heightMode = heightMode === "loc" ? "files" : "loc";
  hmodeBtn.textContent = heightMode === "loc" ? "Lines of code" : "File count";
  applyGeometry(); paintState(); renderPanel();
});

/* theme: auto → light → dark */
var themeModes = ["auto", "light", "dark"], themeIdx = 0;
var themeBtn = document.getElementById("btn-theme");
themeBtn.addEventListener("click", function () {
  themeIdx = (themeIdx + 1) % 3;
  var m = themeModes[themeIdx];
  if (m === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", m);
  themeBtn.textContent = "Theme: " + m;
});

/* layout bar */
var layoutbar = document.getElementById("layoutbar");
function paintLayoutBar() {
  layoutbar.textContent = "";
  var lab = document.createElement("span");
  lab.className = "ctl-label"; lab.textContent = "Layout";
  layoutbar.appendChild(lab);
  Object.keys(LAYOUTS).forEach(function (id) {
    var b = document.createElement("button");
    b.className = "btn";
    b.setAttribute("aria-pressed", layout === id ? "true" : "false");
    b.textContent = LAYOUTS[id].label;
    b.addEventListener("click", function () {
      if (id === "lowy") { FLOWS.viol.on = true; paintFlowBar(); }
      relayout(id);
      renderPanel();
    });
    layoutbar.appendChild(b);
  });
}

/* flow bar */
var flowbar = document.getElementById("flowbar");
function paintFlowBar() {
  flowbar.textContent = "";
  var lab = document.createElement("span");
  lab.className = "ctl-label"; lab.textContent = "Flows";
  flowbar.appendChild(lab);
  Object.keys(FLOWS).forEach(function (f) {
    var b = document.createElement("button");
    b.className = "btn";
    b.setAttribute("aria-pressed", FLOWS[f].on ? "true" : "false");
    b.innerHTML = '<span class="swatch"></span>' + FLOWS[f].label;
    if (f === "viol") b.style.borderColor = "var(--sev-high)";
    b.addEventListener("click", function () {
      FLOWS[f].on = !FLOWS[f].on;
      paintFlowBar(); paintState();
    });
    flowbar.appendChild(b);
  });
}

/* keyboard */
document.addEventListener("keydown", function (ev) {
  if (ev.target.tagName === "INPUT") {
    if (ev.key === "Escape") { ev.target.value = ""; paintRail(); ev.target.blur(); }
    return;
  }
  if (ev.key === "Escape") {
    selectedNode = null; selectedPacket = null;
    renderPanel(); paintState(); paintRail();
  } else if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    var order = [];
    GROUPS.forEach(function (g) {
      NODES.filter(function (n) { return n.grp === g.id; }).forEach(function (n) { order.push(n.id); });
    });
    var i = order.indexOf(selectedNode);
    i = ev.key === "ArrowDown" ? (i + 1) % order.length : (i <= 0 ? order.length - 1 : i - 1);
    if (activeTab === "find") setTab("what");
    selectNode(order[i]);
  } else if (ev.key === " ") {
    ev.preventDefault(); running = !running; syncPlayButton();
  }
});

/* ============================================================
   12. BOOT
   ============================================================ */

document.getElementById("find-badge").textContent =
  FINDINGS.filter(function (f) { return f.sev === "high"; }).length;

LAYOUTS.survey.build();
buildScene();
applyGeometry();
paintTopbar();
buildRail();
paintLayoutBar();
paintFlowBar();
resetView();
renderPanel();
paintState();
paintRail();
syncPlayButton();
requestAnimationFrame(tick);

window.addEventListener("resize", function () {
  clearTimeout(window.__rt);
  window.__rt = setTimeout(resetView, 160);
});
</script>
