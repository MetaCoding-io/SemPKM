      '<dt>Lines</dt><dd>' + NODES.reduce(function (s, n) { return s + n.loc; }, 0).toLocaleString() + '</dd>' +
      (byDeg[0] ? '<dt>Most connected</dt><dd>' + esc(byDeg[0].name) + ' · ' + byDeg[0].degree + '</dd>' : '') +
      (bySize[0] ? '<dt>Largest</dt><dd>' + esc(bySize[0].name) + ' · ' + bySize[0].loc.toLocaleString() + ' lines</dd>' : '') +
      '</dl>';

    var ext = (rec.external || []).filter(function (e) { return byIdSystem(e.to_node); });
    if (ext.length) {
      html += '<div class="sec">Imports leaving this part</div><div class="chiprow">';
      ext.slice(0, 12).forEach(function (e) {
        html += '<button class="chip" data-out="' + esc(e.to_node) + '">' +
                esc(byIdSystem(e.to_node).short) + ' · ' + e.count + '</button>';
      });
      html += '</div><p style="color:var(--ink-3);font-size:11px;">These are drawn on the system view, not here. Opening one leaves this part.</p>';
    }
    if (!EDGES.length) {
      html += '<div class="flag warn"><span class="lab">Note</span><span class="txt">' +
              'No imports between these files were resolved. Either they genuinely do not ' +
              'reference each other, or they are not Python — only Python imports are parsed today.' +
              '</span></div>';
    }
    html += '<div class="chiprow"><button class="chip" data-exit="1">&#9666; Back to the system</button></div>';
    panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0; return;
  }

  if (!selectedNode) {
    html += '<div class="eyebrow">' + esc(MODEL.repo.name) + ' · ' +
            esc(LAYOUTS[layout].label) + ' view</div>';
    html += '<h2>' + esc(MODEL.repo.headline || MODEL.repo.name) + '</h2>';
    html += '<div class="dek">' + esc(LAYOUTS[layout].blurb) + '</div>';
    html += activeTab === "what" ? SYSTEM.what : activeTab === "built" ? SYSTEM.built : SYSTEM.cond;
    if (activeTab === "what") {
      html += '<div class="sec">How to read it</div>';
      html += '<p>Height is <b>' + (heightMode === "loc" ? "lines of code" : "files") +
              '</b>. Hover anything for its full name; click to open it. The dots are data in transit — click one to read the actual payload at that point in the path.</p>';
      html += '<div class="chiprow">' +
              '<button class="chip" data-goto="C">Start at the write door</button>' +
              '<button class="chip" data-pkt="4">Read a commit transaction</button>' +
              '<button class="chip" data-viol="1">Show the bypasses</button>' +
              '</div>';
    }
    panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0; return;
  }

  var n = byId[selectedNode];
  var grpRec = GROUPS.filter(function (g) { return g.id === n.grp; })[0];
  html += '<div class="eyebrow">' + esc(grpRec ? grpRec.label : (n.grp || "")) + '</div>';
  html += '<h2>' + esc(n.name) + '</h2>';
  html += '<div class="dek">' + esc(n.sub) + '</div>';

  if (activeTab === "what") {
    html += '<p>' + esc(n.does) + '</p>';
    var mine = FINDINGS.filter(function (f) { return f.node === n.id; });
    if (mine.length) {
      html += '<div class="sec">Open findings here</div>' + findingsHTML(n.id);
    }
    html += connectionsBlock(n);
  } else if (activeTab === "built") {
    html += '<p>' + esc(n.built) + '</p>' + nodeMetrics(n) +
            decisionsBlock(targetKeyOf(n)) + scaleBars(n);
  } else {
    n.cond.forEach(function (c) {
      var cls = c[0] === "ok" ? "ok" : c[0] === "note" ? "warn" : "";
      html += '<div class="flag ' + cls + '"><span class="lab">' + esc(c[0]) + '</span><span class="txt">' + c[1] + '</span></div>';
    });
  }

  panel.innerHTML = html; wirePanelChips(); panel.scrollTop = 0;
}

function openPacket(p) {
  selectedPacket = p; selectedNode = null; selectedItem = null;
  if (openPage) closeStatPage();
  if (!TABSETS.edge.some(function (t) { return t.id === activeTab; })) activeTab = "payload";
  running = false; syncPlayButton();
  FLOWS[p.edge.flow].on = true; paintFlowBar();
  renderPanel(); paintState(); paintRail();
}

function wirePanelChips() {
  panel.querySelectorAll("[data-goto]").forEach(function (b) {
    b.addEventListener("click", function () {
      selectNode(b.getAttribute("data-goto"));
    });
  });
  panel.querySelectorAll("[data-pkt]").forEach(function (b) {
    b.addEventListener("click", function () { openPacket(packets[parseInt(b.getAttribute("data-pkt"), 10)]); });
  });
  panel.querySelectorAll("[data-up]").forEach(function (b) {
    b.addEventListener("click", goUp);
  });
  panel.querySelectorAll("[data-exit]").forEach(function (b) {
    b.addEventListener("click", exitDrill);
  });
  panel.querySelectorAll("[data-out]").forEach(function (b) {
    b.addEventListener("click", function () {
      var target = b.getAttribute("data-out");
      exitDrill();
      selectNode(target);
    });
  });
  panel.querySelectorAll("[data-clear]").forEach(function (b) {
    b.addEventListener("click", function () {
      selectedPacket = null; selectedNode = null;
      renderPanel(); paintState(); paintRail();
    });
  });
  panel.querySelectorAll("[data-viol]").forEach(function (b) {
    b.addEventListener("click", function () {
      FLOWS.viol.on = true; paintFlowBar();
      relayout("lowy");
      renderPanel();
    });
  });
  panel.querySelectorAll("[data-unlink]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (selectedItem) linkRemove(selectedItem.page, selectedItem.id,
                                   b.getAttribute("data-unlink"));
    });
  });
  panel.querySelectorAll("[data-link]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (selectedItem) openPicker(selectedItem.page, selectedItem.id);
    });
  });
  panel.querySelectorAll("[data-adddec]").forEach(function (b) {
    b.addEventListener("click", function () {
      openItemPicker("decisions", b.getAttribute("data-target"));
    });
  });
  panel.querySelectorAll("[data-undec]").forEach(function (b) {
    b.addEventListener("click", function (ev) {
      /* the button lives inside a <summary>; without this the details toggles */
      ev.preventDefault(); ev.stopPropagation();
      linkRemove("decisions", b.getAttribute("data-undec"), b.getAttribute("data-target"));
    });
  });
  panel.querySelectorAll("[data-backlist]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (selectedItem) openStatPage(selectedItem.page);
    });
  });
  panel.querySelectorAll("[data-find]").forEach(function (b) {
    b.addEventListener("click", function () {
      var f = FINDINGS[parseInt(b.getAttribute("data-find"), 10)];
      if (!f.node) return;
      setTab("what"); selectNode(f.node);
    });
  });
}

function selectNode(id) {
  selectedNode = id; selectedPacket = null; selectedItem = null;
  if (openPage) closeStatPage();
  renderPanel(); paintState(); paintRail();
  var b = railItems[id];
  if (b) b.scrollIntoView({ block: "nearest" });
}

/* An edge and a part are different kinds of thing, so they get different tabs.
   Selecting an edge used to leave 'How it's built' and 'Condition' rendering
   nothing at all. Findings used to be a fourth tab in every set; it is a list
   of its own now, behind the topbar count, so the tab is gone from all three. */
var TABSETS = {
  main: [{ id: "what",  label: "What it does" },
         { id: "built", label: "How it's built" },
         { id: "cond",  label: "Condition" }],
  edge: [{ id: "payload", label: "Payload" },
         { id: "route",   label: "Route" },
         { id: "ends",    label: "Endpoints" }],
  item: [{ id: "item", label: "Detail" }]
};

function currentTabSet() {
  if (selectedItem) return TABSETS.item;
  return selectedPacket ? TABSETS.edge : TABSETS.main;
}

function buildTabs() {
  var set = currentTabSet();
  if (!set.some(function (t) { return t.id === activeTab; })) activeTab = set[0].id;
  var bar = document.getElementById("tabs");
  bar.textContent = "";
  set.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", activeTab === t.id ? "true" : "false");
    b.textContent = t.label;
    b.addEventListener("click", function () { setTab(t.id); });
    bar.appendChild(b);
  });
}

function setTab(t) { activeTab = t; buildTabs(); renderPanel(); }

/* ============================================================
   10b. STAT PAGES — what a topbar number actually counts

   A number in the topbar is a dead end. Each declared page turns one into a
   searchable list; opening an item shows it in the inspector, where its links
   to parts, files and symbols can be corrected. Corrections are held here and
   written back to overlay/links.yml, so the next build keeps them.
   ============================================================ */

var PAGES = MODEL.pages || {};
var openPage = null;         /* page id while the list is showing */
var selectedItem = null;     /* { page: id, id: itemId } */
var pvTag = "";              /* active facet, e.g. a severity */

var pvRoot  = document.getElementById("pageview");
var pvList  = document.getElementById("pv-list");
var pvQ     = document.getElementById("pv-q");
var pvSave  = document.getElementById("pv-save");

var EDIT_KEY = "repolens:" + MODEL.repo.name + ":links";
var EDITS = readEdits();

function readEdits() {
  try { return JSON.parse(localStorage.getItem(EDIT_KEY)) || {}; }
  catch (e) { return {}; }
}
function writeEdits() {
  try { localStorage.setItem(EDIT_KEY, JSON.stringify(EDITS)); } catch (e) {}
  paintSaveButton();
}
function editCount() {
  var n = 0;
  Object.keys(EDITS).forEach(function (p) {
    Object.keys(EDITS[p]).forEach(function (i) {
      n += (EDITS[p][i].add || []).length + (EDITS[p][i].remove || []).length;
    });
  });
  return n;
}

/* ---- link targets: 'part:C', 'file:path', 'sym:path#name' ---- */

function tkey(l) { return (l.kind || "part") + ":" + l.to; }
function parseTarget(s) {
  var i = s.indexOf(":");
  return i < 0 ? { kind: "part", to: s } : { kind: s.slice(0, i), to: s.slice(i + 1) };
}
function targetName(t) {
  if (t.kind === "part") {
    var n = MODEL.nodes.filter(function (x) { return x.id === t.to; })[0];
    return n ? n.name : t.to;
  }
  if (t.kind === "sym") {
    var h = t.to.split("#");
    return (h[1] || t.to) + " ()";
  }
  return t.to.split("/").pop();
}

/* The model's links with this session's uncommitted edits laid over them —
   the same merge the build does, so what you see now is what the next build
   produces. */
function itemLinks(pageId, item) {
  var e = (EDITS[pageId] || {})[item.id] || {};
  var rm = e.remove || [];
  var out = (item.links || []).filter(function (l) { return rm.indexOf(tkey(l)) < 0; });
  (e.add || []).forEach(function (k) {
    if (out.some(function (l) { return tkey(l) === k; })) return;
    var t = parseTarget(k);
    out.push({ to: t.to, kind: t.kind, why: [], src: "authored", pending: true });
  });
  return out;
}

function editSlot(pageId, itemId) {
  if (!EDITS[pageId]) EDITS[pageId] = {};
  if (!EDITS[pageId][itemId]) EDITS[pageId][itemId] = { add: [], remove: [] };
  return EDITS[pageId][itemId];
}
function dropIfEmpty(pageId, itemId) {
  var s = EDITS[pageId] && EDITS[pageId][itemId];
  if (!s) return;
  if (!(s.add || []).length && !(s.remove || []).length) delete EDITS[pageId][itemId];
  if (EDITS[pageId] && !Object.keys(EDITS[pageId]).length) delete EDITS[pageId];
}

function linkAdd(pageId, itemId, key) {
  var s = editSlot(pageId, itemId);
  s.remove = (s.remove || []).filter(function (k) { return k !== key; });
  if ((s.add || []).indexOf(key) < 0) s.add.push(key);
  dropIfEmpty(pageId, itemId); writeEdits(); afterEdit();
}
function linkRemove(pageId, itemId, key) {
  var s = editSlot(pageId, itemId);
  var wasPending = (s.add || []).indexOf(key) >= 0;
  s.add = (s.add || []).filter(function (k) { return k !== key; });
  /* removing a link this session added is an undo, not a suppression */
  if (!wasPending && (s.remove || []).indexOf(key) < 0) s.remove.push(key);
  dropIfEmpty(pageId, itemId); writeEdits(); afterEdit();
}
function afterEdit() { renderPanel(); if (openPage) renderPageList(); }

/* ---- search: every token must appear; earlier hits rank higher ---- */

function tokens(q) {
  return q.toLowerCase().split(/\s+/).filter(function (t) { return t; });
}
function score(hay, title, toks) {
  if (!toks.length) return 0;
  var s = 0;
  for (var i = 0; i < toks.length; i++) {
    var at = hay.indexOf(toks[i]);
    if (at < 0) return -1;
    s += title.indexOf(toks[i]) >= 0 ? at : at + 400;
  }
  return s;
}

function itemHay(it) {
  if (it._hay) return it._hay;
  var meta = (it.meta || []).map(function (m) { return m[1]; }).join(" ");
  it._hay = (it.id + " " + it.title + " " + (it.body || "") + " " + meta).toLowerCase();
  it._t = (it.id + " " + it.title).toLowerCase();
  return it._hay;
}

function searchItems(page, q) {
  var toks = tokens(q);
  var out = [];
  page.items.forEach(function (it) {
    var s = score(itemHay(it), it._t, toks);
    if (s >= 0) out.push({ it: it, s: s });
  });
  if (toks.length) out.sort(function (a, b) { return a.s - b.s; });
  return out.map(function (r) { return r.it; });
}

/* ---- the list ---- */

var PV_CAP = 250;

/* Chips for whatever the items tag themselves with — severity, today. Same
   shape as the picker's type filter, and derived from the data rather than a
   list, so a page that tags itself with something else gets chips for free. */
function paintFacets(page, matched) {
  var box = document.getElementById("pv-facets");
  box.textContent = "";
  if (!page.tagged) { box.hidden = true; return; }
  box.hidden = false;
  var counts = {}, order = [], total = matched.length;
  matched.forEach(function (it) {
    if (!it.tag) return;
    if (!(it.tag in counts)) { counts[it.tag] = 0; }
    counts[it.tag]++;
  });
  page.items.forEach(function (it) {          /* page order = severity order */
    if (it.tag && order.indexOf(it.tag) < 0) order.push(it.tag);
  });
  var mk = function (tag, label, n) {
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", pvTag === tag ? "true" : "false");
    b.textContent = label;
    var s = document.createElement("span");
    s.className = "n"; s.textContent = n.toLocaleString();
    b.appendChild(s);
    if (!n && tag && pvTag !== tag) b.disabled = true;
    b.addEventListener("click", function () {
      pvTag = pvTag === tag ? "" : tag;
      renderPageList(); pvQ.focus();
    });
    box.appendChild(b);
  };
  mk("", "All", total);
  order.forEach(function (t) { mk(t, t, counts[t] || 0); });
}

function renderPageList() {
  var page = PAGES[openPage];
  if (!page) return;
  var matched = searchItems(page, pvQ.value);
  paintFacets(page, matched);
  var hits = pvTag ? matched.filter(function (it) { return it.tag === pvTag; }) : matched;
  document.getElementById("pv-count").textContent =
    hits.length === page.items.length
      ? page.items.length + " items"
      : hits.length + " of " + page.items.length;

  pvList.textContent = "";
  if (!hits.length) {
    var e = document.createElement("p");
    e.className = "pv-empty";
    e.textContent = "Nothing matches “" + pvQ.value + "”.";
    pvList.appendChild(e);
    return;
  }
  hits.slice(0, PV_CAP).forEach(function (it) {
    var links = itemLinks(openPage, it);
    var b = document.createElement("button");
    b.className = "pv-row";
    b.setAttribute("role", "listitem");
    b.setAttribute("aria-current",
      selectedItem && selectedItem.page === openPage && selectedItem.id === it.id
        ? "true" : "false");
    var id = document.createElement("span");
    if (it.tag) {
      id.className = "pv-tag " + it.tag;
      id.textContent = it.tag;
    } else {
      id.className = "pv-id";
      id.textContent = it.id.length > 9 ? "" : it.id;
    }
    var t = document.createElement("span");
    t.className = "pv-t"; t.textContent = it.title;
    var g = document.createElement("span");
    g.className = "pv-tags";
    if (links.length) {
      g.textContent = links.map(function (l) { return targetName(l); }).join(" · ");
    } else {
      g.innerHTML = '<span class="none">unlinked</span>';
    }
    b.appendChild(id); b.appendChild(t); b.appendChild(g);
    b.addEventListener("click", function () { selectItem(openPage, it.id); });
    pvList.appendChild(b);
  });
  if (hits.length > PV_CAP) {
    var m = document.createElement("p");
    m.className = "pv-more";
    m.textContent = "Showing the first " + PV_CAP + " of " + hits.length +
                    ". Narrow the search to see the rest.";
    pvList.appendChild(m);
  }
}

function openStatPage(id) {
  if (!PAGES[id]) return;
  if (openPage === id) { closeStatPage(); return; }
  openPage = id;
  var page = PAGES[id];
  document.getElementById("pv-title").textContent = page.label;
  var note = document.getElementById("pv-note");
  note.textContent = page.note || "";
  note.hidden = !page.note;
  pvQ.value = ""; pvTag = "";
  pvRoot.hidden = false; pvRoot.classList.add("open");
  paintSaveButton(); renderPageList(); paintStatBar(); renderPanel();
  pvQ.focus();
}

function closeStatPage() {
  openPage = null;
  pvRoot.classList.remove("open"); pvRoot.hidden = true;
  paintStatBar();
  if (!selectedItem) renderPanel();
}

function selectItem(pageId, itemId) {
  selectedItem = { page: pageId, id: itemId };
  selectedNode = null; selectedPacket = null;
  /* Findings is sticky across selections and renderPanel serves it before
     anything else, so an item opened while that tab was active showed the
     findings list and none of its links — no visible way to edit them. */
  activeTab = "item";
  /* and there is no point rendering into a pane the reader has collapsed */
  if (shellEl.classList.contains("insp-collapsed")) setPane("insp", false);
  renderPanel(); renderPageList(); paintState(); paintRail();
}

function currentItem() {
  if (!selectedItem) return null;
  var page = PAGES[selectedItem.page];
  if (!page) return null;
  return page.items.filter(function (i) { return i.id === selectedItem.id; })[0] || null;
}

/* ---- the inspector view of one item ---- */

function linksBlock(pageId, item) {
  var links = itemLinks(pageId, item);
  var html = '<div class="sec">Linked to</div>';
  if (!links.length) {
    html += '<p style="color:var(--ink-3);font-size:11px;">Nothing yet.</p>';
  }
  html += '<div class="lk">';
  links.forEach(function (l) {
    var t = { kind: l.kind || "part", to: l.to };
    html += '<span class="lk-chip' + (l.src === "authored" ? " authored" : "") + '">' +
      '<span class="k">' + esc(t.kind) + '</span>' +
      (t.kind === "part"
        ? '<button class="lk-nav" data-goto="' + esc(t.to) + '" title="Open this part">' +
            esc(targetName(t)) + '</button>'
        : '<span class="lk-nav as-text">' + esc(targetName(t)) + '</span>') +
      '<button class="x" title="Remove this link" data-unlink="' + esc(tkey(l)) +
        '">&times;</button></span>';
  });
  html += '<button class="lk-add" data-link="1">+ Link…</button>';
  html += '</div>';

  var matched = links.filter(function (l) { return l.src === "matched"; });
  if (matched.length) {
    html += '<p style="color:var(--ink-3);font-size:11px;margin-top:9px;">' +
      'Guessed, each from a word in the text: ' +
      matched.map(function (l) {
        return esc(targetName({ kind: "part", to: l.to })) + ' &larr; <b>' +
               esc((l.why || []).join(", ")) + '</b>';
      }).join("; ") +
      '. A text match, not a declared link — correct it here and the correction ' +
      'survives the next build.</p>';
  }
  return html;
}

function itemPanelHTML() {
  var page = PAGES[selectedItem.page], item = currentItem();
  if (!item) return "<h2>Gone</h2>";
  /* a decision id belongs in the eyebrow; a 60-character path does not */
  var html = '<div class="eyebrow">' + esc(page.label) +
             (item.id.length <= 24 ? ' · ' + esc(item.id) : '') + '</div>';
  html += '<h2>' + esc(item.title) +
          (item.tag ? '<span class="pv-tag ' + esc(item.tag) + '">' +
                      esc(item.tag) + '</span>' : '') + '</h2>';
  if (item.body && item.body !== item.title) {
    html += (item.body.indexOf("\n") >= 0 || item.body.length < 60
      ? '<pre>' + esc(item.body) + '</pre>'
      : '<p>' + esc(item.body) + '</p>');
  }
  html += linksBlock(selectedItem.page, item);
  if ((item.meta || []).length) {
    html += '<div class="sec">Detail</div><dl class="kv">';
    item.meta.forEach(function (m) {
      if (m[1]) html += '<dt>' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd>';
    });
    html += '</dl>';
  }
  html += '<div class="chiprow" style="margin-top:14px;">' +
          '<button class="chip" data-backlist="1">&#9666; Back to ' +
          esc(page.label.toLowerCase()) + '</button></div>';
  return html;
}

/* ---- the object picker ---- */

var PICK = null, pickFor = null, pickHot = 0, pickKind = "";
var pkRoot = document.getElementById("picker");
var pkQ = document.getElementById("pk-q");
var pkList = document.getElementById("pk-list");
var pkKinds = document.getElementById("pk-kinds");

/* Plural names for the kinds the index happens to hold. Anything not named
   here still gets a filter chip, under its own id. */
var KIND_LABEL = { part: "Parts", file: "Files", sym: "Symbols" };

function pickIndex() {
  if (PICK) return PICK;
  PICK = [];
  MODEL.nodes.forEach(function (n) {
    PICK.push({ kind: "part", key: "part:" + n.id, name: n.name, sub: n.sub || n.id });
  });
  var drill = MODEL.drill || {};
  Object.keys(drill).forEach(function (nid) {
    (drill[nid].files || []).forEach(function (f) {
      PICK.push({ kind: "file", key: "file:" + f.path, name: f.name, sub: f.path });
    });
  });
  var syms = MODEL.symbols || {};
  Object.keys(syms).forEach(function (p) {
    (syms[p].symbols || []).forEach(function (s) {
      PICK.push({ kind: "sym", key: "sym:" + p + "#" + s.name,
                  name: s.name, sub: s.kind + " · " + p });
    });
  });
  PICK.forEach(function (r) { r.hay = (r.name + " " + r.sub).toLowerCase(); });
  PICK_KINDS = [];
  PICK.forEach(function (r) {
    if (PICK_KINDS.indexOf(r.kind) < 0) PICK_KINDS.push(r.kind);
  });
  return PICK;
}
var PICK_KINDS = [];

/* The same modal, run over a different index, because linking is symmetric:
   from a decision you pick the thing it is about, and from a thing you pick
   the decision. Both write the same record. */
var pickRows = [], pickChoose = null;

function showPicker(title, sub, placeholder) {
  document.getElementById("pk-title").textContent = title;
  document.getElementById("pk-sub").textContent = sub;
  pkQ.placeholder = placeholder;
  pickKind = ""; pickHot = 0;
  PICK_KINDS = [];
  pickRows.forEach(function (r) {
    if (PICK_KINDS.indexOf(r.kind) < 0) PICK_KINDS.push(r.kind);
  });
  pkQ.value = "";
  pkRoot.hidden = false; pkRoot.classList.add("open");
  renderPicker(); pkQ.focus();
}

function openPicker(pageId, itemId) {
  pickRows = pickIndex();
  pickChoose = function (key) { linkAdd(pageId, itemId, key); };
  showPicker("Link to…", pickRows.length.toLocaleString() + " objects",
             "Part, file or symbol…");
}

function openItemPicker(pageId, targetKey) {
  var page = PAGES[pageId];
  if (!page || !targetKey) return;
  var taken = {};
  decisionsFor(targetKey).forEach(function (m) { taken[m.it.id] = 1; });
  /* `kind` groups the filter chips; `badge` is what the row shows. For a
     decision the useful thing in that column is its code, and repeating the
     word "decisions" on all 395 rows only crowded the title. */
  pickRows = page.items.filter(function (it) { return !taken[it.id]; })
    .map(function (it) {
      return { kind: it.tag || pageId, badge: it.tag || it.id,
               key: it.id, name: it.title,
               sub: (it.meta && it.meta[0] && it.meta[0][1]) || "",
               hay: (it.id + " " + it.title + " " + (it.body || "")).toLowerCase() };
    });
  pickChoose = function (itemId) { linkAdd(pageId, itemId, targetKey); };
  showPicker("Link a " + page.label.toLowerCase().replace(/s$/, "") + "…",
             pickRows.length.toLocaleString() + " not yet linked here",
             "Search " + page.label.toLowerCase() + "…");
}
function closePicker() {
  pkRoot.classList.remove("open"); pkRoot.hidden = true; pickFor = null;
}

/* Counts are of what the current search matches, not of the whole index, so
   the chips answer "how much of this is a file?" for the query in hand. */
function paintKindChips(counts, total) {
  pkKinds.textContent = "";
  /* one kind is not a filter */
  if (PICK_KINDS.length < 2) { pkKinds.hidden = true; return; }
  pkKinds.hidden = false;
  var mk = function (kind, label, n) {
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", pickKind === kind ? "true" : "false");
    b.textContent = label;
    var s = document.createElement("span");
    s.className = "n"; s.textContent = n.toLocaleString();
    b.appendChild(s);
    /* never disable the active chip — that would trap the filter on a kind
       the current query has none of, with no way to click back out */
    if (!n && kind && pickKind !== kind) b.disabled = true;
    b.addEventListener("click", function () {
      pickKind = pickKind === kind ? "" : kind;
      pickHot = 0; renderPicker(); pkQ.focus();
    });
    pkKinds.appendChild(b);
  };
  mk("", "All", total);
  PICK_KINDS.forEach(function (k) {
    mk(k, KIND_LABEL[k] || k, counts[k] || 0);
  });
}

function renderPicker() {
  var toks = tokens(pkQ.value);
  var rows = [], counts = {}, total = 0;
  pickRows.forEach(function (r) {
    var s = score(r.hay, r.name.toLowerCase(), toks);
    if (s < 0) return;
    counts[r.kind] = (counts[r.kind] || 0) + 1;
    total++;
    if (!pickKind || r.kind === pickKind) rows.push({ r: r, s: s });
  });
  if (toks.length) rows.sort(function (a, b) { return a.s - b.s; });
  paintKindChips(counts, total);
  var shown = rows.length;
  rows = rows.slice(0, 60);
  if (pickHot >= rows.length) pickHot = 0;

  pkList.textContent = "";
  rows.forEach(function (row, i) {
    var b = document.createElement("button");
    b.className = "pk-row" + (i === pickHot ? " hot" : "");
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", i === pickHot ? "true" : "false");
    var k = document.createElement("span");
    k.className = "kind"; k.textContent = row.r.badge || row.r.kind;
    k.title = row.r.badge || row.r.kind;
    var n = document.createElement("span");
    n.className = "nm";
    n.textContent = row.r.name + " ";
    var sm = document.createElement("small");
    sm.textContent = row.r.sub;
    n.appendChild(sm);
    b.appendChild(k); b.appendChild(n);
    b.addEventListener("click", function () { choosePick(row.r.key); });
    pkList.appendChild(b);
  });
  if (!rows.length) {
    var e = document.createElement("p");
    e.className = "pv-empty";
    e.textContent = pickKind && total
      ? "No " + (KIND_LABEL[pickKind] || pickKind).toLowerCase() +
        " match, but " + total + " other object" + (total === 1 ? "" : "s") + " do."
      : "No object matches.";
    pkList.appendChild(e);
  } else if (shown > rows.length) {
    var m = document.createElement("p");
    m.className = "pv-more";
    m.textContent = "Showing " + rows.length + " of " + shown + " matches.";
    pkList.appendChild(m);
  }
  pkList._rows = rows;
}

function choosePick(key) {
  if (pickChoose) pickChoose(key);
  closePicker();
}

/* ---- writing the edits back ---- */

function paintSaveButton() {
  var n = editCount();
  pvSave.hidden = !n;
  pvSave.textContent = n === 1 ? "Save 1 edit" : "Save " + n + " edits";
}

function editsToYaml() {
  var out = ["# repolens link overrides — written from the page.",
             "# Targets: part:ID, file:PATH, sym:PATH#NAME. A bare id means a part."];
  Object.keys(EDITS).sort().forEach(function (p) {
    out.push(p + ":");
    Object.keys(EDITS[p]).sort().forEach(function (i) {
      var s = EDITS[p][i];
      out.push("  " + JSON.stringify(i) + ":");
      ["add", "remove"].forEach(function (f) {
        if ((s[f] || []).length) {
          out.push("    " + f + ": [" +
            s[f].map(function (k) { return JSON.stringify(k); }).join(", ") + "]");
        }
      });
    });
  });
  return out.join("\n") + "\n";
}

var toastEl = document.getElementById("toast"), toastT = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
}

/* Served by `repolens serve` → write the file. Opened as a file, or published
   as an artifact where fetch is blocked outright → put the patch on the
   clipboard instead, so the edits still have somewhere to go. */
function saveEdits() {
  var yaml = editsToYaml();
  var done = function () {
    toast("Saved to overlay/links.yml — rebuild to see it in the drawing.");
  };
  var fallback = function () {
    var copy = navigator.clipboard && navigator.clipboard.writeText(yaml);
    if (copy && copy.then) {
      copy.then(function () {
        toast("No server here — links.yml copied to the clipboard. " +
              "Paste it into .repolens/overlay/links.yml.");
      }, function () { toast("Could not copy. Run `repolens serve` to save directly."); });
    } else {
      toast("No server here. Run `repolens serve` to save edits to the file.");
    }
  };
  try {
    fetch("_repolens/links", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(EDITS)
    }).then(function (r) { r.ok ? done() : fallback(); }, fallback);
  } catch (e) { fallback(); }
}

/* ---- wiring ---- */

pvQ.addEventListener("input", renderPageList);
pvSave.addEventListener("click", saveEdits);
document.getElementById("pv-close").addEventListener("click", closeStatPage);
pkQ.addEventListener("input", function () { pickHot = 0; renderPicker(); });
pkRoot.addEventListener("click", function (e) { if (e.target === pkRoot) closePicker(); });
pkQ.addEventListener("keydown", function (e) {
  var rows = pkList._rows || [];
  if (e.key === "ArrowDown") { pickHot = Math.min(pickHot + 1, rows.length - 1); renderPicker(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { pickHot = Math.max(pickHot - 1, 0); renderPicker(); e.preventDefault(); }
  else if (e.key === "Enter" && rows[pickHot]) { choosePick(rows[pickHot].r.key); e.preventDefault(); }
  else if (e.key === "Escape") { closePicker(); e.stopPropagation(); }
});

/* group legend — the key to the colours, and a way to isolate one group */
var legendEl = document.getElementById("legend");
var groupFocus = null;

function paintLegend() {
  legendEl.textContent = "";
  if (colourMode !== "group" || !GROUPS.length) { legendEl.style.display = "none"; return; }
  legendEl.style.display = "flex";
  var lab = document.createElement("span");
  lab.className = "ctl-label"; lab.textContent = "Groups";
  legendEl.appendChild(lab);
  GROUPS.forEach(function (g) {
    var count = NODES.filter(function (n) { return n.grp === g.id; }).length;
    if (!count) return;
    var b = document.createElement("button");
    b.className = "btn";
    b.setAttribute("aria-pressed", groupFocus === g.id ? "true" : "false");
    b.title = "Show only " + g.label;
    var key = document.createElement("span");
    key.className = "key";
    key.style.background = groupColour(g.id);
    b.appendChild(key);
    b.appendChild(document.createTextNode(g.label + " · " + count));
    b.addEventListener("click", function () {
      groupFocus = (groupFocus === g.id) ? null : g.id;
      paintLegend(); paintState();
    });
    legendEl.appendChild(b);
  });
}

/* flow bar */
var flowbar = document.getElementById("flowbar");
function paintFlowBar() {
  flowbar.textContent = "";
  var lab = document.createElement("span");
  lab.className = "ctl-label"; lab.textContent = "Flows";
  flowbar.appendChild(lab);
  Object.keys(FLOWS).forEach(function (f) {
    var b = document.createElement("button");
    b.className = "btn";
    b.setAttribute("aria-pressed", FLOWS[f].on ? "true" : "false");
    b.innerHTML = '<span class="swatch"></span>' + FLOWS[f].label;
    if (f === "viol") b.style.borderColor = "var(--sev-high)";
    b.addEventListener("click", function () {
      FLOWS[f].on = !FLOWS[f].on;
      paintFlowBar(); paintState();
    });
    flowbar.appendChild(b);
  });
}

/* ---- collapsible panes ---- */
var shellEl = document.getElementById("shell");
var PANES = {
  rail: { cls: "rail-collapsed", btn: "rail-toggle", open: "◂", shut: "▸" },
  insp: { cls: "insp-collapsed", btn: "insp-toggle", open: "▸", shut: "◂" }
};

function setPane(which, collapsed, skipStore) {
  var p = PANES[which];
  shellEl.classList.toggle(p.cls, collapsed);
  var btn = document.getElementById(p.btn);
  btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
  btn.textContent = collapsed ? p.shut : p.open;
  btn.title = (collapsed ? "Expand" : "Collapse") +
              (which === "rail" ? " parts index  [" : " inspector  ]");
  if (!skipStore) {
    try { localStorage.setItem("repolens.pane." + which, collapsed ? "1" : "0"); } catch (e) {}
  }
  /* the canvas just changed width — reframe it */
  clearTimeout(window.__rt);
  window.__rt = setTimeout(resetView, 170);
}

function togglePane(which) {
  setPane(which, !shellEl.classList.contains(PANES[which].cls));
}

Object.keys(PANES).forEach(function (which) {
  document.getElementById(PANES[which].btn)
    .addEventListener("click", function () { togglePane(which); });
  var saved = null;
  try { saved = localStorage.getItem("repolens.pane." + which); } catch (e) {}
  setPane(which, saved === "1", true);
});

/* keyboard */
document.addEventListener("keydown", function (ev) {
  if (ev.target.tagName !== "INPUT" && (ev.key === "[" || ev.key === "]")) {
    ev.preventDefault();
    togglePane(ev.key === "[" ? "rail" : "insp");
    return;
  }
  if (ev.target.tagName === "INPUT") {
    if (ev.key === "Escape") {
      var wasEmpty = !ev.target.value;
      ev.target.value = "";
      if (ev.target === pvQ) { renderPageList(); if (wasEmpty) closeStatPage(); }
      else { paintRail(); }
      ev.target.blur();
    }
    return;
  }
  if (ev.key === "Escape") {
    if (!pkRoot.hidden) { closePicker(); return; }
    if (openPage) { closeStatPage(); return; }
    if (selectedItem) { selectedItem = null; renderPanel(); return; }
    if (inDrill() && !selectedNode && !selectedPacket) { goUp(); return; }
    selectedNode = null; selectedPacket = null;
    renderPanel(); paintState(); paintRail();
  } else if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    var order = [];
    GROUPS.forEach(function (g) {
      NODES.filter(function (n) { return n.grp === g.id; }).forEach(function (n) { order.push(n.id); });
    });
    var i = order.indexOf(selectedNode);
    i = ev.key === "ArrowDown" ? (i + 1) % order.length : (i <= 0 ? order.length - 1 : i - 1);
    selectNode(order[i]);
  } else if (ev.key === " ") {
    ev.preventDefault(); running = !running; syncPlayButton();
  }
});

/* ============================================================
   12. BOOT
   ============================================================ */

runLayout();
buildScene();
applyGeometry();
paintTopbar();
svg.setAttribute("aria-label",
  "Axonometric drawing of the " + MODEL.repo.name + " repository");
buildRail(); buildEdgeRail();
paintLayoutBar();
layoutBarReady = true;
paintFlowBar();
paintLegend();
resetView();
renderPanel();
paintState();
paintRail();
syncPlayButton();
requestAnimationFrame(tick);

window.addEventListener("resize", function () {
  clearTimeout(window.__rt);
  window.__rt = setTimeout(resetView, 160);
});

/* ============================================================
   12b. INSIDE A PART

   Double-clicking a part swaps the whole dataset for its files and the
   imports between them, and hands it to a layout registered for drill scope.
   Everything downstream — bundling, packets, the rail, the inspector — is
   unchanged, because it only ever reads NODES/EDGES/GROUPS.
   ============================================================ */

var SYSTEM_DATA = { nodes: NODES, edges: EDGES, groups: GROUPS };

function buildDrillData(nodeId) {
  var rec = (MODEL.drill || {})[nodeId];
  if (!rec || !rec.files || !rec.files.length) return null;
  var parent = byId[nodeId];

  var degree = {};
  (rec.edges || []).forEach(function (e) {
    degree[e.from] = (degree[e.from] || 0) + 1;
    degree[e.to] = (degree[e.to] || 0) + 1;
  });

  var dirs = {};
  var nodes = rec.files.map(function (f) {
    var slash = f.id.lastIndexOf("/");
    var dir = slash >= 0 ? f.id.slice(0, slash) : "(top level)";
    dirs[dir] = true;
    var inbound = (rec.edges || []).filter(function (e) { return e.to === f.id; }).length;
    var outbound = (rec.edges || []).filter(function (e) { return e.from === f.id; }).length;
    return {
      id: f.id, key: "", path: f.path,
      short: f.name.replace(/\.[a-z]+$/, ""), name: f.name,
      grp: dir, layer: parent.layer, tier: parent.tier,
      loc: f.lines || 0, files: 1,
      degree: degree[f.id] || 0,
      x: 0, y: 0, w: 2, d: 2,
      sub: f.path,
      does: (f.lines || 0).toLocaleString() + " lines of " + (f.lang || "source") +
            ". " + (outbound ? "Imports " + outbound + " sibling" + (outbound === 1 ? "" : "s") : "Imports no siblings") +
            "; " + (inbound ? "imported by " + inbound : "imported by none") + " inside this part.",
      built: "Path: " + f.path + ". Its place in " + parent.name +
             ", which holds " + rec.files.length + " files and " +
             (rec.edges || []).length + " imports between them.",
      cond: [["measured", "Imports resolved by parsing the file, not by matching text."]]
    };
  });

  var edges = (rec.edges || []).map(function (e) {
    return {
      from: e.from, to: e.to, flow: "import",
      label: "imports", pk: e.from + " → " + e.to,
      body: "# " + e.from + "\n\nfrom ." + e.to.replace(/\.py$/, "").replace(/\//g, ".") +
            " import ...\n\n# resolved against this part's own files;\n" +
            "# an import that left the part is not drawn here.",
      note: "One edge per import that resolves to a sibling file. Imports that " +
            "leave this part are counted on the system drawing instead."
    };
  });

  return {
    nodes: nodes, edges: edges,
    groups: Object.keys(dirs).sort().map(function (d) { return { id: d, label: d }; })
  };
}

function rebuildForDataset(layoutId) {
  byId = {};
  NODES.forEach(function (n) { byId[n.id] = n; });
  FLAGGED = computeFlagged();
  layout = layoutId;
  hideEdgePop();
  selectedNode = null; selectedPacket = null; hoveredNode = null;
  colourCache = {};
  buildBundles();
  buildScene();
  runLayout();
  syncAngleRange();
  applyGeometry();
  buildRail(); buildEdgeRail();
  paintLayoutBar();
  paintFlowBar();
  paintLegend();
  paintCrumbs();
  resetView();
  renderPanel(); paintState(); paintRail();
}

function zoomInto(nodeId, done) {
  var n = byId[nodeId];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!n || reduce) { done(); return; }
  var apex = (n._faces || boxFaces(n)).apex;
  var r = stage.getBoundingClientRect();
  var k0 = view.k, tx0 = view.tx, ty0 = view.ty;
  var k1 = k0 * 3.2;
  var tx1 = r.width / 2 - apex[0] * k1, ty1 = r.height / 2 - apex[1] * k1;
  var t0 = null, dur = 360;
  function step(t) {
    if (t0 === null) t0 = t;
    var u = Math.min(1, (t - t0) / dur);
    var e = u < 0.5 ? 2 * u * u : -1 + (4 - 2 * u) * u;
    view.k = k0 + (k1 - k0) * e;
    view.tx = tx0 + (tx1 - tx0) * e;
    view.ty = ty0 + (ty1 - ty0) * e;
    applyView();
    if (u < 1) requestAnimationFrame(step);
    else done();
  }
  requestAnimationFrame(step);
}

function enterPart(nodeId) {
  if (inDrill()) return;
  var data = buildDrillData(nodeId);
  if (!data) return;

  zoomInto(nodeId, function () {
    VIEW.prev = {
      layout: layout,
      flows: {},
      angle: pitchDeg
    };
    Object.keys(FLOWS).forEach(function (f) {
      VIEW.prev.flows[f] = FLOWS[f].on;
      FLOWS[f].on = (f === "import");
    });
    VIEW.mode = "part";
    VIEW.node = nodeId;
    NODES = data.nodes; EDGES = data.edges; GROUPS = data.groups;
    rebuildForDataset("inside");
    svg.style.opacity = "0";
    requestAnimationFrame(function () {
      svg.style.transition = "opacity 180ms linear";
      svg.style.opacity = "1";
      setTimeout(function () { svg.style.transition = ""; }, 220);
    });
  });
}

function buildSymbolData(path) {
  var rec = (MODEL.symbols || {})[path];
  if (!rec || !rec.symbols || !rec.symbols.length) return null;

  var degree = {};
  (rec.edges || []).forEach(function (e) {
    degree[e.from] = (degree[e.from] || 0) + 1;
    degree[e.to] = (degree[e.to] || 0) + 1;
  });

  var groups = {};
  var nodes = rec.symbols.map(function (sym) {
    /* methods gather under their class; everything else under its kind */
    var grp = sym.parent || sym.kind;
    groups[grp] = true;
    var calls = (rec.edges || []).filter(function (e) { return e.from === sym.id; }).length;
    var called = (rec.edges || []).filter(function (e) { return e.to === sym.id; }).length;
    return {
      id: sym.id, key: "", short: sym.name, name: sym.name,
      grp: grp, layer: null, tier: 0,
      loc: sym.lines || 1, files: 1, degree: degree[sym.id] || 0,
      line: sym.line, endLine: sym.end_line, kind: sym.kind,
      x: 0, y: 0, w: 2, d: 2,
      sub: sym.kind + " · lines " + sym.line + "–" + sym.end_line,
      does: (sym.doc ? sym.doc + " " : "") +
            (sym.lines || 0) + " lines. " +
            (calls ? "Calls " + calls + " " : "Calls nothing ") +
            (called ? "· called by " + called + " here." : "· called by nothing here."),
      built: "A " + sym.kind + (sym.parent ? " of " + sym.parent : "") +
             ", lines " + sym.line + " to " + sym.end_line + " of " + path + ".",
      cond: rec.approx
        ? [["note", "Regex-derived. JS and TS symbols are approximate — the line " +
                    "span comes from brace counting, not a parser."]]
        : [["measured", "From the file's syntax tree, not a text match."]]
    };
  });

  var edges = (rec.edges || []).map(function (e) {
    return {
      from: e.from, to: e.to, flow: "import",
      label: "calls", pk: e.from + " → " + e.to,
      body: "# " + path + "\n\n" + e.from + " calls " + e.to +
            "\n\n# a call to a name defined in this same file;\n" +
            "# calls that leave the file are not drawn here.",
      note: "Same-file calls only. An attribute call resolves when the name is " +
            "unambiguous in the file, and is dropped rather than guessed when it is not."
    };
  });

  return {
    nodes: nodes, edges: edges,
    groups: Object.keys(groups).sort().map(function (g) { return { id: g, label: g }; })
  };
}

function enterFile(fileNode) {
  var path = fileNode.path;
  var data = path && buildSymbolData(path);
  if (!data) return;
  zoomInto(fileNode.id, function () {
    VIEW.parentPart = VIEW.node;
    VIEW.mode = "file";
    VIEW.path = path;
    VIEW.fileName = fileNode.name;
    NODES = data.nodes; EDGES = data.edges; GROUPS = data.groups;
    rebuildForDataset("callgraph");
    svg.style.opacity = "0";
    requestAnimationFrame(function () {
      svg.style.transition = "opacity 180ms linear";
      svg.style.opacity = "1";
      setTimeout(function () { svg.style.transition = ""; }, 220);
    });
  });
}

/* Escape and the breadcrumb both climb one level. */
function goUp() {
  if (VIEW.mode === "file") {
    var back = VIEW.parentPart;
    VIEW.mode = "system"; VIEW.node = null; VIEW.path = null;
    NODES = SYSTEM_DATA.nodes; EDGES = SYSTEM_DATA.edges; GROUPS = SYSTEM_DATA.groups;
    byId = {}; NODES.forEach(function (n) { byId[n.id] = n; });
    enterPart(back);
    return;
  }
  exitDrill();
}

function exitDrill() {
  if (!inDrill()) return;
  var prev = VIEW.prev || {};
  Object.keys(FLOWS).forEach(function (f) {
    if (prev.flows && f in prev.flows) FLOWS[f].on = prev.flows[f];
  });
  VIEW.mode = "system"; VIEW.node = null;
  NODES = SYSTEM_DATA.nodes; EDGES = SYSTEM_DATA.edges; GROUPS = SYSTEM_DATA.groups;
  rebuildForDataset(prev.layout || "survey");
}

var crumbs = document.getElementById("crumbs");

function paintCrumbs() {
  crumbs.textContent = "";
  if (!inDrill()) { crumbs.style.display = "none"; return; }
  crumbs.style.display = "flex";
  var back = document.createElement("button");
  back.className = "btn";
  back.innerHTML = "&#9666;&nbsp; " + esc(MODEL.repo.name);
  back.addEventListener("click", exitDrill);
  crumbs.appendChild(back);
  var partId = VIEW.mode === "file" ? VIEW.parentPart : VIEW.node;
  var parent = SYSTEM_DATA.nodes.filter(function (n) { return n.id === partId; })[0];

  if (VIEW.mode === "file") {
    var up = document.createElement("button");
    up.className = "btn";
    up.textContent = parent ? parent.name : partId;
    up.addEventListener("click", goUp);
    crumbs.appendChild(up);
  }

  var here = document.createElement("span");
  here.className = "crumb-here";
  here.textContent = VIEW.mode === "file"
    ? VIEW.fileName + " · " + NODES.length + " symbols · " + EDGES.length + " calls"
    : "inside " + (parent ? parent.name : VIEW.node) +
      " · " + NODES.length + " files · " + EDGES.length + " imports";
  crumbs.appendChild(here);
}

/* ============================================================
   13. PUBLIC HOOK

   Everything a layout author needs, and nothing else. Write one from the
   console, from a bookmarklet, or from a script tag after this one:

     repolens.registerLayout({
       id: "circle", label: "Circle",
       run: function (api) {
         api.nodes.forEach(function (n, i) {
           var a = i / api.nodes.length * Math.PI * 2;
           api.setPos(n, { x: Math.cos(a) * 14, y: Math.sin(a) * 14 });
         });
       }
     });
     repolens.relayout("circle");

   A layout may also override `height`, `route`, `box` and `maxPitch`.
   ============================================================ */

window.repolens = {
  registerLayout: registerLayout,
  relayout: relayout,
  layouts: LAYOUTS,
  model: MODEL,
  api: function () { return CURRENT_API; },
  redraw: function () { applyGeometry(); paintState(); }
};

/* Registered through the public hook rather than the internals, so the page
   itself exercises the seam a third party would use. */
repolens.registerLayout({
  id: "rings",
  label: "Rings",
  blurb: "One ring per group, smallest group innermost. No hierarchy implied — just neighbourhoods, and who reaches across them.",
  /* a radial layout wants chords, not the default right-angled ground route */
  route: function (e, api) {
    return [api.centre(api.byId[e.from]), api.centre(api.byId[e.to])];
  },
  run: function (api) {
    var groups = api.model.groups
      .map(function (g) {
        return { id: g.id, members: api.nodes.filter(function (n) { return n.grp === g.id; }) };
      })
      .filter(function (g) { return g.members.length; })
      .sort(function (a, b) { return a.members.length - b.members.length; });

    groups.forEach(function (g, gi) {
      var R = 5 + gi * 4.0;
      g.members.forEach(function (n, i) {
        var a = (i / g.members.length) * Math.PI * 2 + gi * 0.4;
        api.setPos(n, { x: Math.cos(a) * R, y: Math.sin(a) * R, z: 0, w: 2.0, d: 2.0 });
      });
    });
  }
});

/* The layout used inside a part. Files sit on rings by how connected they are,
   most-imported at the centre — for an import graph that is the thing you want
   to see first. Registered for drill scope, so it never appears at system
   level and the system layouts never appear here. */
function ringLayout(api) {
  var ordered = api.nodes.slice().sort(function (a, b) {
    return (b.degree - a.degree) || (b.loc - a.loc);
  });
  var i = 0, ring = 0;
  while (i < ordered.length) {
    var capacity = ring === 0 ? 1 : Math.max(5, ring * 6);
    var count = Math.min(capacity, ordered.length - i);
    var R = ring === 0 ? 0 : 4.8 + (ring - 1) * 4.4;
    for (var k = 0; k < count; k++) {
      var a = (k / count) * Math.PI * 2 + ring * 0.6;
      api.setPos(ordered[i + k], {
        x: Math.cos(a) * R, y: Math.sin(a) * R, z: 0, w: 1.9, d: 1.9
      });
    }
    i += count;
    ring++;
  }
}

var chordRoute = function (e, api) {
  return [api.centre(api.byId[e.from]), api.centre(api.byId[e.to])];
};

/* The third level: what is inside one file. */
repolens.registerLayout({
  id: "callgraph",
  label: "Call graph",
  scope: "file",
  blurb: "Functions, classes and methods of one file, ringed by how many of their neighbours they touch. Only calls that stay inside the file are drawn.",
  heightCap: 4.0, heightDiv: 5, heightPer: 1.2,
  route: chordRoute,
  run: ringLayout
});

repolens.registerLayout({
  id: "inside",
  label: "Inside",
  scope: "part",
  blurb: "Files of one part, ringed by how many of their siblings they touch. The most connected sits in the middle.",
  heightCap: 4.0, heightDiv: 9, heightPer: 1.2,
  route: chordRoute,
  run: ringLayout
});
</script>
