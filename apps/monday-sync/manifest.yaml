appId: "monday-sync"
name: "Monday.com Sync"
version: "0.1.0"
description: "Two-way sync between SemPKM objects and Monday.com boards"
author:
  name: "SemPKM"
license: "MIT"

dependencies:
  platform: ">=0.1.0"

permissions:
  commands:
    - "object.create"
    - "object.patch"
    - "body.set"
    - "body.diff"
    - "edge.create"
  sparql:
    read: true
  backgroundTasks: true
  network:
    - "api.monday.com"

backend:
  entrypoint: "app:monday_sync_app"

tasks:
  - id: "poll-tasks"
    description: "Poll Monday.com for updated items and sync to SemPKM"
    interval: "15m"
    retryPolicy:
      maxRetries: 3
      maxBackoff: "60s"
  - id: "push-changes"
    description: "Push local task changes back to Monday.com"
    interval: "15m"
    retryPolicy:
      maxRetries: 3
      maxBackoff: "60s"

frontend:
  staticDir: "frontend/static"
  css:
    - "styles.css"

ui:
  pages:
    - id: "settings"
      path: "/settings"
      label: "Monday.com Sync"
      icon: "columns"
      nav: "apps"
      fragment: "connect"
