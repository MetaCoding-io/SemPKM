<div class="ms-container" id="ms-container">
  <div class="ms-sidebar" id="ms-sidebar">
    <div class="ms-sidebar-header">
      <h3>Sources</h3>
      <button class="ms-btn ms-btn-icon" id="ms-toggle-add-form"
              onclick="document.getElementById('ms-add-section').classList.toggle('ms-hidden')"
              title="Add source">
        <i data-lucide="plus"></i>
      </button>
    </div>
    <div id="ms-add-section" class="ms-hidden">
      <div hx-get="/app/media-scheduler/_fragments/add-source"
           hx-trigger="load"
           hx-swap="innerHTML">
      </div>
    </div>
    <div id="ms-sources-list"
         hx-get="/app/media-scheduler/_fragments/sources"
         hx-trigger="load, sourcesChanged from:body"
         hx-swap="innerHTML">
      <div class="ms-empty-state">Loading sources…</div>
    </div>
  </div>
  <div class="ms-main" id="ms-main">
    <div class="ms-tabs" id="ms-tabs">
      <button class="ms-tab ms-tab-active" data-tab="today"
              onclick="msSelectTab(this, 'today')"
              title="Today's Plan">
        <i data-lucide="calendar"></i>
        <span>Today</span>
      </button>
      <button class="ms-tab" data-tab="episodes"
              onclick="msSelectTab(this, 'episodes')"
              title="Episodes">
        <i data-lucide="list-music"></i>
        <span>Episodes</span>
      </button>
      <button class="ms-tab" data-tab="rules"
              onclick="msSelectTab(this, 'rules')"
              title="Schedule Rules">
        <i data-lucide="sliders-horizontal"></i>
        <span>Rules</span>
      </button>
      <button class="ms-tab" data-tab="stats"
              onclick="msSelectTab(this, 'stats')"
              title="Stats">
        <i data-lucide="bar-chart-3"></i>
        <span>Stats</span>
      </button>
    </div>
    <div id="ms-tab-content"
         hx-get="/app/media-scheduler/_fragments/today"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="ms-empty-state">Loading…</div>
    </div>
  </div>
</div>

<script>
function msSelectTab(btn, tab) {
  // Update active tab styling
  var tabs = document.querySelectorAll('#ms-tabs .ms-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove('ms-tab-active');
  }
  btn.classList.add('ms-tab-active');

  // Map tab names to fragment URLs
  var urls = {
    today: '/app/media-scheduler/_fragments/today',
    episodes: '/app/media-scheduler/_fragments/items',
    rules: '/app/media-scheduler/_fragments/rules',
    stats: '/app/media-scheduler/_fragments/stats'
  };

  // Load the fragment via htmx
  var target = document.getElementById('ms-tab-content');
  if (target && urls[tab]) {
    htmx.ajax('GET', urls[tab], {target: target, swap: 'innerHTML'});
  }
}
</script>
