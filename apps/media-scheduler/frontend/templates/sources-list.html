{% if sources %}
<ul class="ms-source-list">
  {% for src in sources %}
  <li class="ms-source-item{% if src.error_count > 0 %} ms-source-error{% endif %}"
      hx-get="/app/media-scheduler/_fragments/items?source_iri={{ src.iri | urlencode }}"
      hx-target="#ms-items-list"
      hx-swap="innerHTML"
      title="{{ src.url }}">
    <div class="ms-source-info">
      <span class="ms-source-title">{{ src.title }}</span>
      <span class="ms-badge ms-badge-{{ src.source_type }}">{{ src.source_type }}</span>
    </div>
    <div class="ms-source-meta">
      {% if src.error_count > 0 %}
      <span class="ms-badge ms-badge-error" title="{{ src.last_error }}">⚠ {{ src.error_count }} error{{ 's' if src.error_count != 1 }}</span>
      {% endif %}
      <form method="post" action="/app/media-scheduler/_fragments/sources/remove"
            hx-post="/app/media-scheduler/_fragments/sources/remove"
            hx-target="#ms-sources-list"
            hx-swap="innerHTML"
            style="display:inline"
            onclick="event.stopPropagation()">
        <input type="hidden" name="source_iri" value="{{ src.iri }}">
        <button type="submit" class="ms-btn-remove" title="Remove source">
          <i data-lucide="x"></i>
        </button>
      </form>
    </div>
  </li>
  {% endfor %}
</ul>
<button class="ms-btn ms-btn-secondary ms-btn-show-all"
        hx-get="/app/media-scheduler/_fragments/items"
        hx-target="#ms-items-list"
        hx-swap="innerHTML">
  Show all items
</button>
{% else %}
<div class="ms-empty-state">
  <p>No sources yet.</p>
  <p>Click <strong>+</strong> above to add a podcast feed.</p>
</div>
{% endif %}
