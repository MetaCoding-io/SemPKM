appId: "google-calendar"
name: "Google Calendar Sync"
version: "0.1.0"
description: "Sync Google Calendar events with SemPKM objects"
author:
  name: "SemPKM"
license: "MIT"

dependencies:
  platform: ">=0.1.0"

permissions:
  commands:
    - "object.create"
    - "object.patch"
    - "body.set"
    - "edge.create"
  sparql:
    read: true
  backgroundTasks: true
  network:
    - "www.googleapis.com"
    - "oauth2.googleapis.com"
    - "accounts.google.com"

backend:
  entrypoint: "app:google_calendar_app"

tasks:
  - id: "poll-events"
    description: "Poll Google Calendar for updated events and sync to SemPKM"
    interval: "15m"
    retryPolicy:
      maxRetries: 3
      maxBackoff: "60s"
  - id: "push-changes"
    description: "Push local changes back to Google Calendar"
    interval: "15m"
    retryPolicy:
      maxRetries: 3
      maxBackoff: "60s"

frontend:
  staticDir: "frontend/static"
  css:
    - "styles.css"

ui:
  pages:
    - id: "settings"
      path: "/settings"
      label: "Google Calendar"
      icon: "calendar"
      nav: "apps"
      fragment: "connect"
