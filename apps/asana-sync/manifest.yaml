appId: "asana-sync"
name: "Asana Sync"
version: "0.1.0"
description: "Sync Asana tasks with SemPKM objects"
author:
  name: "SemPKM"
license: "MIT"

dependencies:
  platform: ">=0.1.0"

permissions:
  commands:
    - "object.create"
    - "object.patch"
    - "body.set"
    - "edge.create"
  sparql:
    read: true
  backgroundTasks: true
  network:
    - "app.asana.com"

backend:
  entrypoint: "app:asana_sync_app"

tasks:
  - id: "poll-tasks"
    description: "Poll Asana for updated tasks and sync to SemPKM"
    interval: "15m"
    retryPolicy:
      maxRetries: 3
      maxBackoff: "60s"
  - id: "push-changes"
    description: "Push local changes back to Asana"
    interval: "15m"
    retryPolicy:
      maxRetries: 3
      maxBackoff: "60s"

frontend:
  staticDir: "frontend/static"
  css:
    - "styles.css"

ui:
  pages:
    - id: "settings"
      path: "/settings"
      label: "Asana"
      icon: "check-square"
      nav: "apps"
      fragment: "connect"
