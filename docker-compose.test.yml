      retries: 5
    networks:
      - sempkm-test

  frontend:
    build: ./frontend
    ports:
      - "3901:80"
    volumes:
      - ./frontend/static:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_test_assets:/srv/built-assets
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sempkm-test

networks:
  sempkm-test:

volumes:
  rdf4j_test_data:
  sempkm_test_data:
  frontend_test_assets:
