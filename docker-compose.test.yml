# Isolated Docker Compose stack for E2E testing.
# Uses separate volumes, ports, and a fixed secret key to avoid
# conflicts with the development environment.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build
#   docker compose -f docker-compose.test.yml down -v
#

name: sempkm-test

services:
  triplestore:
    image: eclipse/rdf4j-workbench:5.0.1
    volumes:
      - rdf4j_test_data:/var/rdf4j
    environment:
      JAVA_OPTS: "-Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rdf4j-server/protocol"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sempkm-test

  api:
    build: ./backend
    ports:
      - "8901:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./backend/app:/app/app
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./backend/ontologies:/app/ontologies:ro
      - sempkm_test_data:/app/data
      - ./docs:/app/docs:ro
      - ./apps:/app/apps:ro
      - ./backend/sdk:/app/backend/sdk:ro
      - frontend_test_assets:/app/frontend_assets:ro
    environment:
      TRIPLESTORE_URL: http://triplestore:8080/rdf4j-server
      REPOSITORY_ID: sempkm_test
      BASE_NAMESPACE: https://test.example.org/data/
      DATABASE_URL: sqlite+aiosqlite:///./data/sempkm_test.db
      SECRET_KEY: e2e-test-secret-key-do-not-use-in-production
      SESSION_DURATION_DAYS: 1
      RATE_LIMIT_ENABLED: "false"
      LINEAR_API_URL: http://mock-linear:8080/graphql
      LINEAR_TOKEN_URL: http://mock-linear:8080/oauth/token
      GITHUB_API_URL: http://mock-github:8080
      JIRA_API_URL: http://mock-jira:8080
      MONDAY_API_URL: http://mock-monday:8080
      TODOIST_API_URL: http://mock-todoist:8080
      ASANA_API_URL: http://mock-asana:8080
      ASANA_TOKEN_URL: http://mock-asana:8080/-/oauth_token
      GCAL_API_URL: http://mock-google-calendar:8080
      GOOGLE_TOKEN_URL: http://mock-google-calendar:8080/oauth/token
      OUTLOOK_API_URL: http://mock-outlook:8080
      OUTLOOK_TOKEN_URL: http://mock-outlook:8080/oauth2/v2.0/token
      LLM_API_URL: http://mock-llm:8080
      APP_BASE_URL: http://localhost:8000
    depends_on:
      triplestore:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
      mock-linear:
        condition: service_healthy
      mock-github:
        condition: service_healthy
      mock-jira:
        condition: service_healthy
      mock-monday:
        condition: service_healthy
      mock-todoist:
        condition: service_healthy
      mock-asana:
        condition: service_healthy
      mock-caldav:
        condition: service_healthy
      mock-google-calendar:
        condition: service_healthy
      mock-outlook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sempkm-test

  mock-llm:
    image: python:3.12-slim
    volumes:
      - ./e2e/mock-llm-api:/app:ro
    working_dir: /app
    command: ["python", "server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - sempkm-test

  mock-linear:
    image: python:3.12-slim
    volumes:
      - ./e2e/mock-linear-api:/app:ro
    working_dir: /app
    command: ["python", "server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - sempkm-test

  mock-github:
    image: python:3.12-slim
