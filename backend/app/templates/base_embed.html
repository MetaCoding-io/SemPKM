<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SemPKM Embed{% endblock %}</title>
    <script>
    (function(){
      var s=localStorage.getItem('sempkm_theme');
      var t='light';
      if(s==='dark'){t='dark';}
      else if(s==='system'||!s){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
      document.documentElement.setAttribute('data-theme',t);
    })();
    </script>
    <link rel="stylesheet" href="{{ 'theme.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'style.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'workspace.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'views.css' | asset_url }}">
    {% if asset_manifest_available %}
    {# Production: locally-vendored, minified, content-hashed bundles #}
    <script src="{{ 'vendor.js' | asset_url }}"></script>
    {% else %}
    {# Dev mode: CDN-loaded libraries (volume-mounted raw files) #}
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://unpkg.com/lucide@0.575.0/dist/umd/lucide.min.js"></script>
    {% endif %}
    {% block head %}{% endblock %}
</head>
<body style="margin:0; padding:8px; background:var(--color-bg-primary); color:var(--color-text-primary);">
    {% block content %}{% endblock %}
    <script>if(window.lucide){lucide.createIcons();}</script>
    <script src="{{ 'markdown-render.js' | asset_url }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
