<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SemPKM{% endblock %}</title>
    <script>
    (function(){
      var s=localStorage.getItem('sempkm_theme');
      var t='light';
      if(s==='dark'){t='dark';}
      else if(s==='system'||!s){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
      document.documentElement.setAttribute('data-theme',t);
      document.documentElement.classList.add('no-transition');
    })();
    </script>
    <link rel="stylesheet" href="{{ 'theme.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'style.css' | asset_url }}">
    {# Vendor libraries — locally vendored, minified, content-hashed bundles #}
    <script src="{{ 'vendor.js' | asset_url }}"></script>
    <link rel="stylesheet" href="{{ 'vendor.css' | asset_url }}">
    <link id="hljs-theme" rel="stylesheet"
          href="{{ 'hljs-github.css' | asset_url }}"
          data-light-href="{{ 'hljs-github.css' | asset_url }}"
          data-dark-href="{{ 'hljs-github-dark.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'gridstack.css' | asset_url }}">
    <script src="{{ 'gridstack.js' | asset_url }}"></script>
    <script src="{{ 'api-fetch.js' | asset_url }}"></script>
    <script src="{{ 'posthog.js' | asset_url }}"></script>
    <script src="{{ 'auth.js' | asset_url }}"></script>
    {% block page_css %}
    <link rel="stylesheet" href="{{ 'workspace.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'forms.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'views.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'settings.css' | asset_url }}">
    <link rel="stylesheet" href="{{ 'vfs-browser.css' | asset_url }}">
    {% endblock page_css %}
    <script src="{{ 'tutorials.js' | asset_url }}"></script>
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="{% block layout_class %}dashboard-layout{% endblock %}">
        {% include "components/_sidebar.html" %}
        <main class="content-area">
            <div id="app-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% endblock %}

    <script>
        // Highlight the active sidebar link based on current URL
        function updateActiveNav() {
            var path = window.location.pathname;
            var bestLink = null;
            var bestLen = 0;
            var links = document.querySelectorAll('.sidebar-nav .nav-link');
            links.forEach(function(link) {
                link.classList.remove('active');
                var href = link.getAttribute('href');
                if (!href || href === '#') return;
                var match = (path === '/' && href === '/') ||
                            (href !== '/' && path.startsWith(href));
                if (match && href.length > bestLen) {
                    bestLen = href.length;
                    bestLink = link;
                }
            });
            if (bestLink) bestLink.classList.add('active');
        }
        updateActiveNav();
        checkAuthStatus();

        function loadDocsIframe(url, linkEl) {
            var content = document.getElementById('app-content');
            content.innerHTML = '<iframe src="' + url + '" class="docs-iframe"></iframe>';
            history.pushState(null, '', url);
            // Update active nav manually
            document.querySelectorAll('.sidebar-nav .nav-link').forEach(function(l) {
                l.classList.remove('active');
            });
            if (linkEl) linkEl.classList.add('active');
            return false;
        }
        // Update active state after htmx navigation
        document.body.addEventListener('htmx:pushedIntoHistory', updateActiveNav);
        document.body.addEventListener('htmx:historyRestore', updateActiveNav);

        // Global htmx error handler — surface 403/401 as user-visible toasts
        document.body.addEventListener('htmx:responseError', function(e) {
            var status = e.detail.xhr ? e.detail.xhr.status : 0;
            var msg = '';
            if (status === 403) {
                msg = 'Access denied — you don\u2019t have permission for this page.';
            } else if (status === 401) {
                msg = 'Session expired — please log in again.';
            } else if (status >= 500) {
                msg = 'Server error (' + status + ') — please try again later.';
            } else if (status >= 400) {
                msg = 'Request failed (' + status + ').';
            }
            if (msg) {
                _showGlobalToast(msg, status >= 500 ? 'error' : 'warning');
            }
        });

        function _showGlobalToast(message, type) {
            var toast = document.createElement('div');
            toast.className = 'sempkm-toast sempkm-toast--' + (type || 'info');
            toast.textContent = message;
            document.body.appendChild(toast);
            requestAnimationFrame(function() { toast.classList.add('sempkm-toast--visible'); });
            setTimeout(function() {
                toast.classList.remove('sempkm-toast--visible');
                setTimeout(function() { toast.remove(); }, 300);
            }, 4000);
        }
    </script>
    <script src="{{ 'cleanup.js' | asset_url }}"></script>
    <script src="{{ 'markdown-render.js' | asset_url }}"></script>
    <script src="{{ 'codemirror-markdown.js' | asset_url }}"></script>
    <script type="module" src="{{ 'editor.js' | asset_url }}"></script>
    <script src="{{ 'sidebar.js' | asset_url }}"></script>
    <script src="{{ 'theme.js' | asset_url }}"></script>
    <script src="{{ 'settings.js' | asset_url }}"></script>
    <script src="{{ 'workspace-layout.js' | asset_url }}"></script>
    <script src="{{ 'named-layouts.js' | asset_url }}"></script>
    <script src="{{ 'workspace.js' | asset_url }}"></script>
    <script src="{{ 'graph.js' | asset_url }}"></script>
    <script src="{{ 'kanban.js' | asset_url }}"></script>
    <script src="{{ 'canvas.js' | asset_url }}"></script>
    <script src="{{ 'column-prefs.js' | asset_url }}"></script>
    <script src="{{ 'dropdown-dismiss.js' | asset_url }}"></script>
    <script src="{{ 'sempkm-shims.js' | asset_url }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
