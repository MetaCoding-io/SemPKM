<div class="view-flex-column">
{% if is_generic | default(false) %}
{% include "browser/type_filter_dropdown.html" %}
{% endif %}
{% include "browser/view_toolbar.html" %}

<div class="graph-toolbar">
    <label class="layout-picker-label" for="layout-picker">Layout:</label>
    <select id="layout-picker" class="layout-picker" onchange="changeLayout(this.value)">
        {% for layout in available_layouts %}
        {% if loop.index0 == 4 and available_layouts | length > 4 %}
        <option disabled>--- Model Layouts ---</option>
        {% endif %}
        <option value="{{ layout.name }}"{% if loop.first %} selected{% endif %}>{{ layout.label }}</option>
        {% endfor %}
    </select>
    <button class="graph-fit-btn" onclick="if(SemPKM._sempkmGraph) SemPKM._sempkmGraph.fit()" title="Fit graph to view">Fit</button>
    <button class="graph-icon-toggle-btn" id="graph-icon-toggle" onclick="SemPKM._toggleGraphIcons()" title="Toggle node icons"><i data-lucide="shapes"></i> <span>Icons</span></button>
</div>

<div class="graph-isometric-wrapper" id="cy-wrapper">
    <div id="cy-container" class="graph-container" data-testid="graph-view"></div>
</div>
</div>

<script>
(function() {
    var specIri = '{{ spec_iri_encoded }}';
    var typeColors = {{ type_colors | tojson }};
    var availableLayouts = {{ available_layouts | tojson }};
    var customDataUrl = {{ graph_data_url | tojson if graph_data_url is defined and graph_data_url else 'null' }};

    var initialFilter = '{{ current_filter | e }}';

    // Wait for graph.js to be loaded, then initialize
    function tryInit() {
        if (typeof SemPKM.initGraph === 'function') {
            SemPKM.initGraph('cy-container', specIri, typeColors, availableLayouts, customDataUrl);
            // Apply carried-over filter after graph data loads
            if (initialFilter && typeof SemPKM.filterGraph === 'function') {
                setTimeout(function() { SemPKM.filterGraph(initialFilter); }, 500);
            }
        } else {
            setTimeout(tryInit, 50);
        }
    }
    tryInit();
})();
</script>
