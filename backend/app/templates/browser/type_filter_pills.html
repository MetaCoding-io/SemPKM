{# Type filter pills: shown above generic views to filter by RDF type.
   Context: types (list of dicts with 'iri' and 'label'), selected_type (str or empty),
   renderer (str — "table"/"card"/"graph"). #}

<div class="type-filter-pills" data-renderer="{{ renderer }}">
    <button class="type-pill{% if not selected_type %} active{% endif %}"
            hx-get="/browser/views/generic/{{ renderer }}"
            hx-target="closest .group-editor-area"
            hx-swap="innerHTML"
            onclick="localStorage.setItem('sempkm_generic_type_' + '{{ renderer }}', ''); return true;">
        All Types
    </button>
    {% for t in types %}
    <button class="type-pill{% if selected_type == t.iri %} active{% endif %}"
            hx-get="/browser/views/generic/{{ renderer }}?type={{ t.iri | urlencode }}"
            hx-target="closest .group-editor-area"
            hx-swap="innerHTML"
            onclick="localStorage.setItem('sempkm_generic_type_' + '{{ renderer }}', '{{ t.iri }}'); return true;">
        {{ t.label }}
    </button>
    {% endfor %}
</div>
