[project]
name = "sempkm-app-sdk"
version = "0.1.0"
description = "SemPKM App SDK — build apps for the SemPKM platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.24",
    "PyJWT>=2.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
